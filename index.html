ask": "Use <code>decide()<\/code> for p = 0.03 at \u03b1 = 0.05 and at \u03b1 = 0.01, then print H\u2080 and H\u2081 for the BMI question.", "solution": "def decide(p, alpha=0.05):\n    if p < alpha:\n        return f\"p = {p} < {alpha}: reject H0 (statistically significant)\"\n    return f\"p = {p} >= {alpha}: fail to reject H0\"\nprint(decide(0.03))\nprint(decide(0.03, alpha=0.01))\nprint(\"H0: mean BMI of athletes = mean BMI of non-athletes\")\nprint(\"H1: mean BMI of athletes != mean BMI of non-athletes\")", "expect": ["reject H0 (statistically significant)", "fail to reject H0", "H0:", "H1:"], "hint": "decide(0.03, alpha=0.01) passes a different alpha.", "figure": false, "activity": "Activity 08 \u00b7 Question 1, 8.2", "terms": [["null hypothesis H\u2080", "no relationship; patterns are chance"], ["\u03b1 (alpha)", "accepted probability of a false positive, usually 0.05"]], "note": "", "demo_error": false}, {"id": "w8-2", "title": "Confidence intervals from the SEM", "stats": "<p>Sit-and-reach for high-school females: one random sample of n = 50 with mean 35 cm and SD 10 cm. SEM = 10 / \u221a50 \u2248 1.41 cm. Since the SEM acts like one SD of the sampling distribution:<\/p><p class='formula'>$$\\mu = \\bar{x} \\pm Z \\cdot SEM$$<\/p><p>Z = 1 gives a 68% <strong>confidence interval<\/strong> (33.6 to 36.4 cm). Z = 2 gives about 95%. The exact Z for 95% is 1.96. The <strong>level of confidence<\/strong> is the chance the interval captures the true mean; its complement is \u03b1.<\/p>", "python": "<p><code>norm.ppf(0.975)<\/code> is the reverse of <code>cdf<\/code>: it finds the Z with 97.5% of the curve below it, which leaves 2.5% in each tail, so 95% in the middle.<\/p>", "demo": "import numpy as np\nfrom scipy.stats import norm\n\nn, mean, sd = 50, 35, 10\nsem = sd / np.sqrt(n)\nprint(\"SEM:\", round(sem, 2))\nprint(f\"68% CI: {mean - sem:.1f} to {mean + sem:.1f} cm\")\nprint(\"Z for 95%:\", round(norm.ppf(0.975), 3))", "starter": "import numpy as np\nfrom scipy.stats import norm\n\nn, mean, sd = 50, 35, 10\nsem = sd / np.sqrt(n)\n\n# 1. print the 95% CI using Z = 2 (2 decimals each end)\n# 2. print the 95% CI using the exact Z = norm.ppf(0.975) (2 decimals)\n# 3. print the 99% CI using norm.ppf(0.995) (2 decimals). Wider or narrower?", "task": "Compute the 95% CI for the sit-and-reach mean using Z = 2 and the exact Z, then the 99% CI.", "solution": "import numpy as np\nfrom scipy.stats import norm\nn, mean, sd = 50, 35, 10\nsem = sd / np.sqrt(n)\nprint(round(mean - 2 * sem, 2), round(mean + 2 * sem, 2))\nz = norm.ppf(0.975)\nprint(round(mean - z * sem, 2), round(mean + z * sem, 2))\nz99 = norm.ppf(0.995)\nprint(round(mean - z99 * sem, 2), round(mean + z99 * sem, 2))", "expect": ["32.17 37.83", "32.23 37.77", "31.36 38.64"], "hint": "Lower = mean \u2212 Z\u00b7SEM, upper = mean + Z\u00b7SEM.", "figure": false, "activity": "Activity 08 \u00b7 Questions 2\u20133", "terms": [["confidence interval", "range likely to contain the population mean"], ["level of confidence", "e.g. 95%; 1 \u2212 \u03b1"]], "note": "", "demo_error": false}, {"id": "w8-3", "title": "Testing a difference by resampling", "stats": "<p>Are athletes' and non-athletes' BMIs different? Pretend we have both whole populations. Repeatedly draw a sample from each, record the <strong>difference of the means<\/strong>, and look at the distribution. If H\u2080 were true, differences would center on 0. If 0 falls outside the middle 95% of differences, we reject H\u2080.<\/p>", "python": "<p><code>np.percentile(diffs, [2.5, 97.5])<\/code> gives the middle-95% range of the simulated differences, an empirical 95% CI. The share of differences \u2264 0 approximates how often chance alone could produce \"no difference\".<\/p>", "demo": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng()\nbmi = pd.read_csv(\"data/bmi_groups.csv\")\nath, non = bmi[\"athletes\"].to_numpy(), bmi[\"non_athletes\"].to_numpy()\n\ndiffs = np.array([rng.choice(non, 30).mean() - rng.choice(ath, 30).mean() for i in range(1000)])\nlo, hi = np.percentile(diffs, [2.5, 97.5])\nprint(f\"mean difference: {diffs.mean():.2f}   95% CI: {lo:.2f} to {hi:.2f}\")\nprint(\"share of differences <= 0:\", (diffs <= 0).mean())\n\nplt.hist(diffs, bins=30)\nplt.axvline(0, color=\"red\")\nplt.title(\"Non-athlete minus athlete BMI (1000 resamples, n = 30)\")\nplt.xlabel(\"Difference of means (kg/m\u00b2)\")\nplt.ylabel(\"Frequency\")\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\nbmi = pd.read_csv(\"data/bmi_groups.csv\")\nath, non = bmi[\"athletes\"].to_numpy(), bmi[\"non_athletes\"].to_numpy()\n\n# Repeat the demo with SMALL samples of 5 per group.\n# 1. print the 95% CI of the differences (2 decimals)\n# 2. print whether 0 is inside the CI  (lo <= 0 <= hi)\n# 3. print the decision: \"reject H0\" if 0 is outside, otherwise \"fail to reject H0\"", "task": "Repeat the BMI resampling with only 5 people per group. Is 0 inside the 95% interval now? Print the CI, whether 0 is inside, and your decision. This is a Type II error risk caused by too small an n.", "solution": "import numpy as np\nimport pandas as pd\nrng = np.random.default_rng()\nbmi = pd.read_csv(\"data/bmi_groups.csv\")\nath, non = bmi[\"athletes\"].to_numpy(), bmi[\"non_athletes\"].to_numpy()\ndiffs = np.array([rng.choice(non, 5).mean() - rng.choice(ath, 5).mean() for i in range(1000)])\nlo, hi = np.percentile(diffs, [2.5, 97.5])\nprint(round(lo, 2), round(hi, 2))\ninside = lo <= 0 <= hi\nprint(inside)\nprint(\"fail to reject H0\" if inside else \"reject H0\")", "expect": ["True", "fail to reject H0"], "hint": "Change 30 to 5 in both rng.choice calls. Python allows chained comparisons: lo <= 0 <= hi.", "figure": false, "activity": "Activity 08 \u00b7 Question 4, 8.4", "terms": [["difference of means", "mean of group 1 \u2212 mean of group 2"], ["NHST", "null hypothesis significance testing"]], "note": "", "demo_error": false}, {"id": "w8-4", "title": "p-values with a permutation test", "stats": "<p>We rarely have whole populations. A <strong>permutation test<\/strong> builds a model of chance from just our two samples: if H\u2080 is true, the group labels don't matter, so shuffle them, recompute the difference, and repeat. The <strong>p-value<\/strong> is the share of shuffled differences at least as extreme as the one we observed. A small p means our result would be rare if only chance were operating.<\/p>", "python": "<p><code>rng.permutation(values)<\/code> shuffles an array. <code>np.abs(...) &gt;= abs(observed)<\/code> counts both tails, which makes it a <strong>two-tailed<\/strong> test.<\/p>", "demo": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\njump = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jump[jump[\"group\"] == \"plyo\"][\"jump_cm\"].to_numpy()\nctrl = jump[jump[\"group\"] == \"control\"][\"jump_cm\"].to_numpy()\nobserved = plyo.mean() - ctrl.mean()\nprint(\"observed difference:\", round(observed, 2), \"cm\")\n\npooled = np.concatenate([plyo, ctrl])\nnull_diffs = []\nfor i in range(5000):\n    shuffled = rng.permutation(pooled)\n    null_diffs.append(shuffled[:18].mean() - shuffled[18:].mean())\np = (np.abs(null_diffs) >= abs(observed)).mean()\nprint(\"permutation p-value:\", round(p, 3))", "starter": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\njump = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jump[jump[\"group\"] == \"plyo\"][\"jump_cm\"].to_numpy()\nctrl = jump[jump[\"group\"] == \"control\"][\"jump_cm\"].to_numpy()\n\n# 1. run the permutation test (5000 shuffles) and compute the two-tailed p-value\n# 2. print whether p < 0.05\n# 3. print \"reject H0\" or \"fail to reject H0\"", "task": "Run the permutation test on the jump data and print whether p &lt; 0.05 and the matching decision.", "solution": "import numpy as np\nimport pandas as pd\nrng = np.random.default_rng()\njump = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jump[jump[\"group\"] == \"plyo\"][\"jump_cm\"].to_numpy()\nctrl = jump[jump[\"group\"] == \"control\"][\"jump_cm\"].to_numpy()\nobserved = plyo.mean() - ctrl.mean()\npooled = np.concatenate([plyo, ctrl])\nnull_diffs = []\nfor i in range(5000):\n    s = rng.permutation(pooled)\n    null_diffs.append(s[:18].mean() - s[18:].mean())\np = (np.abs(null_diffs) >= abs(observed)).mean()\nprint(round(p, 3))\nprint(p < 0.05)\nprint(\"reject H0\" if p < 0.05 else \"fail to reject H0\")", "expect": ["True", "reject H0"], "hint": "The demo already computes p. Add the comparison and an if/else (or a one-line conditional).", "figure": false, "activity": "Activity 08 \u00b7 8.4 p-value", "terms": [["p-value", "probability of data this extreme if H\u2080 were true"], ["permutation test", "shuffle labels to model chance"]], "note": "", "demo_error": false}, {"id": "w8-5", "title": "Type I and Type II errors", "stats": "<p>Decisions based on probability can be wrong. A <strong>Type I error<\/strong> (false positive) rejects a true H\u2080; its probability is \u03b1. A <strong>Type II error<\/strong> (false negative) fails to reject a false H\u2080, often because the sample was too small (low power). Causes listed in the activity include measurement error, non-random samples, a too-liberal \u03b1, investigator bias, and misused one-tailed tests.<\/p>", "python": "<p>Simulation shows that \u03b1 really is the false-positive rate. Draw two groups from the <em>same<\/em> population (so H\u2080 is true) many times, test each, and count rejections. NumPy can make all 20,000 experiments at once with a 2-D array: <code>rng.normal(0, 1, size=(20000, 25))<\/code>, then <code>.mean(axis=1)<\/code> averages each row.<\/p>", "demo": "import numpy as np\nfrom scipy.stats import norm\n\nrng = np.random.default_rng()\nn, experiments = 25, 20000\ng1 = rng.normal(0, 1, size=(experiments, n)).mean(axis=1)\ng2 = rng.normal(0, 1, size=(experiments, n)).mean(axis=1)   # same population: H0 is TRUE\nz = (g1 - g2) / np.sqrt(2 / n)                               # Z test with known SD = 1\np = 2 * norm.sf(np.abs(z))\nprint(\"share of experiments that rejected H0:\", round((p < 0.05).mean(), 3))", "starter": "import numpy as np\nfrom scipy.stats import norm\n\nrng = np.random.default_rng()\nn, experiments = 25, 20000\n\n# Same simulation, but use a liberal alpha of 0.10.\n# Print the false-positive (Type I error) rate rounded to 1 decimal.", "task": "Rerun the null simulation with \u03b1 = 0.10 and print the Type I error rate (1 decimal).", "solution": "import numpy as np\nfrom scipy.stats import norm\nrng = np.random.default_rng()\nn, experiments = 25, 20000\ng1 = rng.normal(0, 1, size=(experiments, n)).mean(axis=1)\ng2 = rng.normal(0, 1, size=(experiments, n)).mean(axis=1)\nz = (g1 - g2) / np.sqrt(2 / n)\np = 2 * norm.sf(np.abs(z))\nprint(round((p < 0.10).mean(), 1))", "expect": ["0.1"], "hint": "Only the threshold changes: (p < 0.10).mean().", "figure": false, "activity": "Activity 08 \u00b7 8.5", "terms": [["Type I error", "false positive; rejecting a true H\u2080"], ["Type II error", "false negative; missing a real effect"]], "note": "", "demo_error": false}, {"id": "w8-6", "title": "One-tailed vs. two-tailed tests", "stats": "<p>When the direction of a difference isn't predicted, a <strong>two-tailed<\/strong> test splits \u03b1 between both tails (2.5% each, so |Z| &gt; 1.96). When theory predicts the direction, a <strong>one-tailed<\/strong> test puts all 5% in one tail (Z &gt; 1.645). One-tailed tests reject more easily, which is why using one improperly is a cause of Type I errors.<\/p>", "python": "<p>For a Z statistic: two-tailed <code>p = 2 * norm.sf(abs(z))<\/code>, one-tailed <code>p = norm.sf(z)<\/code>.<\/p>", "demo": "from scipy.stats import norm\n\nprint(\"two-tailed critical Z:\", round(norm.ppf(0.975), 3))\nprint(\"one-tailed critical Z:\", round(norm.ppf(0.95), 3))\nz = 2.3\nprint(\"Z = 2.3 -> two-tailed p:\", round(2 * norm.sf(abs(z)), 4), \" one-tailed p:\", round(norm.sf(z), 4))", "starter": "from scipy.stats import norm\n\nz = 1.8\n\n# 1. print the two-tailed p (4 decimals) and its decision at alpha 0.05\n# 2. print the one-tailed p (4 decimals) and its decision at alpha 0.05", "task": "For Z = 1.8, print the two-tailed and one-tailed p-values and each decision. Why might a reviewer be suspicious if the researcher switched to one-tailed after seeing the data?", "solution": "from scipy.stats import norm\nz = 1.8\np2 = 2 * norm.sf(abs(z))\np1 = norm.sf(z)\nprint(round(p2, 4), \"reject H0\" if p2 < 0.05 else \"fail to reject H0\")\nprint(round(p1, 4), \"reject H0\" if p1 < 0.05 else \"fail to reject H0\")", "expect": ["0.0719 fail to reject H0", "0.0359 reject H0"], "hint": "p2 = 2 * norm.sf(abs(z)); p1 = norm.sf(z).", "figure": false, "activity": "Activity 08 \u00b7 Question 5", "terms": [["two-tailed test", "rejection region split across both tails"], ["one-tailed test", "all of \u03b1 in the predicted direction"]], "note": "", "demo_error": false}, {"id": "w9-1", "title": "From Z to t: when we only have a sample", "stats": "<p>In Activity 8 we used Z (the normal curve) because we pretended to know the SD. With a real sample we must <em>estimate<\/em> the SD, which adds uncertainty. The <strong>t distribution<\/strong> handles this: it looks like the normal curve but has heavier tails, and its shape depends on <strong>degrees of freedom<\/strong> (df = n \u2212 1). With small samples the critical value is bigger than 1.96; as n grows, t approaches Z.<\/p>", "python": "<p><code>stats.t.ppf(0.975, df)<\/code> gives the two-tailed 95% critical value for a given df, just like <code>norm.ppf(0.975)<\/code> did for Z. A loop prints how it shrinks toward 1.96.<\/p>", "demo": "from scipy import stats\n\nfor n in [5, 10, 24, 50, 200, 1000]:\n    print(f\"n = {n:4d}  critical t = {stats.t.ppf(0.975, n - 1):.3f}\")\nprint(\"normal Z:\", round(stats.norm.ppf(0.975), 3))", "starter": "from scipy import stats\n\n# 1. print the 95% two-tailed critical t for n = 24 (3 decimals)\n# 2. print the 99% two-tailed critical t for n = 24 (3 decimals)  (hint: 0.995)", "task": "Print the 95% and 99% two-tailed critical t values for a class of 24 students.", "solution": "from scipy import stats\nprint(round(stats.t.ppf(0.975, 23), 3))\nprint(round(stats.t.ppf(0.995, 23), 3))", "expect": ["2.069", "2.807"], "hint": "df = n \u2212 1 = 23.", "figure": false, "activity": "Statistical Testing Procedure \u00b7 step 2", "terms": [["t distribution", "a normal-like curve with heavier tails; used when the SD is estimated"], ["df", "degrees of freedom; n \u2212 1 for one sample"]], "note": "", "demo_error": false}, {"id": "w9-2", "title": "One-sample t-test by hand", "stats": "<p>Is our class's sit-and-reach different from the published norm of 35 cm? The <strong>one-sample t-test<\/strong> compares a sample mean to a fixed value:<\/p><p class='formula'>$$t = \\frac{\\bar{x} - \\mu_0}{SEM}, \\quad SEM = \\frac{s}{\\sqrt{n}}$$<\/p><p>t counts how many standard errors the sample mean is from the H\u2080 value. The p-value is the area beyond \u00b1t in the t distribution.<\/p>", "python": "<p>Every piece is something you already know how to compute. <code>stats.t.sf(abs(t), df) * 2<\/code> gives the two-tailed p.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\nn = len(sr)\nmean, sd = sr.mean(), sr.std(ddof=1)\nsem = sd / np.sqrt(n)\nprint(f\"n = {n}, mean = {mean:.2f}, SD = {sd:.2f}, SEM = {sem:.3f}\")", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\nn = len(sr)\nmean, sd = sr.mean(), sr.std(ddof=1)\nsem = sd / np.sqrt(n)\n\n# H0: the class mean = 35 cm\n# 1. compute t and print it (3 decimals)\n# 2. compute the two-tailed p-value and print it (3 decimals)", "task": "Finish the hand calculation: print t and the two-tailed p-value for H\u2080: \u03bc = 35 cm.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\nn = len(sr)\nmean, sd = sr.mean(), sr.std(ddof=1)\nsem = sd / np.sqrt(n)\nt = (mean - 35) / sem\nprint(round(t, 3))\np = 2 * stats.t.sf(abs(t), n - 1)\nprint(round(p, 3))", "expect": ["0.258", "0.799"], "hint": "t = (mean - 35) / sem; p = 2 * stats.t.sf(abs(t), n - 1).", "figure": false, "activity": "Statistical Testing Procedure \u00b7 steps 3\u20135", "terms": [["one-sample t-test", "compares a sample mean with a fixed value"]], "note": "", "demo_error": false}, {"id": "w9-3", "title": "The six-step testing procedure with SciPy", "stats": "<p>Activity 8 ended with the <strong>Statistical Testing Procedure<\/strong>: (1) state H\u2080; (2) choose \u03b1 and the test; (3) model data assuming H\u2080; (4) run the test; (5) get the p-value; (6) reject or fail to reject H\u2080. From here on, every test follows these steps.<\/p>", "python": "<p><code>stats.ttest_1samp(sample, 35)<\/code> does steps 3\u20135 at once and returns <code>.statistic<\/code> and <code>.pvalue<\/code>. Check it against your hand calculation, since knowing what's inside the box is the point. A t-based 95% CI: <code>stats.t.interval(0.95, df, loc=mean, scale=sem)<\/code>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\nalpha = 0.05                                   # step 2\nres = stats.ttest_1samp(sr, 35)                 # steps 3-5\nprint(\"t =\", round(res.statistic, 3), \" p =\", round(res.pvalue, 3))\nprint(\"reject H0\" if res.pvalue < alpha else \"fail to reject H0\")   # step 6", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\n# The ACSM norm for this age group is 32 cm. Test H0: mu = 32.\n# 1. print t and p (3 decimals)\n# 2. print the decision at alpha = 0.05\n# 3. print the 95% CI for the class mean (2 decimals): stats.t.interval(0.95, len(sr) - 1, loc=sr.mean(), scale=stats.sem(sr))", "task": "Test whether the class differs from a 32 cm norm: print t, p, the decision and the 95% CI.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\nres = stats.ttest_1samp(sr, 32)\nprint(round(res.statistic, 3), round(res.pvalue, 3))\nprint(\"reject H0\" if res.pvalue < 0.05 else \"fail to reject H0\")\nlo, hi = stats.t.interval(0.95, len(sr) - 1, loc=sr.mean(), scale=stats.sem(sr))\nprint(round(lo, 2), round(hi, 2))", "expect": ["reject H0", "31.58 39.39"], "hint": "Only the H\u2080 value changes: stats.ttest_1samp(sr, 32).", "figure": false, "activity": "Statistical Testing Procedure", "terms": [["test statistic", "a number summarizing how far the data are from H\u2080"]], "note": "", "demo_error": false}, {"id": "w9-4", "title": "Reporting results in APA style", "stats": "<p>A statistical result isn't finished until it's communicated. APA style reports the descriptive statistics, the test, df, the statistic, and p: <em>\"Class sit-and-reach (M = 35.49 cm, SD = 9.25) did not differ from the 35 cm norm, t(23) = 0.26, p = .799.\"<\/em> Note: no leading zero for p, 2 decimals for t, and p &lt; .001 for tiny values.<\/p>", "python": "<p>A function that builds the sentence makes your reports consistent. <code>f\"{p:.3f}\".lstrip(\"0\")<\/code> drops the leading zero.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\ndef apa_p(p):\n    return \"p < .001\" if p < 0.001 else \"p = \" + f\"{p:.3f}\".lstrip(\"0\")\n\nres = stats.ttest_1samp(sr, 35)\nprint(f\"M = {sr.mean():.2f} cm, SD = {sr.std():.2f}, t({len(sr)-1}) = {res.statistic:.2f}, {apa_p(res.pvalue)}\")", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\ndef apa_p(p):\n    return \"p < .001\" if p < 0.001 else \"p = \" + f\"{p:.3f}\".lstrip(\"0\")\n\n# Print an APA-style line for the test against 32 cm, in the same format as the demo.", "task": "Print an APA-style result sentence for the test against 32 cm.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsr = pd.read_csv(\"data/sit_reach_class.csv\")[\"sit_reach_cm\"]\ndef apa_p(p):\n    return \"p < .001\" if p < 0.001 else \"p = \" + f\"{p:.3f}\".lstrip(\"0\")\nres = stats.ttest_1samp(sr, 32)\nprint(f\"M = {sr.mean():.2f} cm, SD = {sr.std():.2f}, t({len(sr)-1}) = {res.statistic:.2f}, {apa_p(res.pvalue)}\")", "expect": ["M = 35.49 cm, SD = 9.25, t(23) = 1.85"], "hint": "Copy the demo's last two lines and change 35 to 32.", "figure": false, "activity": "Statistical Testing Procedure \u00b7 write-up", "terms": [["APA style", "standard format for reporting statistics in kinesiology/psychology"]], "note": "", "demo_error": false}, {"id": "w10-1", "title": "Paired t-test: the same people measured twice", "stats": "<p>Twenty athletes were tested before and after 6 weeks of plyometrics. Because each \"after\" belongs to a \"before\", the data are <strong>paired<\/strong> (dependent). The paired t-test is a one-sample t-test on the <strong>differences<\/strong>, with H\u2080: mean difference = 0. Pairing removes between-person differences, which makes it much more sensitive.<\/p>", "python": "<p><code>stats.ttest_rel(post, pre)<\/code> runs the paired test. Check it by running <code>ttest_1samp(post - pre, 0)<\/code>: the answers are identical.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\ndiff = jt[\"post_cm\"] - jt[\"pre_cm\"]\nprint(\"mean change:\", round(diff.mean(), 2), \"cm\")\nprint(stats.ttest_rel(jt[\"post_cm\"], jt[\"pre_cm\"]))\nprint(stats.ttest_1samp(diff, 0))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\n# 1. print the mean and SD of the differences (post - pre), 2 decimals\n# 2. run the paired t-test and print t (2 decimals) and whether p < 0.05\n# 3. WRONG on purpose: run an independent test stats.ttest_ind(post, pre) and print its p (3 decimals).\n#    Why is it so much larger?", "task": "Run the paired t-test on the training data, then compare its p with the (incorrect) independent-samples test.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\ndiff = jt[\"post_cm\"] - jt[\"pre_cm\"]\nprint(round(diff.mean(), 2), round(diff.std(), 2))\nres = stats.ttest_rel(jt[\"post_cm\"], jt[\"pre_cm\"])\nprint(round(res.statistic, 2), res.pvalue < 0.05)\nprint(round(stats.ttest_ind(jt[\"post_cm\"], jt[\"pre_cm\"]).pvalue, 3))", "expect": ["2.9 2.84", "4.56 True", "0.292"], "hint": "stats.ttest_rel(jt[\"post_cm\"], jt[\"pre_cm\"]).", "figure": false, "activity": "Comparing means", "terms": [["paired data", "two measurements linked to the same subject"], ["paired t-test", "one-sample t-test on the differences"]], "note": "", "demo_error": false}, {"id": "w10-2", "title": "Independent t-test (and Welch's version)", "stats": "<p>Two <em>different<\/em> groups (plyometric vs. control) are <strong>independent<\/strong>. The independent-samples t-test asks whether their means differ by more than chance. The classic version assumes equal variances; <strong>Welch's t-test<\/strong> doesn't, and it is a safe default. <code>stats.levene<\/code> tests the equal-variance assumption.<\/p><p>This is the formula-based cousin of the permutation test from Week 8, and the p-values are close.<\/p>", "python": "<p><code>stats.ttest_ind(a, b)<\/code> (Student) or <code>stats.ttest_ind(a, b, equal_var=False)<\/code> (Welch). Both return <code>.statistic<\/code> and <code>.pvalue<\/code>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njg = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jg[jg[\"group\"] == \"plyo\"][\"jump_cm\"]\nctrl = jg[jg[\"group\"] == \"control\"][\"jump_cm\"]\nprint(\"means:\", round(plyo.mean(), 2), round(ctrl.mean(), 2))\nprint(\"Student:\", stats.ttest_ind(plyo, ctrl))\nprint(\"Levene p:\", round(stats.levene(plyo, ctrl).pvalue, 3))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njg = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jg[jg[\"group\"] == \"plyo\"][\"jump_cm\"]\nctrl = jg[jg[\"group\"] == \"control\"][\"jump_cm\"]\n# 1. run Welch's t-test and print t (2 decimals) and p (3 decimals)\n# 2. print the decision at alpha = 0.05", "task": "Run Welch's t-test on plyometric vs. control jumps and print t, p and the decision.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njg = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jg[jg[\"group\"] == \"plyo\"][\"jump_cm\"]\nctrl = jg[jg[\"group\"] == \"control\"][\"jump_cm\"]\nres = stats.ttest_ind(plyo, ctrl, equal_var=False)\nprint(round(res.statistic, 2), round(res.pvalue, 3))\nprint(\"reject H0\" if res.pvalue < 0.05 else \"fail to reject H0\")", "expect": ["2.65 0.012", "reject H0"], "hint": "stats.ttest_ind(plyo, ctrl, equal_var=False).", "figure": false, "activity": "Comparing means", "terms": [["independent samples", "different people in each group"], ["Welch's t-test", "t-test that doesn't assume equal variances"]], "note": "", "demo_error": false}, {"id": "w10-3", "title": "Effect size: Cohen's d", "stats": "<p>\"Significant\" only means \"unlikely to be chance\". It says nothing about <em>how big<\/em> the difference is. With a huge n, trivial differences become significant. <strong>Cohen's d<\/strong> expresses the difference in SD units:<\/p><p class='formula'>$$d = \\frac{\\bar{x}_1 - \\bar{x}_2}{s_{pooled}}, \\quad s_{pooled} = \\sqrt{\\frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1+n_2-2}}$$<\/p><p>Rough guide: 0.2 small, 0.5 medium, 0.8 large. For paired data, d = mean difference / SD of differences.<\/p>", "python": "<p>Write it as a function so you can reuse it in your project. <code>.var(ddof=1)<\/code> is the sample variance.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njg = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jg[jg[\"group\"] == \"plyo\"][\"jump_cm\"]\nctrl = jg[jg[\"group\"] == \"control\"][\"jump_cm\"]\ndef cohens_d(a, b):\n    n1, n2 = len(a), len(b)\n    sp = np.sqrt(((n1 - 1) * a.var(ddof=1) + (n2 - 1) * b.var(ddof=1)) / (n1 + n2 - 2))\n    return (a.mean() - b.mean()) / sp\n\nprint(\"d =\", round(cohens_d(plyo, ctrl), 2))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\n# Paired effect size for the training study:\n# d = mean(post - pre) / SD(post - pre)   -> print it (2 decimals)\n# then print \"large\" if d >= 0.8, \"medium\" if d >= 0.5, \"small\" if d >= 0.2, else \"trivial\"", "task": "Compute the paired-samples Cohen's d for the training study and label its size.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\ndiff = jt[\"post_cm\"] - jt[\"pre_cm\"]\nd = diff.mean() / diff.std()\nprint(round(d, 2))\nif d >= 0.8:\n    print(\"large\")\nelif d >= 0.5:\n    print(\"medium\")\nelif d >= 0.2:\n    print(\"small\")\nelse:\n    print(\"trivial\")", "expect": ["1.02", "large"], "hint": "Use if / elif / else to label the size; check the biggest threshold first.", "figure": false, "activity": "Comparing means \u00b7 effect size", "terms": [["effect size", "how large an effect is, independent of n"], ["Cohen's d", "mean difference in pooled-SD units"]], "note": "", "demo_error": false}, {"id": "w10-4", "title": "Visualizing two groups honestly", "stats": "<p>A bar of two means hides the data. Better: show every point plus the mean and an error bar, and say whether the bar is SD (spread of people) or SEM/CI (uncertainty of the mean). This follows the chart principles from Activity 1.<\/p>", "python": "<p><code>plt.scatter<\/code> with a little horizontal jitter shows individuals; <code>plt.errorbar(x, mean, yerr=..., fmt=\"o\", capsize=6)<\/code> adds a mean \u00b1 error bar. <code>plt.xticks([0, 1], [\"plyo\", \"control\"])<\/code> labels the groups.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njg = pd.read_csv(\"data/jump_groups.csv\")\nplyo = jg[jg[\"group\"] == \"plyo\"][\"jump_cm\"]\nctrl = jg[jg[\"group\"] == \"control\"][\"jump_cm\"]\nimport matplotlib.pyplot as plt\nrng = np.random.default_rng(1)\nfor x, g in enumerate([plyo, ctrl]):\n    plt.scatter(x + rng.uniform(-0.08, 0.08, len(g)), g, alpha=0.6)\n    plt.errorbar(x + 0.25, g.mean(), yerr=1.96 * stats.sem(g), fmt=\"o\", color=\"black\", capsize=6)\nplt.xticks([0, 1], [\"plyometric\", \"control\"])\nplt.ylabel(\"Vertical jump (cm)\")\nplt.title(\"Jump height by group (mean \u00b1 95% CI)\")\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\nimport matplotlib.pyplot as plt\n\n# Draw a \"spaghetti plot\": one line per athlete from pre (x=0) to post (x=1),\n# with xticks labeled \"pre\" and \"post\", a y label with units and a title.\n# Then print how many athletes improved.", "task": "Make a pre/post spaghetti plot (one line per athlete) and print how many athletes improved.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\nimport matplotlib.pyplot as plt\nfor _, row in jt.iterrows():\n    plt.plot([0, 1], [row[\"pre_cm\"], row[\"post_cm\"]], marker=\"o\", alpha=0.6)\nplt.xticks([0, 1], [\"pre\", \"post\"])\nplt.ylabel(\"Vertical jump (cm)\")\nplt.title(\"Each athlete before and after training\")\nplt.show()\nprint((jt[\"post_cm\"] > jt[\"pre_cm\"]).sum())", "expect": ["16"], "hint": "for _, row in jt.iterrows(): plt.plot([0, 1], [row[\"pre_cm\"], row[\"post_cm\"]])", "figure": true, "activity": "Comparing means \u00b7 figures", "terms": [["error bar", "shows SD, SEM, or CI; always say which"]], "note": "", "demo_error": false}, {"id": "w11-1", "title": "Why not just run lots of t-tests?", "stats": "<p>Three training programs means three pairwise comparisons. Each test has a 5% false-positive chance, so the chance of <em>at least one<\/em> Type I error across three independent tests is 1 \u2212 0.95\u00b3 \u2248 14%. That's the <strong>familywise error rate<\/strong>. ANOVA tests all groups at once with one \u03b1.<\/p>", "python": "<p>Simulation shows the inflation. Generate three groups from the <em>same<\/em> population, run all three t-tests, and count experiments where any test is \"significant\". <code>any([...])<\/code> is True if at least one item is True.<\/p>", "demo": "import numpy as np\nfrom scipy import stats\n\nprint(\"theory, 3 tests:\", round(1 - 0.95 ** 3, 4))\nrng = np.random.default_rng()\nhits = 0\nfor i in range(2000):\n    a, b, c = rng.normal(25, 2, (3, 15))          # H0 true: same population\n    ps = [stats.ttest_ind(a, b).pvalue, stats.ttest_ind(a, c).pvalue, stats.ttest_ind(b, c).pvalue]\n    if any(p < 0.05 for p in ps):\n        hits += 1\nprint(\"simulated familywise error:\", round(hits / 2000, 3))", "starter": "# With k groups there are k*(k-1)/2 pairwise tests.\n# For k = 5 groups:\n# 1. print the number of pairwise tests\n# 2. print the familywise error rate 1 - 0.95**tests (4 decimals)", "task": "For 5 groups, print the number of pairwise t-tests and the familywise error rate.", "solution": "k = 5\ntests = k * (k - 1) // 2\nprint(tests)\nprint(round(1 - 0.95 ** tests, 4))", "expect": ["10", "0.4013"], "hint": "// is whole-number division: 5 * 4 // 2 = 10.", "figure": false, "activity": "ANOVA", "terms": [["familywise error rate", "chance of \u22651 false positive across several tests"]], "note": "", "demo_error": false}, {"id": "w11-2", "title": "One-way ANOVA: between vs. within variance", "stats": "<p>ANOVA compares variance <em>between<\/em> group means to variance <em>within<\/em> groups. It's DATA = MODEL + ERROR again, where the model is \"each group has its own mean\":<\/p><p class='formula'>$$F = \\frac{SS_{between}/(k-1)}{SS_{within}/(N-k)}$$<\/p><p>A big F means group differences are large relative to the noise. \u03b7\u00b2 = SS<sub>between<\/sub> / SS<sub>total<\/sub> is the variance accounted for by group membership, the same VAF idea as Activity 6.<\/p>", "python": "<p><code>stats.f_oneway(g1, g2, g3)<\/code> returns F and p. Computing the sums of squares yourself first shows what's inside.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\ngroups = [intervals, tempo, long_slow]\ngrand = runs[\"time_min\"].mean()\nss_between = sum(len(g) * (g.mean() - grand) ** 2 for g in groups)\nss_within = sum(((g - g.mean()) ** 2).sum() for g in groups)\nprint(\"SS between:\", round(ss_between, 2), \" SS within:\", round(ss_within, 2))\nprint(\"group means:\", [round(g.mean(), 2) for g in groups])", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\ngroups = [intervals, tempo, long_slow]\ngrand = runs[\"time_min\"].mean()\nss_between = sum(len(g) * (g.mean() - grand) ** 2 for g in groups)\nss_within = sum(((g - g.mean()) ** 2).sum() for g in groups)\n\n# 1. compute F by hand (k = 3 groups, N = 45) and print it (3 decimals)\n# 2. print F and p from stats.f_oneway (3 decimals each)\n# 3. print eta squared = ss_between / (ss_between + ss_within) (3 decimals)", "task": "Compute F by hand, confirm with <code>stats.f_oneway<\/code>, and report \u03b7\u00b2.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\ngroups = [intervals, tempo, long_slow]\ngrand = runs[\"time_min\"].mean()\nss_between = sum(len(g) * (g.mean() - grand) ** 2 for g in groups)\nss_within = sum(((g - g.mean()) ** 2).sum() for g in groups)\nF = (ss_between / 2) / (ss_within / 42)\nprint(round(F, 3))\nres = stats.f_oneway(intervals, tempo, long_slow)\nprint(round(res.statistic, 3), round(res.pvalue, 3))\nprint(round(ss_between / (ss_between + ss_within), 3))", "expect": ["3.549", "0.038", "0.145"], "hint": "df between = k \u2212 1 = 2; df within = N \u2212 k = 42.", "figure": false, "activity": "ANOVA", "terms": [["ANOVA", "analysis of variance; compares 3+ group means"], ["F ratio", "between-group variance \u00f7 within-group variance"], ["\u03b7\u00b2", "eta squared: proportion of variance explained by groups"]], "note": "", "demo_error": false}, {"id": "w11-3", "title": "Post-hoc tests: which groups differ?", "stats": "<p>A significant ANOVA says <em>some<\/em> means differ, but not which. A <strong>post-hoc<\/strong> test such as <strong>Tukey's HSD<\/strong> compares every pair while keeping the familywise error at \u03b1.<\/p>", "python": "<p><code>stats.tukey_hsd(g1, g2, g3)<\/code> prints a table of pairwise differences, p-values and CIs. Groups are numbered 0, 1, 2 in the order you pass them. <code>res.pvalue[0, 2]<\/code> reads the p for group 0 vs. group 2.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nres = stats.tukey_hsd(intervals, tempo, long_slow)\nprint(res)", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nres = stats.tukey_hsd(intervals, tempo, long_slow)\n\n# 1. print the Tukey p-value for intervals vs long_slow (3 decimals)\n# 2. print the Tukey p-value for tempo vs long_slow (3 decimals)\n# 3. print which pairs are significant at 0.05 as text, e.g. \"intervals vs long_slow\"", "task": "Use Tukey's HSD to find which pairs of programs differ in 5 km time.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nres = stats.tukey_hsd(intervals, tempo, long_slow)\nprint(round(res.pvalue[0, 2], 3))\nprint(round(res.pvalue[1, 2], 3))\nnames = [\"intervals\", \"tempo\", \"long_slow\"]\nfor i in range(3):\n    for j in range(i + 1, 3):\n        if res.pvalue[i, j] < 0.05:\n            print(names[i], \"vs\", names[j])", "expect": ["0.044", "0.912", "intervals vs long_slow"], "hint": "A loop over i and j > i covers every pair once.", "figure": false, "activity": "ANOVA \u00b7 post-hoc", "terms": [["post-hoc test", "follow-up comparisons after a significant ANOVA"], ["Tukey HSD", "pairwise test controlling familywise error"]], "note": "", "demo_error": false}, {"id": "w11-4", "title": "Plotting groups and checking assumptions", "stats": "<p>ANOVA assumes roughly normal residuals and similar variances in each group. Look before you test: a boxplot shows medians, IQRs and outliers for each group, and Levene's test checks equal variances.<\/p>", "python": "<p><code>runs.boxplot(column=\"time_min\", by=\"program\")<\/code> draws one box per group (pandas uses matplotlib underneath). <code>plt.suptitle(\"\")<\/code> removes pandas' automatic super-title.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nimport matplotlib.pyplot as plt\nruns.boxplot(column=\"time_min\", by=\"program\")\nplt.suptitle(\"\")\nplt.title(\"5 km time by training program\")\nplt.ylabel(\"Time (min)\")\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nimport matplotlib.pyplot as plt\n\n# 1. print Levene's test p-value for the three groups (3 decimals) and whether variances look equal (p > 0.05)\n# 2. draw the boxplot with a title and y label", "task": "Check the equal-variance assumption with Levene's test and draw the group boxplot.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nruns = pd.read_csv(\"data/run_programs.csv\")\nintervals = runs[runs[\"program\"] == \"intervals\"][\"time_min\"]\ntempo = runs[runs[\"program\"] == \"tempo\"][\"time_min\"]\nlong_slow = runs[runs[\"program\"] == \"long_slow\"][\"time_min\"]\nimport matplotlib.pyplot as plt\np = stats.levene(intervals, tempo, long_slow).pvalue\nprint(round(p, 3), p > 0.05)\nruns.boxplot(column=\"time_min\", by=\"program\")\nplt.suptitle(\"\")\nplt.title(\"5 km time by training program\")\nplt.ylabel(\"Time (min)\")\nplt.show()", "expect": ["True"], "hint": "stats.levene(intervals, tempo, long_slow).pvalue", "figure": true, "activity": "ANOVA \u00b7 assumptions", "terms": [["boxplot", "box = IQR, line = median, whiskers/dots = range/outliers"]], "note": "", "demo_error": false}, {"id": "w12-1", "title": "Scatter plots and the idea of correlation", "stats": "<p>So far we compared groups. Now we ask whether two <em>continuous<\/em> variables move together: does VO2max fall with age? A <strong>scatter plot<\/strong> comes first, always. Look for direction (positive or negative), form (linear or curved), strength, and outliers.<\/p>", "python": "<p><code>plt.scatter(x, y)<\/code> draws one dot per person. <code>fc.corr()<\/code> computes every pairwise correlation at once, which is a quick overview of a whole dataset.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\nplt.scatter(fc[\"age\"], fc[\"vo2max\"], alpha=0.7)\nplt.title(\"VO2max declines with age\")\nplt.xlabel(\"Age (years)\")\nplt.ylabel(\"VO2max (mL/kg/min)\")\nplt.show()\nprint(fc.corr().round(2))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\n\n# 1. scatter plot of daily_steps (x) vs vo2max (y) with title and labelled axes (units!)\n# 2. print the correlation between daily_steps and vo2max (3 decimals): fc[\"daily_steps\"].corr(fc[\"vo2max\"])", "task": "Plot daily steps against VO2max and print their correlation.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\nplt.scatter(fc[\"daily_steps\"], fc[\"vo2max\"], alpha=0.7)\nplt.title(\"Daily steps vs VO2max\")\nplt.xlabel(\"Daily steps\")\nplt.ylabel(\"VO2max (mL/kg/min)\")\nplt.show()\nprint(round(fc[\"daily_steps\"].corr(fc[\"vo2max\"]), 3))", "expect": ["0.375"], "hint": "Series.corr(other_series) gives Pearson's r.", "figure": true, "activity": "Correlation", "terms": [["scatter plot", "one dot per subject, x vs y"], ["correlation", "strength and direction of a linear relationship"]], "note": "", "demo_error": false}, {"id": "w12-2", "title": "Pearson's r by hand, and r\u00b2", "stats": "<p>Pearson's r is the average product of Z scores (using n \u2212 1):<\/p><p class='formula'>$$r = \\frac{\\sum z_x z_y}{n-1}$$<\/p><p>When both Z scores have the same sign (both above or both below average), the product is positive. r runs from \u22121 to +1. <strong>r\u00b2<\/strong> is the proportion of variance in y accounted for by x, VAF once more.<\/p>", "python": "<p>Z-score both columns, multiply them, sum, and divide. Then confirm with <code>stats.pearsonr(x, y)<\/code>, which also returns a p-value for H\u2080: r = 0.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nzx = (fc[\"age\"] - fc[\"age\"].mean()) / fc[\"age\"].std()\nzy = (fc[\"vo2max\"] - fc[\"vo2max\"].mean()) / fc[\"vo2max\"].std()\nr = (zx * zy).sum() / (len(fc) - 1)\nprint(\"r by hand:\", round(r, 3))\nprint(stats.pearsonr(fc[\"age\"], fc[\"vo2max\"]))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\n# For resting_hr vs vo2max:\n# 1. compute r by hand with Z scores (3 decimals)\n# 2. print r squared (3 decimals)\n# 3. print the pearsonr p-value and whether it is < 0.05", "task": "Compute r by hand for resting HR vs. VO2max, then r\u00b2, and test whether it differs from 0.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nzx = (fc[\"resting_hr\"] - fc[\"resting_hr\"].mean()) / fc[\"resting_hr\"].std()\nzy = (fc[\"vo2max\"] - fc[\"vo2max\"].mean()) / fc[\"vo2max\"].std()\nr = (zx * zy).sum() / (len(fc) - 1)\nprint(round(r, 3))\nprint(round(r ** 2, 3))\nres = stats.pearsonr(fc[\"resting_hr\"], fc[\"vo2max\"])\nprint(res.pvalue, res.pvalue < 0.05)", "expect": ["-0.385", "0.148", "True"], "hint": "Copy the demo and swap \"age\" for \"resting_hr\".", "figure": false, "activity": "Correlation", "terms": [["Pearson's r", "linear correlation from \u22121 to +1"], ["r\u00b2", "share of variance in y explained by x"]], "note": "", "demo_error": false}, {"id": "w12-3", "title": "Correlation is not causation (and outliers)", "stats": "<p>A correlation can arise from a <strong>confounder<\/strong> (a third variable driving both), from reverse causation, or from chance. Only a controlled experiment supports causal claims. Pearson's r is also sensitive to outliers. <strong>Spearman's \u03c1<\/strong> correlates <em>ranks<\/em> instead (like percentiles!), so it's resistant to outliers and works for ordinal data.<\/p>", "python": "<p><code>stats.spearmanr(x, y)<\/code> works like <code>pearsonr<\/code>. Adding one extreme point with <code>pd.concat<\/code> shows how fragile Pearson can be.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nx, y = fc[\"daily_steps\"], fc[\"vo2max\"]\nprint(\"Pearson:\", round(stats.pearsonr(x, y).statistic, 3), \" Spearman:\", round(stats.spearmanr(x, y).statistic, 3))\nx2 = pd.concat([x, pd.Series([60000])])     # a pedometer glitch\ny2 = pd.concat([y, pd.Series([20.0])])\nprint(\"with one outlier -> Pearson:\", round(stats.pearsonr(x2, y2).statistic, 3),\n      \" Spearman:\", round(stats.spearmanr(x2, y2).statistic, 3))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\n# 1. print Pearson r and Spearman rho between age and resting_hr (3 decimals each)\n# 2. In a print() sentence, name one possible confounder that could link age and resting HR.", "task": "Compare Pearson and Spearman for age vs. resting HR and name a possible confounder.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nprint(round(stats.pearsonr(fc[\"age\"], fc[\"resting_hr\"]).statistic, 3),\n      round(stats.spearmanr(fc[\"age\"], fc[\"resting_hr\"]).statistic, 3))\nprint(\"A possible confounder: aerobic fitness (VO2max) falls with age and also lowers resting HR.\")", "expect": ["0.226"], "hint": ".statistic gives r (or rho) from the result object.", "figure": false, "activity": "Correlation \u00b7 reasoning", "terms": [["confounder", "a third variable related to both x and y"], ["Spearman's \u03c1", "correlation of ranks"]], "note": "", "demo_error": false}, {"id": "w13-1", "title": "Simple linear regression: the trendline, formally", "stats": "<p>Regression fits the line \u0177 = b\u2080 + b\u2081x that minimizes the squared errors, the formal version of the Activity 2 trendline. The <strong>slope<\/strong> b\u2081 is the change in y per 1-unit change in x; the <strong>intercept<\/strong> b\u2080 is \u0177 at x = 0, which isn't always meaningful.<\/p>", "python": "<p><code>stats.linregress(x, y)<\/code> returns slope, intercept, rvalue, pvalue (H\u2080: slope = 0) and stderr. Predict with <code>res.intercept + res.slope * x<\/code>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nprint(f\"VO2max = {res.intercept:.2f} + ({res.slope:.3f}) x age\")\nprint(\"p for slope:\", res.pvalue)\nprint(\"R^2:\", round(res.rvalue ** 2, 3))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\n\n# 1. predict VO2max for a 50-year-old (2 decimals)\n# 2. how much VO2max is lost per DECADE of age? (slope * 10, 2 decimals)", "task": "Use the regression line to predict VO2max at age 50 and the change per decade.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nprint(round(res.intercept + res.slope * 50, 2))\nprint(round(res.slope * 10, 2))", "expect": ["48.07", "-3.02"], "hint": "prediction = res.intercept + res.slope * 50", "figure": false, "activity": "Regression", "terms": [["slope", "change in y per unit of x"], ["intercept", "predicted y when x = 0"]], "note": "", "demo_error": false}, {"id": "w13-2", "title": "Residuals: DATA = MODEL + ERROR", "stats": "<p>Each person's <strong>residual<\/strong> is observed \u2212 predicted, the ERROR in DATA = MODEL + ERROR. R\u00b2 = 1 \u2212 SS<sub>residual<\/sub> / SS<sub>total<\/sub>: the proportion of variance the line explains beyond just using the mean. A residual plot should look like a random cloud; patterns mean the line is the wrong model.<\/p>", "python": "<p>Compute predictions as a column, subtract to get residuals, and check that R\u00b2 from the sums of squares equals <code>rvalue**2<\/code>. <code>plt.axhline(0)<\/code> draws the zero line on the residual plot.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nfc[\"pred\"] = res.intercept + res.slope * fc[\"age\"]\nfc[\"resid\"] = fc[\"vo2max\"] - fc[\"pred\"]\nprint(fc[[\"age\", \"vo2max\", \"pred\", \"resid\"]].head().round(2))\nplt.scatter(fc[\"pred\"], fc[\"resid\"])\nplt.axhline(0, color=\"red\")\nplt.title(\"Residual plot\")\nplt.xlabel(\"Predicted VO2max\")\nplt.ylabel(\"Residual\")\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nfc[\"pred\"] = res.intercept + res.slope * fc[\"age\"]\nfc[\"resid\"] = fc[\"vo2max\"] - fc[\"pred\"]\n\n# 1. print the mean residual (2 decimals). Why is it ~0?\n# 2. compute R^2 = 1 - SS_resid / SS_total and print it (3 decimals)\n# 3. print rvalue**2 (3 decimals) to confirm", "task": "Compute R\u00b2 from the residuals and confirm it equals r\u00b2.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nfc[\"pred\"] = res.intercept + res.slope * fc[\"age\"]\nfc[\"resid\"] = fc[\"vo2max\"] - fc[\"pred\"]\nprint(round(fc[\"resid\"].mean(), 2))\nss_res = (fc[\"resid\"] ** 2).sum()\nss_tot = ((fc[\"vo2max\"] - fc[\"vo2max\"].mean()) ** 2).sum()\nprint(round(1 - ss_res / ss_tot, 3))\nprint(round(res.rvalue ** 2, 3))", "expect": ["0.433"], "hint": "SS_total uses distances from the mean; SS_resid uses the residuals.", "figure": false, "activity": "Regression", "terms": [["residual", "observed \u2212 predicted"], ["R\u00b2", "proportion of variance explained by the model"]], "note": "", "demo_error": false}, {"id": "w13-3", "title": "Plotting the fitted line", "stats": "<p>A regression figure shows the data and the fitted line, with the equation and R\u00b2 in the title or legend. Only draw the line across the range of the data; extrapolating beyond it is the trendline trap from Activity 2.<\/p>", "python": "<p><code>np.linspace(min, max, 100)<\/code> creates 100 evenly spaced x values for a smooth line. <code>label=<\/code> plus <code>plt.legend()<\/code> labels data vs. model.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\nres = stats.linregress(fc[\"age\"], fc[\"vo2max\"])\nxs = np.linspace(fc[\"age\"].min(), fc[\"age\"].max(), 100)\nplt.scatter(fc[\"age\"], fc[\"vo2max\"], alpha=0.6, label=\"participants\")\nplt.plot(xs, res.intercept + res.slope * xs, color=\"red\",\n         label=f\"y = {res.intercept:.1f} {res.slope:+.2f}x  (R\u00b2 = {res.rvalue**2:.2f})\")\nplt.xlabel(\"Age (years)\")\nplt.ylabel(\"VO2max (mL/kg/min)\")\nplt.title(\"VO2max vs age\")\nplt.legend()\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\n\n# Regress resting_hr (y) on vo2max (x). Plot the points and the fitted line with a legend\n# showing the equation, then print the slope (3 decimals) and R^2 (3 decimals).", "task": "Fit and plot resting HR as a function of VO2max; print the slope and R\u00b2.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nimport matplotlib.pyplot as plt\nres = stats.linregress(fc[\"vo2max\"], fc[\"resting_hr\"])\nxs = np.linspace(fc[\"vo2max\"].min(), fc[\"vo2max\"].max(), 100)\nplt.scatter(fc[\"vo2max\"], fc[\"resting_hr\"], alpha=0.6, label=\"participants\")\nplt.plot(xs, res.intercept + res.slope * xs, color=\"red\", label=f\"y = {res.intercept:.1f} {res.slope:+.2f}x\")\nplt.xlabel(\"VO2max (mL/kg/min)\")\nplt.ylabel(\"Resting HR (bpm)\")\nplt.title(\"Resting HR vs VO2max\")\nplt.legend()\nplt.show()\nprint(round(res.slope, 3), round(res.rvalue ** 2, 3))", "expect": ["0.148"], "hint": "stats.linregress(fc[\"vo2max\"], fc[\"resting_hr\"]) \u2014 x first, then y.", "figure": true, "activity": "Regression \u00b7 figure", "terms": [["extrapolation", "predicting outside the range of observed x"]], "note": "", "demo_error": false}, {"id": "w13-4", "title": "Two predictors: multiple regression", "stats": "<p>VO2max depends on age <em>and<\/em> activity. <strong>Multiple regression<\/strong> fits \u0177 = b\u2080 + b\u2081x\u2081 + b\u2082x\u2082. Each slope is the effect of that variable <em>holding the other constant<\/em>, which is one way to deal with confounders. R\u00b2 can only go up when you add predictors, so add them for a reason, not just to raise R\u00b2.<\/p>", "python": "<p>NumPy's least-squares solver fits any number of predictors. Build a matrix with a column of 1s (for the intercept) and one column per predictor: <code>X = np.column_stack([np.ones(n), x1, x2])<\/code>, then <code>coef, *_ = np.linalg.lstsq(X, y, rcond=None)<\/code>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nX = np.column_stack([np.ones(len(fc)), fc[\"age\"]])\ncoef, *_ = np.linalg.lstsq(X, fc[\"vo2max\"], rcond=None)\nprint(\"age only:\", coef.round(3))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\n# Fit vo2max ~ age + daily_steps\n# 1. print the coefficients rounded to 4 decimals (intercept, age, steps)\n# 2. compute and print R^2 (3 decimals). Compare with 0.433 for age alone.", "task": "Fit VO2max on age and daily steps; print the coefficients and R\u00b2.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nfc = pd.read_csv(\"data/fitness_cohort.csv\")\nX = np.column_stack([np.ones(len(fc)), fc[\"age\"], fc[\"daily_steps\"]])\ny = fc[\"vo2max\"]\ncoef, *_ = np.linalg.lstsq(X, y, rcond=None)\nprint(coef.round(4))\npred = X @ coef\nprint(round(1 - ((y - pred) ** 2).sum() / ((y - y.mean()) ** 2).sum(), 3))", "expect": ["0.545"], "hint": "pred = X @ coef multiplies the matrix by the coefficients (@ is matrix multiplication).", "figure": false, "activity": "Regression \u00b7 confounders", "terms": [["multiple regression", "one outcome, several predictors"], ["holding constant", "the effect of one predictor at fixed values of the others"]], "note": "", "demo_error": false}, {"id": "w14-1", "title": "Contingency tables", "stats": "<p>When both variables are categories (sport; injured or not), we count. A <strong>contingency table<\/strong> cross-tabulates the counts. Row percentages give conditional probabilities like P(injured | soccer), straight from Activity 4.<\/p>", "python": "<p><code>pd.crosstab(df[\"a\"], df[\"b\"])<\/code> counts every combination. <code>normalize=\"index\"<\/code> turns each row into proportions, and <code>margins=True<\/code> adds totals.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\nct = pd.crosstab(inj[\"sport\"], inj[\"season_outcome\"], margins=True)\nprint(ct)", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\n# 1. print the crosstab with row proportions (normalize=\"index\"), rounded to 3 decimals\n# 2. print P(injured | cross_country) on its own (3 decimals)", "task": "Print the injury table as row proportions and pull out P(injured | cross-country).", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\nrp = pd.crosstab(inj[\"sport\"], inj[\"season_outcome\"], normalize=\"index\")\nprint(rp.round(3))\nprint(round(rp.loc[\"cross_country\", \"injured\"], 3))", "expect": ["0.225", "0.34", "0.325"], "hint": "rp.loc[\"cross_country\", \"injured\"]", "figure": false, "activity": "Categorical data", "terms": [["contingency table", "counts for every combination of two categorical variables"]], "note": "", "demo_error": false}, {"id": "w14-2", "title": "Expected counts and the chi-square test", "stats": "<p>If sport and injury were independent (H\u2080), each cell's <strong>expected count<\/strong> = row total \u00d7 column total / grand total. The <strong>chi-square<\/strong> statistic adds up how far observed counts are from expected:<\/p><p class='formula'>$$\\chi^2 = \\sum \\frac{(O - E)^2}{E}$$<\/p><p>df = (rows \u2212 1)(columns \u2212 1). Each expected count should be at least 5.<\/p>", "python": "<p><code>stats.chi2_contingency(table)<\/code> returns the statistic, p-value, df and the expected counts. Compute \u03c7\u00b2 yourself from <code>.expected_freq<\/code> to see the formula at work.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\nct = pd.crosstab(inj[\"sport\"], inj[\"season_outcome\"])\nres = stats.chi2_contingency(ct)\nprint(\"expected counts if H0 is true:\")\nprint(pd.DataFrame(res.expected_freq, index=ct.index, columns=ct.columns).round(2))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\nct = pd.crosstab(inj[\"sport\"], inj[\"season_outcome\"])\nres = stats.chi2_contingency(ct)\n\n# 1. compute chi-square by hand: ((ct - res.expected_freq) ** 2 / res.expected_freq).sum().sum()  (3 decimals)\n# 2. print res.statistic (3 decimals), res.dof and the p-value (3 decimals)\n# 3. print the decision at alpha = 0.05", "task": "Compute \u03c7\u00b2 by hand, confirm with SciPy, and decide whether injury depends on sport.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ninj = pd.read_csv(\"data/sport_injuries.csv\")\nct = pd.crosstab(inj[\"sport\"], inj[\"season_outcome\"])\nres = stats.chi2_contingency(ct)\nprint(round(((ct - res.expected_freq) ** 2 / res.expected_freq).sum().sum(), 3))\nprint(round(res.statistic, 3), res.dof, round(res.pvalue, 3))\nprint(\"reject H0\" if res.pvalue < 0.05 else \"fail to reject H0\")", "expect": ["3.226", "0.199", "fail to reject H0"], "hint": "The double .sum().sum() adds down columns, then across.", "figure": false, "activity": "Categorical data", "terms": [["expected count", "row total \u00d7 column total \u00f7 N"], ["chi-square test", "tests whether two categorical variables are independent"]], "note": "", "demo_error": false}, {"id": "w14-3", "title": "Goodness of fit: is the die fair?", "stats": "<p>A <strong>goodness-of-fit<\/strong> chi-square compares observed counts with a theoretical distribution. Is a die fair? Is the Super Bowl coin fair (29 heads vs. 31 tails)? This closes the loop on Activities 1\u20132: theoretical vs. frequentist probability, now with a formal test.<\/p>", "python": "<p><code>stats.chisquare(observed, f_exp=expected)<\/code>. If <code>f_exp<\/code> is left out it assumes all categories are equally likely.<\/p>", "demo": "from scipy import stats\nres = stats.chisquare([29, 31])        # Super Bowl coin: heads, tails\nprint(\"chi2 =\", round(res.statistic, 3), \" p =\", round(res.pvalue, 3))", "starter": "from scipy import stats\n\nrolls = [7, 8, 20, 6, 9, 10]           # counts of faces 1..6 in 60 rolls of a suspicious die\n\n# 1. run a goodness-of-fit test against a fair die; print chi2 (2 decimals) and p (3 decimals)\n# 2. print the decision at alpha = 0.05", "task": "Test whether the suspicious die is fair.", "solution": "from scipy import stats\nrolls = [7, 8, 20, 6, 9, 10]\nres = stats.chisquare(rolls)\nprint(round(res.statistic, 2), round(res.pvalue, 3))\nprint(\"reject H0\" if res.pvalue < 0.05 else \"fail to reject H0\")", "expect": ["13.0", "0.023", "reject H0"], "hint": "stats.chisquare(rolls) assumes equal expected counts (10 each).", "figure": false, "activity": "Categorical data \u00b7 goodness of fit", "terms": [["goodness of fit", "do observed counts match a theoretical distribution?"]], "note": "", "demo_error": false}, {"id": "w15-1", "title": "Statistical power by simulation", "stats": "<p><strong>Power<\/strong> = 1 \u2212 P(Type II error), the chance of detecting an effect that really exists. It rises with sample size, effect size, and \u03b1. Researchers aim for \u2265 0.80 <em>before<\/em> collecting data. Simulation answers \"how many participants do I need?\" without a formula.<\/p>", "python": "<p>Simulate many studies where the effect is real, test each, and count rejections. Vectorizing with <code>size=(sims, n)<\/code> and <code>stats.ttest_ind(..., axis=1)<\/code> runs thousands of t-tests at once.<\/p>", "demo": "import numpy as np\nfrom scipy import stats\n\nrng = np.random.default_rng()\ndef power(n, d, sims=4000):\n    a = rng.normal(0, 1, (sims, n))\n    b = rng.normal(d, 1, (sims, n))          # true effect of d SDs\n    p = stats.ttest_ind(a, b, axis=1).pvalue\n    return (p < 0.05).mean()\n\nfor n in [10, 20, 30, 50]:\n    print(f\"n = {n} per group, d = 0.5 -> power = {power(n, 0.5):.2f}\")", "starter": "import numpy as np\nfrom scipy import stats\n\nrng = np.random.default_rng()\ndef power(n, d, sims=4000):\n    a = rng.normal(0, 1, (sims, n))\n    b = rng.normal(d, 1, (sims, n))\n    p = stats.ttest_ind(a, b, axis=1).pvalue\n    return (p < 0.05).mean()\n\n# For a MEDIUM effect (d = 0.5), try n = 10, 20, 30, ... (steps of 10)\n# and print the first n per group with power >= 0.80.", "task": "For a medium effect (d = 0.5), find the smallest per-group n (in steps of 10) that reaches 80% power.", "solution": "import numpy as np\nfrom scipy import stats\nrng = np.random.default_rng()\ndef power(n, d, sims=4000):\n    a = rng.normal(0, 1, (sims, n))\n    b = rng.normal(d, 1, (sims, n))\n    p = stats.ttest_ind(a, b, axis=1).pvalue\n    return (p < 0.05).mean()\nn = 10\nwhile power(n, 0.5) < 0.80:\n    n += 10\nprint(n)", "expect": ["70"], "hint": "A while loop keeps going until the condition is False: while power(n, 0.5) < 0.80: n += 10", "figure": false, "activity": "Research design \u00b7 power", "terms": [["power", "probability of detecting a real effect"], ["while loop", "repeats while a condition stays True"]], "note": "", "demo_error": false}, {"id": "w15-2", "title": "Choosing the right test", "stats": "<p>The test depends on the question and the <strong>type of data<\/strong> (Activity 4!):<\/p><ul><li>1 mean vs. a known value \u2192 one-sample t<\/li><li>2 means, same people \u2192 paired t<\/li><li>2 means, different people \u2192 independent (Welch) t<\/li><li>3+ group means \u2192 one-way ANOVA (+ Tukey)<\/li><li>2 continuous variables \u2192 correlation / regression<\/li><li>2 categorical variables \u2192 chi-square<\/li><\/ul>", "python": "<p>Encoding the decision tree as a function is good practice in <code>if<\/code>/<code>elif<\/code> logic, and a handy study aid.<\/p>", "demo": "def choose_test(outcome, groups=0, paired=False, predictor=\"group\"):\n    if outcome == \"categorical\":\n        return \"chi-square test\"\n    if predictor == \"continuous\":\n        return \"correlation / regression\"\n    if groups == 1:\n        return \"one-sample t-test\"\n    if groups == 2:\n        return \"paired t-test\" if paired else \"independent (Welch) t-test\"\n    return \"one-way ANOVA + Tukey HSD\"\n\nprint(choose_test(\"continuous\", groups=2, paired=True))\nprint(choose_test(\"categorical\"))", "starter": "def choose_test(outcome, groups=0, paired=False, predictor=\"group\"):\n    if outcome == \"categorical\":\n        return \"chi-square test\"\n    if predictor == \"continuous\":\n        return \"correlation / regression\"\n    if groups == 1:\n        return \"one-sample t-test\"\n    if groups == 2:\n        return \"paired t-test\" if paired else \"independent (Welch) t-test\"\n    return \"one-way ANOVA + Tukey HSD\"\n\n# Print the right test for each study:\n# a) grip strength of 4 different sports teams\n# b) does sleep (hours) predict sprint time?\n# c) jump height of the same players in-season vs off-season", "task": "Use <code>choose_test<\/code> to pick the test for three study designs.", "solution": "def choose_test(outcome, groups=0, paired=False, predictor=\"group\"):\n    if outcome == \"categorical\":\n        return \"chi-square test\"\n    if predictor == \"continuous\":\n        return \"correlation / regression\"\n    if groups == 1:\n        return \"one-sample t-test\"\n    if groups == 2:\n        return \"paired t-test\" if paired else \"independent (Welch) t-test\"\n    return \"one-way ANOVA + Tukey HSD\"\nprint(choose_test(\"continuous\", groups=4))\nprint(choose_test(\"continuous\", predictor=\"continuous\"))\nprint(choose_test(\"continuous\", groups=2, paired=True))", "expect": ["one-way ANOVA + Tukey HSD", "correlation / regression", "paired t-test"], "hint": "Sprint time and sleep are both continuous, so predictor=\"continuous\".", "figure": false, "activity": "Research design", "terms": [["test selection", "matching the question and data types to an analysis"]], "note": "", "demo_error": false}, {"id": "w15-3", "title": "Final project: a complete analysis", "stats": "<p>A complete analysis follows the testing procedure from start to finish: state H\u2080/H\u2081 and \u03b1, describe the data (n, mean, SD, plot), check assumptions, run the test, report an effect size and CI, and write an APA-style conclusion that a reader without your code could understand. Use your own data by uploading a CSV on the <strong>Data<\/strong> page.<\/p>", "python": "<p>The template below is the whole workflow on one page. Swap the file name, columns and test for your own question.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\njt = pd.read_csv(\"data/jump_training.csv\")\nimport matplotlib.pyplot as plt\n# 1. Hypotheses: H0 mean change = 0; H1 mean change != 0; alpha = 0.05\ndiff = jt[\"post_cm\"] - jt[\"pre_cm\"]\n# 2. Describe\nprint(f\"n = {len(diff)}, pre {jt['pre_cm'].mean():.1f} \u00b1 {jt['pre_cm'].std():.1f} cm, post {jt['post_cm'].mean():.1f} \u00b1 {jt['post_cm'].std():.1f} cm\")\n# 3. Assumption: differences roughly normal (Shapiro-Wilk)\nprint(\"Shapiro p =\", round(stats.shapiro(diff).pvalue, 3))\n# 4. Test + effect size + CI\nres = stats.ttest_rel(jt[\"post_cm\"], jt[\"pre_cm\"])\nd = diff.mean() / diff.std()\nlo, hi = sta import ast
import base64
import io
import sys
import traceback
import warnings

warnings.filterwarnings("ignore", message=".*non-interactive.*")
warnings.filterwarnings("ignore", message=".*non-GUI backend.*")
warnings.filterwarnings("ignore", category=DeprecationWarning)

FRIENDLY = [
    ("NameError", "Python doesn't know that name yet. Check the spelling (capital letters matter) and make sure the line that creates it ran above this one."),
    ("IndentationError", "The spaces at the start of a line are off. Lines inside an if / for / def need the same indent (4 spaces)."),
    ("SyntaxError", "Python couldn't read a line. Look for a missing ) ] or \" , a missing colon : after if/for/def, or = where you meant ==."),
    ("can only concatenate str", "You tried to + text and a number. Use an f-string instead: f\"mean = {m}\"."),
    ("unsupported operand", "Those two things can't be combined with that operator. Check that both are numbers (not text or None)."),
    ("KeyError", "That column or key name doesn't exist. Print df.columns to see the exact names."),
    ("FileNotFoundError", "Python can't find that file. Course files live in the data/ folder, e.g. pd.read_csv(\"data/mlb_data.csv\")."),
    ("ModuleNotFoundError", "That library isn't available here. This course uses numpy, pandas, scipy and matplotlib."),
    ("ZeroDivisionError", "Something was divided by zero. Check the denominator."),
    ("IndexError", "You asked for a position that doesn't exist. Remember Python counts from 0, so the last of 5 items is [4]."),
    ("TypeError", "A value is the wrong type for that operation. Print it, and its type(), to see what you have."),
    ("ValueError", "The value has the right type but the wrong content (e.g. text that isn't a number, or arrays of different lengths)."),
    ("AttributeError", "That object doesn't have that method or attribute. Check the spelling, or print type(x) to see what x is."),
]


def friendly(err):
    for key, msg in FRIENDLY:
        if key in err:
            return msg
    return ""


def style_charts():
    """A clean, consistent look for every chart (white background so charts print well)."""
    import matplotlib
    matplotlib.rcParams.update({
        "figure.figsize": (7, 4), "figure.dpi": 96, "axes.spines.top": False, "axes.spines.right": False,
        "axes.grid": True, "grid.color": "#e3e7ee", "grid.linewidth": 0.8, "axes.axisbelow": True,
        "axes.edgecolor": "#5b6676", "axes.titleweight": "bold", "axes.titlesize": 13,
        "axes.prop_cycle": matplotlib.cycler(color=["#0891b2", "#d97706", "#7c3aed", "#059669", "#e11d48", "#475569"]),
    })


def run(src):
    """Execute src in a fresh namespace. Shows the value of a bare last line like a notebook.
    Returns (stdout_text, error_text_or_None, hint, [png_base64...])."""
    buf = io.StringIO()
    old = sys.stdout, sys.stderr
    sys.stdout = sys.stderr = buf
    err = None
    g = {"__name__": "__main__"}
    if "matplotlib" in src:
        style_charts()
    if "pandas" in src:
        import pandas as pd
        pd.set_option("display.width", 200)          # show whole tables, no "..." columns
        pd.set_option("display.max_columns", 30)
    try:
        tree = ast.parse(src, "<your code>")
        last = None
        if tree.body and isinstance(tree.body[-1], ast.Expr):
            last = ast.Expression(tree.body.pop().value)
        exec(compile(tree, "<your code>", "exec"), g)
        if last is not None:
            val = eval(compile(last, "<your code>", "eval"), g)
            if val is not None:
                print(repr(val) if isinstance(val, str) else val)
    except BaseException as e:  # noqa: B902 - show every error to the student
        tb = traceback.extract_tb(e.__traceback__)
        lines = [f for f in tb if f.filename == "<your code>"]
        where = (" (line %d)" % lines[-1].lineno) if lines else ""
        if isinstance(e, SyntaxError) and e.lineno:
            where = " (line %d)" % e.lineno
        err = "%s%s: %s" % (type(e).__name__, where, e)
    finally:
        sys.stdout, sys.stderr = old
    figs = []
    if "matplotlib.pyplot" in sys.modules:
        plt = sys.modules["matplotlib.pyplot"]
        for num in plt.get_fignums():
            fig = plt.figure(num)
            b = io.BytesIO()
            fig.savefig(b, format="png", dpi=96, bbox_inches="tight")
            figs.append(base64.b64encode(b.getvalue()).decode())
        plt.close("all")
    return buf.getvalue(), err, (friendly(err) if err else ""), figs

  [/ == |==/, "==", "is equal? (asks, doesn't store)"], [/ != /, "!=", "is not equal?"], [/>=|<=/, ">= / <=", "at least / at most"], [/ > | < /, "> / <", "greater / less than"],
  [/ & /, "&", "AND: both True"], [/ \| /, "|", "OR: at least one True"], [/ \^ /, "^", "XOR: exactly one True"], [/ and | or |\bnot /, "and / or / not", "combine True/False"],
  [/\bf["']/, "f\"…{x}\"", "text with values filled in"], [/:\.\d+[f%]/, "{x:.2f}", "format: 2 decimals / percent"], [/\bdef\b|lambda/, "function", "reusable recipe"],
];
function stripComment(line) {
  let q = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === q && line[i - 1] !== "\\") q = null; }
    else if (c === '"' || c === "'") q = c;
    else if (c === "#") return line.slice(0, i).trimEnd();
  }
  return line;
}
function depthChange(line) {
  let d = 0, q = null;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (q) { if (c === q && line[i - 1] !== "\\") q = null; continue; }
    if (c === '"' || c === "'") q = c; else if (c === "#") break;
    else if ("([{".includes(c)) d++; else if (")]}".includes(c)) d--;
  }
  return d;
}
function explainCode(src) {
  const rows = []; let depth = 0, inDoc = false;
  src.split("\n").forEach((raw, i) => {
    const t = raw.trim(); if (!t) { return; }
    let main = "", isCom = false;
    if (inDoc) { main = "(still the docstring)"; if (/"""|'''/.test(t)) inDoc = false; }
    else if (depth > 0) main = /^[)\]}]/.test(t) ? "Closes the brackets opened above: the instruction is complete." : "Continues the instruction from the line above (inside its brackets).";
    else {
      if (/^("""|''')/.test(t) && !(t.length > 3 && /("""|''')$/.test(t.slice(3)))) inDoc = true;
      const code = t.startsWith("#") ? t : stripComment(t);
      for (const [re, f] of STATEMENTS) { const m = code.match(re); if (m) { main = f(m); break; } }
      if (t.startsWith("#")) isCom = true;
      if (!main) main = depth === 0 && i === src.trimEnd().split("\n").length - 1 ? "Shows the value of this line (Python displays a bare last line, like a calculator)." : "Runs this instruction.";
      const tail = raw.indexOf("#") > -1 && !isCom ? raw.slice(stripComment(raw).length).replace(/^\s*#\s?/, "") : "";
      if (tail) main += ` <i>Note: ${esc(tail)}</i>`;
    }
    const code = stripComment(t);
    const tools = isCom ? [] : TOOLS.filter(([re]) => re.test(" " + code + " ")).map(([, k, v]) => `<span><b>${esc(k)}</b> ${esc(v)}</span>`);
    if (!isCom) depth = Math.max(0, depth + depthChange(t));
    rows.push(`<div class="xrow ${isCom ? "com" : ""}"><div class="ln">${i + 1}</div><div class="xc">${esc(raw)}</div><div class="xe">${main}${tools.length ? `<div class="tools">${tools.slice(0, 6).join("")}</div>` : ""}</div></div>`);
  });
  return rows.join("") || '<div class="xrow"><div class="ln"></div><div class="xc"></div><div class="xe">Nothing to explain yet: write some code first.</div></div>';
}

function makeEditor(host, value) {

      extraKeys: {Tab: c => c.replaceSelection("    "), "Shift-Enter": () => host.dispatchEvent(new CustomEvent("run"))}});
    return {get: () => cm.getValue(), set: v => cm.setValue(v), on: f => cm.on("change", f)};
  }
  const ta = document.createElement("textarea"); ta.value = value; ta.spellcheck = false; host.appendChild(ta);
  ta.addEventListener("keydown", e => {
    if (e.key === "Tab") { e.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); }
    if (e.key === "Enter" && e.shiftKey) { e.preventDefault(); host.dispatchEvent(new CustomEvent("run")); }
  });
  return {get: () => ta.value, set: v => { ta.value = v; }, on: f => ta.addEventListener("input", f)};
}

  <div class="card"><ol class="steps" style="margin:0"><li>Put your name in the box at the top of the page.</li><li>Type every answer in complete sentences, in your own words. Answers save automatically.</li><li>Press <b>Print / Save as PDF</b> and choose <i>Save as PDF</i> as the printer.</li><li>Upload the PDF to the ${wk(n)} assignment in Canvas.</li></ol>
  <p style="margin:.9em 0 0"><button class="btn run" onclick="window.print()">🖨 Print / Save as PDF</button></p></div>
  ${!S.name ? `<div class="warnbox">⚠ Add your name in the box at the top of the page before printing.</div>` : ""}</div>
  <div class="sheet">
    <div class="sheet-head"><div><b style="font-size:1.15rem">${esc(S.name || "Name: ____________________")}</b><br>KINE 303 · Statistics &amp; Research Methods<br>Professor Lawrence</div>
    <div class="right">${esc(today)}<br><b>Week ${n}: ${esc(w.title)}</b><br>${esc(w.activity)}</div></div>
    <h2>Activity questions</h2>`;
  w.questions.forEach((q, i) => {
    h += `<div class="q"><label for="q${i}">${esc(q)}</label><textarea id="q${i}" data-i="${i}" placeholder="Type your answer here…">${esc(ans[i] || "")}</textarea><div class="printans">${esc(ans[i] || "(no answer)")}</div></div>`;
  });
  h += `<h2>Pinned charts</h2>`;
  if (!pins.length) h += `<p style="color:#6b7280">No charts pinned yet. Use 📌 under a chart in a lesson to add it here.</p>`;
  pins.forEach((p, i) => { h += `<div class="fig" style="margin:10px 0"><div style="font-size:.85rem;color:#6b7280">From lesson: ${esc(LESSONS[p.id] ? LESSONS[p.id].title : p.id)}</div><img alt="pinned chart" src="data:image/png;base64,${p.img}"><div class="no-print"><button class="btn" data-unpin="${i}">Remove</button></div></div>`; });
  h += `<h2>Python practice (${done} of ${ls.length} checked)</h2>`;
  ls.forEach(l => {
    const last = S.last[l.id];
    const st = S.done[l.id] ? `<span class="st ok">✓ Checked</span>` : `<span class="st no">Not checked</span>`;
    const rev = S.revealed[l.id] ? `<span class="st rev">Solution viewed</span>` : "";
    h += `<div class="ex"><h4>${lnum(l)} · ${esc(l.title)} ${st} ${rev}</h4>`;
    if (last) {
      h += `<pre>${esc(last.code)}</pre><div class="out">${esc(last.out || "")}${last.err ? `<span class="err">${esc(last.err)}</span>` : ""}</div>`;
      (last.figs || []).forEach(b => { h += `<div class="fig" style="margin-top:6px"><img alt="output chart" src="data:image/png;base64,${b}"></div>`; });
    } else h += `<p style="color:#6b7280;margin:0">Not attempted yet.</p>`;
    h += `</div>`;
  });
  h += `<p class="print-only" style="font-size:9pt;color:#555;margin-top:20px">Generated by KINE 303 Stats Lab on ${esc(new Date().toLocaleString())}.</p></div>
  <p class="no-print" style="margin-top:16px"><button class="btn run" onclick="window.print()">🖨 Print / Save as PDF</button></p>`;
  main.innerHTML = h;
  main.querySelectorAll(".q textarea").forEach(ta => ta.addEventListener("input", () => {
    (S.answers[n] = S.answers[n] || {})[ta.dataset.i] = ta.value; ta.nextElementSibling.textContent = ta.value || "(no answer)"; save();
  }));
  main.querySelectorAll("[data-unpin]").forEach(b => b.onclick = () => { S.pins[n].splice(+b.dataset.unpin, 1); save(); renderSubmit(n); });
}

function renderCheat() {
