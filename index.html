<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KINE 303 Stats Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<style>
:root{
  --bg:#070b12; --bg2:#0b111b; --panel:#0e1521; --panel2:#121b2a; --ink:#e6edf6; --muted:#8b98ab; --line:#1d2a3d; --line2:#27384f;
  --cyan:#22d3ee; --cyan-soft:rgba(34,211,238,.10); --amber:#fbbf24; --amber-soft:rgba(251,191,36,.10);
  --violet:#a78bfa; --green:#34d399; --green-soft:rgba(52,211,153,.12); --red:#f87171; --red-soft:rgba(248,113,113,.12);
  --code-bg:#0a101a; --term:#05080d; --glow:0 0 0 1px rgba(34,211,238,.25),0 0 24px rgba(34,211,238,.12);
  --grid:rgba(120,160,210,.06);
  --tok-kw:#c792ea; --tok-str:#a5e075; --tok-num:#f78c6c; --tok-com:#5f7187; --tok-fn:#82aaff; --tok-var:#e6edf6;
}
:root[data-theme="light"]{
  --bg:#f4f7fb; --bg2:#eef2f8; --panel:#ffffff; --panel2:#f7f9fc; --ink:#0f1a2a; --muted:#566377; --line:#d9e1ec; --line2:#c6d2e2;
  --cyan:#0e7490; --cyan-soft:rgba(14,116,144,.08); --amber:#b45309; --amber-soft:rgba(180,83,9,.08);
  --violet:#6d28d9; --green:#047857; --green-soft:rgba(4,120,87,.09); --red:#b91c1c; --red-soft:rgba(185,28,28,.08);
  --code-bg:#fbfcfe; --term:#0b111b; --glow:0 0 0 1px rgba(14,116,144,.25),0 4px 18px rgba(14,116,144,.10);
  --grid:rgba(30,60,110,.05);
  --tok-kw:#7c3aed; --tok-str:#15803d; --tok-num:#c2410c; --tok-com:#8a96a8; --tok-fn:#1d4ed8; --tok-var:#0f1a2a;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
a{color:var(--cyan)}
code,pre,.mono,kbd{font-family:"JetBrains Mono",ui-monospace,monospace}
code{font-size:.86em;background:var(--cyan-soft);color:var(--cyan);padding:.1em .38em;border-radius:5px}
pre{font-size:.84em;background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre;color:var(--ink)}
kbd{font-size:.72rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;padding:1px 6px;color:var(--muted)}
h1,h2,h3,h4{font-family:"Space Grotesk",sans-serif;line-height:1.2;margin:.2em 0 .55em;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,3.2vw,2.35rem)} h2{font-size:1.4rem} h3{font-size:1.08rem}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* ---------- header */
header.top{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 20px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);position:sticky;top:0;z-index:20;height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.logo .mark{font:700 .82rem "JetBrains Mono",monospace;padding:5px 8px;border-radius:7px;background:var(--cyan);color:#041016;letter-spacing:.02em}
.logo b{font-family:"Space Grotesk",sans-serif;font-size:1.05rem;display:block;line-height:1.1}
.logo small{display:block;font-size:.74rem;color:var(--muted);font-family:"JetBrains Mono",monospace}
.top .spacer{flex:1}
.status{display:flex;align-items:center;gap:7px;font:500 .74rem "JetBrains Mono",monospace;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.ready{color:var(--green);border-color:color-mix(in srgb,var(--green) 45%,transparent)} .status.ready i{background:var(--green);box-shadow:0 0 10px var(--green)}
.status.busy{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent)} .status.busy i{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.namebox{display:flex;align-items:center;gap:8px;font:.74rem "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase}
.namebox input{font:500 .9rem "IBM Plex Sans",sans-serif;padding:6px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);color:var(--ink);width:180px;text-transform:none}
.namebox input:focus{outline:none;box-shadow:var(--glow)}
.iconbtn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);border-radius:8px;width:36px;height:34px}
#menuBtn{display:none}
/* ---------- sidebar */
nav.side{border-right:1px solid var(--line);background:color-mix(in srgb,var(--bg2) 92%,transparent);padding:16px 12px 60px;overflow:auto;position:sticky;top:60px;height:calc(100vh - 60px)}
nav.side a.navlink{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.9rem}
nav.side a.navlink:hover{background:var(--panel2)}
nav.side a.navlink.on{background:var(--cyan-soft);color:var(--cyan);box-shadow:inset 2px 0 0 var(--cyan)}
.navsec{margin:18px 10px 6px;font:500 .68rem "JetBrains Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
details.wk summary{list-style:none;cursor:pointer;padding:7px 10px;border-radius:8px;font-size:.9rem;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
details.wk summary::-webkit-details-marker{display:none}
details.wk summary:hover{background:var(--panel2)}
details.wk[open] summary{color:var(--cyan)}
.wkn{font:600 .72rem "JetBrains Mono",monospace;color:var(--muted);border:1px solid var(--line2);border-radius:5px;padding:1px 5px}
details.wk[open] .wkn{color:var(--cyan);border-color:var(--cyan)}
.mini-prog{font:.7rem "JetBrains Mono",monospace;color:var(--muted)}
details.wk .lessons{padding:2px 0 8px 18px;margin-left:14px;border-left:1px dashed var(--line2)}
details.wk .lessons a{display:flex;gap:8px;font-size:.84rem;padding:4px 8px;border-radius:6px;color:var(--muted);text-decoration:none;line-height:1.35}
details.wk .lessons a:hover{color:var(--ink);background:var(--panel2)}
details.wk .lessons a.on{color:var(--ink);background:var(--cyan-soft)}
.dot{width:9px;height:9px;flex:none;border-radius:50%;border:1.5px solid var(--line2);margin-top:5px}
.dot.done{background:var(--green);border-color:var(--green);box-shadow:0 0 8px color-mix(in srgb,var(--green) 60%,transparent)}
/* ---------- main */
main{padding:30px clamp(16px,4vw,52px) 90px;max-width:1080px;width:100%;min-width:0}
.crumb{font:.78rem "JetBrains Mono",monospace;color:var(--muted);margin-bottom:10px}
.crumb a{color:var(--muted)} .crumb a:hover{color:var(--cyan)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem "JetBrains Mono",monospace;padding:3px 9px;border-radius:6px;border:1px solid var(--line2);color:var(--muted);margin:0 6px 6px 0;text-transform:uppercase;letter-spacing:.04em}
.chip.stats{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent);background:var(--amber-soft)}
.chip.py{color:var(--cyan);border-color:color-mix(in srgb,var(--cyan) 40%,transparent);background:var(--cyan-soft)}
.chip.ok{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent);background:var(--green-soft)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:16px 0}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.idea{position:relative;overflow:hidden}
.idea::before{content:"";position:absolute;inset:0 0 auto 0;height:2px}
.idea.stats::before{background:linear-gradient(90deg,var(--amber),transparent)}
.idea.py::before{background:linear-gradient(90deg,var(--cyan),transparent)}
.idea .lbl{font:600 .72rem "JetBrains Mono",monospace;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;display:block}
.idea.stats .lbl{color:var(--amber)} .idea.py .lbl{color:var(--cyan)}
.idea p{margin:.5em 0} .idea ul{padding-left:1.2em;margin:.4em 0}
.formula{overflow-x:auto;padding:4px 0}
table.mini{border-collapse:collapse;font-size:.86rem;margin:.6em 0;width:100%}
table.mini th,table.mini td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.mini th{background:var(--panel2);font-weight:600}
dl.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:.92rem}
dl.terms dt{font:600 .86rem "JetBrains Mono",monospace;color:var(--cyan)} dl.terms dd{margin:0;color:var(--muted)}
/* ---------- stepper */
.stepper{display:flex;gap:6px;margin:6px 0 22px;flex-wrap:wrap}
.stepper span{flex:1;min-width:120px;font:500 .74rem "JetBrains Mono",monospace;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:flex;gap:8px;align-items:center}
.stepper span b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);font-size:.7rem}
.stepper span.done{color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)} .stepper span.done b{background:var(--green);color:#03140d;border-color:var(--green)}
/* ---------- code windows */
.win{border:1px solid var(--line2);border-radius:14px;background:var(--panel);margin:18px 0;overflow:hidden}
.win:focus-within{box-shadow:var(--glow)}
.winbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2);flex-wrap:wrap}
.lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.lights i:nth-child(2){background:#febc2e}.lights i:nth-child(3){background:#28c840}
.fname{font:500 .8rem "JetBrains Mono",monospace;color:var(--muted)}
.winbar h3{margin:0;font-size:1rem}
.winbar .grow{flex:1}
.winbody{padding:14px}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:8px;font-size:.86rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
.btn.run{background:var(--cyan);border-color:var(--cyan);color:#041016;font-weight:700}
.btn.run:hover{color:#041016;filter:brightness(1.1);box-shadow:0 0 18px color-mix(in srgb,var(--cyan) 50%,transparent)}
.btn.check{background:var(--green);border-color:var(--green);color:#03140d;font-weight:700}
.btn.check:hover{color:#03140d;filter:brightness(1.1);box-shadow:0 0 18px color-mix(in srgb,var(--green) 50%,transparent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:wait}
.editor{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.editor textarea{width:100%;min-height:160px;border:0;padding:10px;font:14px/1.55 "JetBrains Mono",monospace;background:var(--code-bg);color:var(--ink);resize:vertical}
.CodeMirror{height:auto;min-height:70px;font:13.5px/1.6 "JetBrains Mono",monospace;background:var(--code-bg);color:var(--tok-var);padding:4px 0}
.CodeMirror-gutters{background:var(--code-bg);border-right:1px solid var(--line)}
.CodeMirror-linenumber{color:var(--tok-com)}
.CodeMirror-cursor{border-left:2px solid var(--cyan)}
.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected{background:color-mix(in srgb,var(--cyan) 22%,transparent)!important}
.cm-s-default .cm-keyword{color:var(--tok-kw)}.cm-s-default .cm-string{color:var(--tok-str)}.cm-s-default .cm-number{color:var(--tok-num)}.cm-s-default .cm-comment{color:var(--tok-com);font-style:italic}.cm-s-default .cm-builtin{color:var(--tok-fn)}.cm-s-default .cm-def{color:var(--tok-fn)}.cm-s-default .cm-variable,.cm-s-default .cm-variable-2,.cm-s-default .cm-property{color:var(--tok-var)}.cm-s-default .cm-operator{color:var(--violet)}.cm-s-default .cm-atom{color:var(--tok-num)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btnrow .hintkey{margin-left:auto;font-size:.76rem;color:var(--muted)}
.term{margin-top:12px;background:var(--term);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.term .thead{font:500 .74rem "JetBrains Mono",monospace;color:#7f8ea3;padding:7px 12px;border-bottom:1px solid #18222f;display:flex;gap:8px}
.term .thead em{color:#34d399;font-style:normal}
.output{padding:10px 14px;font:13px/1.55 "JetBrains Mono",monospace;color:#d6e2f0;white-space:pre-wrap;word-break:break-word;min-height:40px;max-height:460px;overflow:auto}
.output .err{color:#ff8b8b}
.output .hint{display:block;margin-top:8px;font:14px/1.5 "IBM Plex Sans",sans-serif;color:#fde68a;background:rgba(251,191,36,.10);border:1px solid rgba(251,191,36,.3);padding:8px 10px;border-radius:8px;white-space:normal}
.output .muted{color:#6b7a8f}
.figs{display:flex;flex-direction:column;gap:10px;padding:0 14px}
.figs:not(:empty){padding-bottom:14px}
.fig{background:#fff;border-radius:10px;padding:8px;max-width:100%}
.fig img{max-width:100%;display:block}
.fig .pin{margin-top:6px}
.fig .btn{background:#f1f5f9;color:#0f1a2a;border-color:#cbd5e1}
.mission{border:1px dashed color-mix(in srgb,var(--cyan) 50%,transparent);background:var(--cyan-soft);border-radius:10px;padding:11px 14px;margin-bottom:12px}
.mission .lbl{font:600 .7rem "JetBrains Mono",monospace;letter-spacing:.1em;color:var(--cyan);display:block;margin-bottom:2px}
.verdict{margin-top:12px;padding:11px 14px;border-radius:10px;font-size:.94rem;border:1px solid}
.verdict.ok{background:var(--green-soft);color:var(--green);border-color:color-mix(in srgb,var(--green) 40%,transparent)}
.verdict.bad{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent)}
.verdict.info{background:var(--amber-soft);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
/* explainer */
.explain{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.explain .xrow{display:grid;grid-template-columns:34px minmax(0,1.05fr) minmax(0,1fr);border-top:1px solid var(--line);font-size:.88rem}
.explain .xrow:first-child{border-top:0}
.explain .ln{font:.75rem "JetBrains Mono",monospace;color:var(--muted);padding:8px 6px;text-align:right;background:var(--panel2)}
.explain .xc{font:12.5px/1.5 "JetBrains Mono",monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-word;background:var(--code-bg);border-right:1px solid var(--line)}
.explain .xe{padding:8px 12px;color:var(--ink)}
.explain .xe .tools{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.explain .xe .tools span{font-size:.78rem;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.explain .xe .tools span b{font:500 .74rem "JetBrains Mono",monospace;color:var(--cyan)}
.explain .xrow.com .xe{color:var(--muted);font-style:italic}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:26px;flex-wrap:wrap}
.navrow a{text-decoration:none}
/* home */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:26px;align-items:center;padding:8px 0 10px}
.hero p.lead{font-size:1.08rem;color:var(--muted);max-width:56ch}
.hero h1 span{background:linear-gradient(90deg,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.shell{background:var(--term);border:1px solid var(--line2);border-radius:14px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.shell .winbar{background:#0b111b;border-color:#18222f}
.shell pre{margin:0;border:0;border-radius:0;background:transparent;color:#d6e2f0;font-size:.82rem;line-height:1.7;min-height:220px}
.shell .p{color:#34d399}.shell .c{color:#5f7187}.shell .o{color:#fbbf24}
.cursor{display:inline-block;width:8px;height:1.05em;background:#22d3ee;vertical-align:text-bottom;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat b{display:block;font:700 1.6rem "Space Grotesk",sans-serif}
.stat small{font:.72rem "JetBrains Mono",monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bar{height:6px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:4px}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rule .k{font:700 .72rem "JetBrains Mono",monospace;color:var(--violet);letter-spacing:.1em}
.rule pre{margin:8px 0 6px;padding:8px 10px}
.rule p{margin:0;font-size:.9rem;color:var(--muted)}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}
.weekcard{display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.weekcard:hover{border-color:var(--cyan);transform:translateY(-2px)}
.weekcard .wkn{margin-right:6px}
.weekcard small{color:var(--muted);font-size:.78rem}
.weekcard b{display:block;margin-top:6px;font-family:"Space Grotesk",sans-serif;font-size:1.02rem}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding-left:38px;position:relative;margin:10px 0}
.steps li::before{content:counter(s,decimal-leading-zero);position:absolute;left:0;top:1px;font:700 .78rem "JetBrains Mono",monospace;color:var(--cyan);border:1px solid var(--cyan);border-radius:6px;padding:1px 5px}
.lessonlist{list-style:none;padding:0;margin:0}
.lessonlist li{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.lessonlist li:last-child{border-bottom:0}
.lessonlist a{color:var(--ink);text-decoration:none} .lessonlist a:hover{color:var(--cyan)}
.lessonlist .chip{margin-left:auto}
.goals{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.goals ul{margin:.3em 0;padding-left:1.2em}
/* cheat sheet */
.cheat{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.cheat .card{margin:0}
.cheat table{width:100%;border-collapse:collapse;font-size:.86rem}
.cheat td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.cheat td:first-child{font:12px "JetBrains Mono",monospace;color:var(--cyan);white-space:pre-wrap;width:52%}
.cheat td:last-child{color:var(--muted)}
/* submission sheet */
.sheet{background:#fff;color:#111827;border-radius:14px;padding:30px 34px;--line:#d1d5db}
.sheet h2{color:#111827}
.sheet-head{display:grid;grid-template-columns:1fr auto;gap:4px 20px;border-bottom:2px solid #111827;padding-bottom:10px;margin-bottom:16px}
.sheet-head .right{text-align:right}
.q{margin:18px 0;break-inside:avoid}
.q label{font-weight:600;display:block;margin-bottom:6px}
.q textarea{width:100%;min-height:96px;font:inherit;padding:9px 11px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;color:#111827;resize:vertical}
.q textarea:focus{outline:none;border-color:#0e7490;box-shadow:0 0 0 3px rgba(14,116,144,.15)}
.q .printans{display:none;white-space:pre-wrap;border-left:3px solid #cbd5e1;padding:2px 0 2px 10px}
.ex{border:1px solid #d1d5db;border-radius:10px;padding:12px 14px;margin:12px 0;break-inside:avoid}
.ex h4{margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:1rem}
.st{font:600 .72rem "JetBrains Mono",monospace;padding:2px 8px;border-radius:999px}
.st.ok{background:#dcfce7;color:#166534}.st.no{background:#fee2e2;color:#991b1b}.st.rev{background:#fef3c7;color:#92400e}
.sheet pre{background:#f8fafc;color:#111827;border-color:#e2e8f0;font-size:11.5px;margin:6px 0}
.sheet .out{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:8px 10px;font:11.5px/1.5 "JetBrains Mono",monospace;white-space:pre-wrap;word-break:break-word}
.sheet .out .err{color:#b91c1c}
.sheet .fig{max-width:520px;border:1px solid #e2e8f0}
.warnbox{background:var(--amber-soft);color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%,transparent);border-radius:10px;padding:10px 14px;margin:10px 0}
.datarow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.datarow small{color:var(--muted)}
.print-only{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;top:60px;bottom:0;width:300px;z-index:30;transform:translateX(-100%);transition:transform .2s;height:auto;background:var(--bg2)}
  nav.side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.5)}
  #menuBtn{display:inline-block}
  .twocol,.goals,.hero,.rules{grid-template-columns:1fr}
  .stats-row{grid-template-columns:1fr 1fr 1fr}
  .namebox span{display:none}
  .namebox input{width:110px}
  .logo small{display:none}
  .explain .xrow{grid-template-columns:28px 1fr}
  .explain .xe{grid-column:2;border-top:1px dashed var(--line)}
  .explain .xc{border-right:0}
  .sheet{padding:18px 16px}
  .btnrow .hintkey{display:none}
}
@media (max-width:520px){ .status{display:none} .logo b{font-size:.92rem} .stats-row{grid-template-columns:1fr} }
@media print{
  body{background:#fff;color:#000;font-size:11pt;background-image:none}
  header.top,nav.side,.no-print{display:none !important}
  .app{display:block}
  main{padding:0;max-width:none}
  .sheet{padding:0;border-radius:0}
  .q textarea{display:none}
  .q .printans{display:block}
  .print-only{display:block}
  .ex,.q,.fig{break-inside:avoid}
  a{color:#000;text-decoration:none}
}

<script id="course-data" type="application/json">{"weeks": [{"n": 0, "title": "Python from Zero", "activity": "Orientation", "summary": "Never coded before? Start here. Nine short lessons build every Python idea you need for Week 1: printing, variables, errors, lists, True/False questions, libraries, tables, charts and loops.", "stats": ["Read a number together with its units", "See a table as rows (people) \u00d7 columns (variables)", "Use a chart to show one clear message"], "python": ["Run code and read output", "Store values in variables", "Read and fix error messages", "Lists, True/False, comparisons", "Import a library", "Make a pandas table and a matplotlib chart", "Repeat steps with a for loop"], "questions": ["In one or two sentences, what is the difference between a variable in Python and a cell in a spreadsheet?", "Paste (or describe) the first error message you got this week and explain how you fixed it.", "Explain, in your own words, what this line does: print(team[\"jump_cm\"].mean())", "What felt hardest this week? What helped?"]}, {"n": 1, "title": "Introduction & Probability Pt 1", "activity": "Activity 01", "summary": "What statistics is for, theoretical vs. frequentist probability, joint probability, and moving from spreadsheet formulas to pandas.", "stats": ["Probability = selected \u00f7 total outcomes", "Theoretical vs. frequentist vs. empirical probability", "Joint probability of independent events", "Three principles of effective charts"], "python": ["Arithmetic, f-strings and percent formatting", "math.factorial", "NumPy random numbers and True/False arrays", "pd.read_csv, column means/sums", "matplotlib line charts"], "questions": ["Warm-up 1: In your own words, define \"probability.\"", "Warm-up 2: How is probability commonly expressed? What is the range of values?", "Warm-up 3: A couple has 2 babies (~50% chance of each sex). What is the chance of 2 girls?", "Warm-up 4: 5 doors, 1 car; a contestant opens TWO doors. What is the probability our probability distribution chart."]}, {"n": 3, "title": "Cognitive Bias and Reasoning", "activity": "Activity 03", "summary": "Heuristics and biases, the IQ groups and the ecological fallacy, histograms, and the logic of science: reasoning, syllogisms, modus tollens.", "stats": ["Representativeness, availability, anchoring", "Frequency distributions and histograms", "Ecological fallacy", "Premises, transitions, conclusions; deductive vs. inductive; modus ponens/tollens"], "python": ["Boolean masks and counting with .sum()/.mean()", "pd.cut frequency tables", "Overlapping histograms with legends", "Building summary DataFrames", "if / not as logic"], "questions": ["Q1: Do you think the \"stereotype threat\" fits the definition of a cognitive bias? Why or why not?", "Q2: Does the Bell Curve passage present any of the biases or heuristics we've discussed? Which ones? Explain.", "Q3: (Your prediction, written BEFORE coding) Which group is most likely to give above-average scores: A, B, or C?", "Q4: What is the relative frequency of scores >100 for each group? How does this compare to your prediction?", "Q5: Do differences in frequency distribution affect the chance of picking an above-average score? (Pin your histogram.)", "Q6: Match each sentence of the movement passage to an element of reasoning (e.g. Premise: Assumption).", "Q7: Match each sentence of the pitching passage to an element of reasoning (e.g. Premise: Fact).", "Q8: Which type of reasoning is Jindrich et al. (2006) using? Explain.", "Q9: Complete the modus tollens syllogism about the Dallas Cowboys."]}, {"n": 4, "title": "Measurements & Organizing Data", "activity": "Activity 04", "summary": "Interpretive vs. quantitative evidence, reliability & validity, levels of measurement, normalization, percentiles, pivot tables, Bayes' theorem and sampling validity.", "stats": ["Reliability vs. validity", "Discrete/continuous; nominal/ordinal/interval/ratio", "Units and normalization", "Percentiles, quartiles, IQR, ue)"], "questions": ["Q1: Resting HR 80 bpm rises to 140 bpm during exercise. What is the % increase?", "Q2: What is the RRR for early vs. late treatment at 7 and 30 days? Is either 35%?", "Q3: Which game is best to play based on average prize value?", "Q4: Based on ROI, which game is best to play? Explain.", "Q5: What is the expected value of the office raffle? Would you expect to receive it? Why or why not?", "Q6: What is the modal value of the raffle prizes?", "Q7: What percentile does the median represent?", "Q8: What is the average prize value from the company raffle? How does it compare with the expected value?"]}, {"n": 6, "title": "Variability", "activity": "Activity 06", "summary": "Sources of variability, average distance from the mean, variance, SD (population vs. sample), lottery variance, IQR, and the mean as a model (VAF).", "stats": ["Sources of variability", "Variance and SD; degrees of freedom", "IQR as a resistant measure", "DATA = MODEL + ERROR and VAF"], "python": ["Element-wise column math, .abs(), ** 2", "ddof in pandas vs NumPy", "Weighted sums", "quantile and pd.concat", "np.allclose"], "questions": ["Q1: What is the average distance from the mean for Group A? Group B?", "Q2: What is the variance for Group A? Group B?", "Q3: What is the standard deviation for Group A? Group B? Which formula (population or sample) did you use and why?", "Q4: What is the IQR for Groups A and B?", "Q5: What is the VAF for Groups A and B? Is the mean an accurate model for each?", "Reflection: In your own words, explain the difference between a model and a prediction."]}, {"n": 7, "title": "The Normal Curve and More Distributions", "activity": "Activity 07", "summary": "Normal curve, CLT, Z scores, skewness/kurtosis, binomial and bimodal distributions, resampling the tutoring scenario, and the SEM.", "stats": ["68\u201395\u201399.7 rule", "Central Limit Theorem", "Z scores", "Skewness, kurtosis, bimodal", "Binomial distribution", "Standard error of the mean"], "python": ["scipy.stats.norm (cdf, sf, pdf)", "Z-score columns", "stats.skew / kurtosis", "math.comb, stats.binom", "Resampling loops, list comprehensions", "Subplots"], "questions": ["Q1: Why do you think \"normal\" data has this shape? Why do the measures of central tendency lie close together?", "Q2: What is San Diego's Z score in the smoking dataset? Above or below the mean?", "Q3: Compare and describe the shapes of the binomial frequency and probability graphs. (Pin your chart.)", "Q4: What are the calculated percentiles for the scores of 83 (CSUSM) and 90 (RU)?", "Q5: Compare the distribution shapes of individual scores and of sample averages. (Pin your CLT chart.)", "Q6: How does the SEM for n = 800 compare to n = 32? What does that say about SEM and sample size?"]}, {"n": 8, "title": "Statistical Inferencing", "activity": "Activity 08", "summary": "General, measurable and statistical hypotheses; H\u2080 and H\u2081; confidence intervals; NHST by resampling; p-values; Type I/II errors; one- vs. two-tailed tests.", "stats": ["Null and alternative hypotheses", "Levels of confidence and CIs", "NHST and p-values", "Type I and Type II errors", "One- vs. two-tailed tests", "The 6-step testing procedure"], "python": ["Functions that return text, default arguments", "norm.ppf", "Resampling differences of means", "Permutation tests with rng.permutation", "2-D arrays and axis=1"], "questions": ["Q1: What logical construct do we need to reasonably test hypotheses?", "Q2: What is the SEM for the sit-and-reach sample (n = 50, mean 35 cm, SD 10 cm)?", "Q3: What is the 95% confidence interval for the sit-and-reach sample?", "Q4: What conclusion can we make from the BMI data? Do we reject or fail to reject the null hypothesis?", "Q5: Was the BMI test one-tailed or two-tailed? How do you know?", "Reflection: Explain Type I vs. Type II error using an example from kinesiology."]}, {"n": 9, "title": "The Testing Procedure & One-Sample t", "activity": "After Activity 08", "summary": "The t distribution, one-sample t-tests by hand and with SciPy, and reporting results in APA style.", "stats": ["t vs. Z", "One-sample t-test", "t-based confidence intervals", "APA reporting"], "python": ["stats.t.ppf / sf", "stats.ttest_1samp", "stats.t.interval", "String formatting for reports"], "questions": ["Walk through all six steps of the testing procedure for the class sit-and-reach vs. a 32 cm norm.", "Why is the critical t for n = 5 so much larger than 1.96?", "Write your APA-style sentence for the 35 cm test and explain each number in it."]}, {"n": 10, "title": "Comparing Two Means", "activity": "After Activity 08", "summary": "Paired vs. independent t-tests, Welch's correction, Cohen's d, and honest figures for group comparisons.", "stats": ["Paired vs. independent designs", "Welch's t-test", "Effect size (Cohen's d)", "SD vs. SEM error bars"], "python": ["stats.ttest_rel / ttest_ind", "Effect-size functions", "if/elif/else labels", "Jittered scatter + errorbar, spaghetti plots"], "questions": ["Why did the independent test give a much larger p-value than the paired test on the same training data?", "A study reports p = .001 but d = 0.10. How would you describe this result to a coach?", "Pin your spaghetti plot and describe what it shows that a bar of two means would hide."]}, {"n": 11, "title": "Three or More Groups: ANOVA", "activity": "After Activity 08", "summary": "Familywise error, the F ratio as between/within variance, \u03b7\u00b2, Tukey post-hoc tests, and assumption checks.", "stats": ["Familywise error rate", "F ratio, SS between/within", "\u03b7\u00b2 (VAF again)", "Post-hoc tests", "ANOVA assumptions"], "python": ["Generator expressions with sum()", "stats.f_oneway, stats.tukey_hsd", "Nested loops over pairs", "pandas boxplots"], "questions": ["Explain why running three t-tests is worse than one ANOVA.", "Report the ANOVA and the Tukey results for the three running programs in plain language.", "How is \u03b7\u00b2 related to the VAF from Activity 6?"]}, {"n": 12, "title": "Correlation", "activity": "After Activity 08", "summary": "Scatter plots, Pearson's r from Z scores, r\u00b2, Spearman's \u03c1, outliers, and why correlation isn't causation.", "stats": ["Direction, form, strength", "Pearson's r and r\u00b2", "Spearman's \u03c1", "Confounders and causation"], "python": ["plt.scatter", "df.corr(), Series.corr", "stats.pearsonr / spearmanr"], "questions": ["Interpret the correlation between age and VO2max (direction, strength, r\u00b2).", "Give an example from kinesiology of a strong correlation that is NOT causal, and name the confounder.", "Why is Spearman's \u03c1 more resistant to outliers than Pearson's r?"]}, {"n": 13, "title": "Regression", "activity": "After Activity 08", "summary": "Fitting a line, slope and intercept, residuals and R\u00b2, plotting fitted lines, and a first look at multiple regression.", "stats": ["Least-squares line", "Residuals and R\u00b2", "Extrapolation", "Multiple regression"], "python": ["stats.linregress", "Prediction and residual columns", "np.linspace for smooth lines", "np.linalg.lstsq, @ matrix multiply"], "questions": ["Interpret the slope and intercept of VO2max on age. Is the intercept meaningful?", "Pin your residual plot. Does the line look like an appropriate model? Why?", "Adding daily steps raised R\u00b2. Explain what \"holding age constant\" means for the steps coefficient."]}, {"n": 14, "title": "Categorical Data: Chi-Square", "activity": "After Activity 08", "summary": "Contingency tables, conditional probabilities, expected counts, chi-square tests of independence and goodness of fit.", "stats": ["Contingency tables", "Expected counts under H\u2080", "\u03c7\u00b2 test of independence", "Goodness of fit"], "python": ["pd.crosstab (normalize, margins)", "stats.chi2_contingency", "stats.chisquare"], "questions": ["Does injury depend on sport in this dataset? Report \u03c7\u00b2, df and p, and explain the decision.", "Use a chi-square goodness-of-fit test to evaluate the Super Bowl coin (29 heads, 31 tails). What do you conclude?"]}, {"n": 15, "title": "Power, Choosing Tests & Final Project", "activity": "Final project", "summary": "Power and sample size by simulation, a decision tree for choosing tests, and a complete analysis template for your own data.", "stats": ["Power and sample size", "Choosing the right test", "Complete, reproducible analysis"], "python": ["while loops", "Vectorized simulations", "Decision-tree functions", "A full analysis script"], "questions": ["Describe your final-project question, your variables (with levels of measurement) and the test you chose.", "State H\u2080, H\u2081 and \u03b1 for your project.", "Paste your APA-style results sentence and pin your main figure.", "What are the main threats to internal and external validity in your project?"]}], "lessons": [{"id": "w0-1", "title": "Your first line of Python", "stats": "<p>Statistics is about describing and comparing numbers. In the activities you do that with spreadsheet formulas; in this course you will do the same work in <strong>Python<\/strong>, the language most scientists use for data. Everything runs inside this page, so there is nothing to install.<\/p>", "python": "<p>A Python program is a list of instructions that run from top to bottom. <code>print(...)<\/code> shows whatever is inside the parentheses. Text goes in quotes; numbers don't. Python is also a calculator: <code>+ - * /<\/code> work as you'd expect and <code>**<\/code> means \"to the power of\".<\/p><p>Press <strong>Run<\/strong> on the example below. Then try changing something and run it again; you can't break anything. If you want the original back, press <strong>Reset<\/strong>.<\/p>", "demo": "print(\"Hello, KINE 303!\")\nprint(2 + 3)\nprint(60 * 60 * 24)      # seconds in a day\nprint(2 ** 10)           # 2 to the power of 10", "starter": "# Print the course name: Statistics & Research Methods\n\n# Print how many hours are in a week (7 days x 24 hours)", "task": "Print the text <code>Statistics &amp; Research Methods<\/code>, then print the number of hours in one week (let Python do the multiplication).", "solution": "print(\"Statistics & Research Methods\")\nprint(7 * 24)", "expect": ["Statistics & Research Methods", "168"], "hint": "Two print lines: one with the text in quotes, one with 7 * 24 (no quotes, or Python treats it as text).", "figure": false, "activity": "", "terms": [["print()", "shows a value in the output box"], ["# comment", "a note for humans; Python ignores everything after #"]], "note": "", "demo_error": false}, {"id": "w0-2", "title": "Variables: giving numbers names", "stats": "<p>In a spreadsheet, a cell holds a value and you refer to it by its address (B2). In Python you give a value a <strong>name<\/strong> instead. A good name says what the number means and should remind you of its <strong>units<\/strong>; numbers are meaningless without them.<\/p>", "python": "<p><code>age = 21<\/code> stores 21 under the name <code>age<\/code>. The <code>=<\/code> means \"store\", not \"is equal to\". After that, you can use <code>age<\/code> in calculations. Names can't have spaces, so we use underscores: <code>resting_hr<\/code>.<\/p><p>An <strong>f-string<\/strong> mixes text and values: <code>print(f\"Max HR is {max_hr} bpm\")<\/code>. Put an <code>f<\/code> before the quote and the variable in curly braces.<\/p>", "demo": "age = 35\nresting_hr = 70                       # beats per minute\nmax_hr = 220 - age                    # a common (rough) estimate\nreserve = max_hr - resting_hr         # heart-rate reserve\nprint(f\"Estimated max HR: {max_hr} bpm\")\nprint(f\"Heart-rate reserve: {reserve} bpm\")", "starter": "age = 21\nresting_hr = 62\n\n# 1. compute max_hr = 220 - age and print it\n\n# 2. compute the heart-rate reserve (max_hr - resting_hr) and print it\n\n# 3. a 70% training target = resting_hr + 0.70 * reserve ; print it rounded to 1 decimal\n#    (try printing it WITHOUT round first: computers store decimals slightly imprecisely)", "task": "For a 21-year-old with a resting heart rate of 62 bpm, print the estimated max HR, the heart-rate reserve, and the 70% training target heart rate (the Karvonen formula).", "solution": "age = 21\nresting_hr = 62\nmax_hr = 220 - age\nprint(max_hr)\nreserve = max_hr - resting_hr\nprint(reserve)\ntarget = resting_hr + 0.70 * reserve\nprint(round(target, 1))", "expect": ["199", "137", "157.9"], "hint": "Create max_hr first, then reserve uses max_hr, then target uses reserve. Order matters: Python runs top to bottom.", "figure": false, "activity": "", "terms": [["variable", "a name that refers to a value"], ["f-string", "f\"text {value}\" \u2014 text with values dropped in"]], "note": "", "demo_error": false}, {"id": "w0-3", "title": "Reading error messages", "stats": "<p>Every scientist makes mistakes in their code; the skill is finding them quickly. Error messages look scary but they almost always tell you <em>which line<\/em> and <em>what kind<\/em> of problem.<\/p>", "python": "<p>When something goes wrong, the output box shows the error type (for example <code>NameError<\/code>), the line number, and a plain-English hint underneath. The most common ones:<\/p><ul><li><code>NameError<\/code>: a name is misspelled or wasn't created yet (Python is case-sensitive: <code>Mean<\/code> \u2260 <code>mean<\/code>).<\/li><li><code>SyntaxError<\/code>: a missing parenthesis, quote, or colon.<\/li><li><code>TypeError<\/code>: mixing text and numbers, like <code>\"5\" + 3<\/code>.<\/li><\/ul>", "demo": "sprint_s = 4.82\n# This line has a mistake on purpose. Run it and read the message.\nprint(sprint_S)", "starter": "distance_m = 40\ntime_s = 5.1\nspeed = distance_m / time_S\nprint(\"Speed (m/s):\", round(speed, 2)", "task": "This code has <strong>two<\/strong> bugs. Run it, read each error, and fix them until it prints the sprint speed.", "solution": "distance_m = 40\ntime_s = 5.1\nspeed = distance_m / time_s\nprint(\"Speed (m/s):\", round(speed, 2))", "expect": ["Speed (m/s): 7.84"], "hint": "One bug is a capital letter that shouldn't be there; the other is a missing closing parenthesis.", "figure": false, "activity": "", "terms": [["round(x, 2)", "rounds x to 2 decimal places"]], "note": "", "demo_error": true}, {"id": "w0-4", "title": "Lists: many values under one name", "stats": "<p>Data is rarely one number; it's a column of numbers. The <strong>mean<\/strong> (average) is the sum of the values divided by how many there are. You'll meet its formal formula in Activity 5.<\/p>", "python": "<p>A <strong>list<\/strong> holds several values in square brackets: <code>times = [4.8, 5.1, 4.9]<\/code>. Python has built-in tools that work on lists:<\/p><ul><li><code>len(times)<\/code>: how many values<\/li><li><code>sum(times)<\/code>, <code>min(times)<\/code>, <code>max(times)<\/code><\/li><li><code>sorted(times)<\/code>: a sorted copy<\/li><li><code>times[0]<\/code>: the <em>first<\/em> value (Python counts from 0)<\/li><\/ul>", "demo": "times = [4.82, 5.10, 4.95, 5.31, 4.77]   # 40-yard dash (s)\nprint(\"n =\", len(times))\nprint(\"fastest:\", min(times), \"slowest:\", max(times))\nprint(\"mean:\", sum(times) / len(times))\nprint(\"sorted:\", sorted(times))\nprint(\"first athlete:\", times[0])", "starter": "vertical_jump = [41, 52, 47, 38, 55, 49, 44, 50]   # cm\n\n# print n, the highest jump, and the mean jump rounded to 1 decimal", "task": "For the 8 vertical jumps, print the number of athletes, the highest jump, and the mean jump rounded to 1 decimal.", "solution": "vertical_jump = [41, 52, 47, 38, 55, 49, 44, 50]\nprint(len(vertical_jump))\nprint(max(vertical_jump))\nprint(round(sum(vertical_jump) / len(vertical_jump), 1))", "expect": ["8", "55", "47.0"], "hint": "mean = sum(vertical_jump) / len(vertical_jump); wrap it in round(..., 1).", "figure": false, "activity": "", "terms": [["list", "an ordered collection: [a, b, c]"], ["index", "a position in a list, starting at 0"]], "note": "", "demo_error": false}, {"id": "w0-5", "title": "True or False: asking Python questions", "stats": "<p>A lot of statistics is <em>counting things that meet a rule<\/em>: how many scores are above 100? Did this class have a shared birthday? Each of those is a yes/no question, and Python answers yes/no questions with <code>True<\/code> or <code>False<\/code>.<\/p>", "python": "<p>Comparison symbols ask a question and give back True or False:<\/p><table class='mini'><tr><th>Symbol<\/th><th>Means<\/th><th>Example<\/th><\/tr><tr><td><code>&gt;<\/code> / <code>&lt;<\/code><\/td><td>greater / less than<\/td><td><code>110 &gt; 100<\/code> \u2192 True<\/td><\/tr><tr><td><code>&gt;=<\/code> / <code>&lt;=<\/code><\/td><td>at least / at most<\/td><td><code>100 &gt;= 100<\/code> \u2192 True<\/td><\/tr><tr><td><code>==<\/code><\/td><td>is equal to (two equals signs!)<\/td><td><code>3 == 4<\/code> \u2192 False<\/td><\/tr><tr><td><code>!=<\/code><\/td><td>is not equal to<\/td><td><code>3 != 4<\/code> \u2192 True<\/td><\/tr><\/table><p>Remember: one <code>=<\/code> <em>stores<\/em> a value; two <code>==<\/code> <em>asks<\/em> whether two values are equal. Combine questions with <code>and<\/code> / <code>or<\/code>.<\/p>", "demo": "iq = 112\nprint(iq > 100)            # is it above average?\nprint(iq == 100)           # is it exactly average?\nprint(iq > 100 and iq < 120)\nprint(True + True + False) # True counts as 1, False as 0", "starter": "resting_hr = 58\nsport = \"cross country\"\n\n# 1. print whether resting_hr is below 60\n# 2. print whether sport is equal to \"soccer\"\n# 3. print whether resting_hr is between 50 and 70 (use and)", "task": "Ask Python three questions about this athlete and print each True/False answer.", "solution": "resting_hr = 58\nsport = \"cross country\"\nprint(resting_hr < 60)\nprint(sport == \"soccer\")\nprint(resting_hr > 50 and resting_hr < 70)", "expect": ["True False True"], "hint": "Text comparisons need quotes: sport == \"soccer\". Use two equals signs to ask a question.", "figure": false, "activity": "", "terms": [["True / False", "Python's yes / no answers (Booleans)"], ["==", "asks \"is equal?\" (one = stores a value)"]], "note": "", "demo_error": false}, {"id": "w0-6", "title": "Libraries: borrowing ready-made tools", "stats": "<p>You'll never write the formula for a standard deviation or a t-test from scratch every time. Statisticians share tested tools, and in Python those toolboxes are called <strong>libraries<\/strong>. This course uses four of them, all already installed in this page:<\/p><ul><li><strong>NumPy<\/strong> (<code>np<\/code>): fast math on lots of numbers<\/li><li><strong>pandas<\/strong> (<code>pd<\/code>): tables, like a spreadsheet<\/li><li><strong>matplotlib<\/strong> (<code>plt<\/code>): charts<\/li><li><strong>SciPy<\/strong> (<code>stats<\/code>): statistical tests and distributions<\/li><\/ul>", "python": "<p><code>import numpy as np<\/code> means \"open the NumPy toolbox and call it <code>np<\/code> for short\". After that, a dot reaches inside the toolbox: <code>np.mean(...)<\/code> is \"NumPy's mean tool\". Imports go at the top of your code, once.<\/p>", "demo": "import numpy as np\n\nsprints = [4.82, 5.10, 4.95, 5.31, 4.77]\nprint(\"mean:\", np.mean(sprints))\nprint(\"median:\", np.median(sprints))\nprint(\"rounded mean:\", np.round(np.mean(sprints), 2))", "starter": "import numpy as np\n\njumps = [41, 52, 47, 38, 55, 49, 44, 50]\n\n# 1. print the mean jump using np.mean\n# 2. print the median jump using np.median\n# 3. print the highest jump using np.max", "task": "Use NumPy's tools to print the mean, the median and the maximum of the jumps.", "solution": "import numpy as np\njumps = [41, 52, 47, 38, 55, 49, 44, 50]\nprint(np.mean(jumps))\nprint(np.median(jumps))\nprint(np.max(jumps))", "expect": ["47.0", "48.0", "55"], "hint": "Each line is print(np.something(jumps)): np.mean, np.median, np.max.", "figure": false, "activity": "", "terms": [["library", "a toolbox of ready-made code (numpy, pandas, ...)"], ["import ... as ...", "load a library and give it a short nickname"]], "note": "", "demo_error": false}, {"id": "w0-7", "title": "Tables: your first DataFrame", "stats": "<p>Research data lives in tables: one <strong>row<\/strong> per person (or trial), one <strong>column<\/strong> per variable. Every activity in this class starts with a table like that.<\/p>", "python": "<p>A pandas <strong>DataFrame<\/strong> is a table. You can type a small one yourself (a dictionary of column name \u2192 list of values), or load a file with <code>pd.read_csv(\"data/...\")<\/code>.<\/p><p>To grab one column, put its name in square brackets and quotes: <code>team[\"jump_cm\"]<\/code>. Then add a tool with a dot: <code>team[\"jump_cm\"].mean()<\/code>. Read it left to right: <em>the team table \u2192 the jump column \u2192 its mean<\/em>.<\/p>", "demo": "import pandas as pd\n\nteam = pd.DataFrame({\n    \"athlete\": [\"Ana\", \"Ben\", \"Cam\", \"Dee\"],\n    \"jump_cm\": [48, 55, 42, 51],\n    \"sprint_s\": [5.1, 4.8, 5.4, 4.9],\n})\nprint(team)\nprint(\"mean jump:\", team[\"jump_cm\"].mean())", "starter": "import pandas as pd\n\nteam = pd.DataFrame({\n    \"athlete\": [\"Ana\", \"Ben\", \"Cam\", \"Dee\"],\n    \"jump_cm\": [48, 55, 42, 51],\n    \"sprint_s\": [5.1, 4.8, 5.4, 4.9],\n})\n\n# 1. print the mean sprint time\n# 2. print the fastest (smallest) sprint time with .min()\n# 3. print the number of rows with len(team)", "task": "Print the team's mean sprint time, the fastest sprint, and how many athletes are in the table.", "solution": "import pandas as pd\nteam = pd.DataFrame({\n    \"athlete\": [\"Ana\", \"Ben\", \"Cam\", \"Dee\"],\n    \"jump_cm\": [48, 55, 42, 51],\n    \"sprint_s\": [5.1, 4.8, 5.4, 4.9],\n})\nprint(team[\"sprint_s\"].mean())\nprint(team[\"sprint_s\"].min())\nprint(len(team))", "expect": ["5.05", "4.8", "4"], "hint": "team[\"sprint_s\"].mean(): table, then column in brackets, then the tool.", "figure": false, "activity": "", "terms": [["DataFrame", "a pandas table with named columns"], ["column", "one variable, e.g. team[\"jump_cm\"]"]], "note": "", "demo_error": false}, {"id": "w0-8", "title": "Your first chart", "stats": "<p>A good chart shows a pattern faster than any table. Activity 1 sets three rules: one clear message; title, axis labels and units; simple and readable.<\/p>", "python": "<p>Every matplotlib chart follows the same recipe. Change the first line to change the chart type:<\/p><pre>plt.bar(x, y)        # or plt.plot / plt.scatter / plt.hist\nplt.title(\"...\")\nplt.xlabel(\"...\")\nplt.ylabel(\"...\")\nplt.show()<\/pre>", "demo": "import matplotlib.pyplot as plt\n\nathletes = [\"Ana\", \"Ben\", \"Cam\", \"Dee\"]\njumps = [48, 55, 42, 51]\nplt.bar(athletes, jumps)\nplt.title(\"Vertical jump by athlete\")\nplt.xlabel(\"Athlete\")\nplt.ylabel(\"Jump height (cm)\")\nplt.show()", "starter": "import matplotlib.pyplot as plt\n\nathletes = [\"Ana\", \"Ben\", \"Cam\", \"Dee\"]\nsprints = [5.1, 4.8, 5.4, 4.9]\n\n# Make a bar chart of the sprint times with a title and both axis labels (include units: s)", "task": "Draw a labeled bar chart of each athlete's sprint time.", "solution": "import matplotlib.pyplot as plt\nathletes = [\"Ana\", \"Ben\", \"Cam\", \"Dee\"]\nsprints = [5.1, 4.8, 5.4, 4.9]\nplt.bar(athletes, sprints)\nplt.title(\"40 m sprint time by athlete\")\nplt.xlabel(\"Athlete\")\nplt.ylabel(\"Sprint time (s)\")\nplt.show()", "expect": [], "hint": "Copy the example and swap jumps for sprints; update the title and y-axis label.", "figure": true, "activity": "", "terms": [["plt.show()", "draws the finished chart"]], "note": "", "demo_error": false}, {"id": "w0-9", "title": "Repeating steps with a for loop", "stats": "<p>Statistics often means doing the same thing many times: convert every score, simulate 1,000 classes, resample 999 groups. A <strong>loop<\/strong> lets you write the step once and repeat it.<\/p>", "python": "<p><code>for j in jumps:<\/code> means \"take each value in <code>jumps<\/code>, one at a time, call it <code>j<\/code>, and run the indented lines\". The colon and the 4-space indent matter: they mark which lines repeat.<\/p><p><code>for i in range(3):<\/code> repeats exactly 3 times (i = 0, 1, 2).<\/p>", "demo": "jumps_cm = [48, 55, 42, 51]\nfor j in jumps_cm:\n    inches = j / 2.54\n    print(j, \"cm =\", round(inches, 1), \"in\")\nprint(\"done!\")          # not indented: runs once, after the loop", "starter": "sprints = [5.1, 4.8, 5.4, 4.9]\n\n# Loop over the sprint times. For each one print the time and whether it is under 5.0 seconds.\n# After the loop (not indented), print \"finished\"", "task": "Loop over the sprint times, printing each time with True/False for \"under 5.0 s\", then print <code>finished<\/code> once.", "solution": "sprints = [5.1, 4.8, 5.4, 4.9]\nfor s in sprints:\n    print(s, s < 5.0)\nprint(\"finished\")", "expect": ["5.1 False", "4.8 True", "5.4 False", "4.9 True", "finished"], "hint": "Inside the loop: print(s, s < 5.0). The final print has no indent.", "figure": false, "activity": "", "terms": [["for loop", "repeat the indented lines for each item"], ["indent", "4 spaces that show which lines belong to a loop / if / def"]], "note": "", "demo_error": false}, {"id": "w1-1", "title": "Probability = selected outcomes / total outcomes", "stats": "<p><strong>Probability<\/strong> is the chance that something happens, written as a number from 0 (never) to 1 (certain), or as a percent from 0% to 100%. To calculate it, divide the number of <em>selected<\/em> outcomes by the number of <em>total<\/em> outcomes.<\/p><p>A class has 40 students: 23 female and 17 male. If we draw one name from a hat, P(female) = 23 / 40 = 0.575 = 57.5%.<\/p>", "python": "<p>Division in Python gives a decimal. To show it as a percent, use an f-string with a format code: <code>{p:.1%}<\/code> means \"as a percent with 1 decimal\". <code>{p:.3f}<\/code> means \"3 decimals\".<\/p>", "demo": "female = 23\ntotal = 40\np_female = female / total\nprint(p_female)\nprint(f\"P(female) = {p_female:.1%}\")\n\np_heads = 1 / 2          # a coin: 1 selected outcome out of 2\nprint(f\"P(heads) = {p_heads:.0%}\")", "starter": "female = 23\nmale = 17\ntotal = female + male\n\n# 1. compute the probability of drawing a male name and print it (decimal)\n\n# 2. print it again as a percent with 1 decimal, using an f-string like {p:.1%}\n\n# 3. a single die has 6 faces: print P(rolling a 4) with 3 decimals, like {p:.3f}", "task": "Calculate P(male) as a decimal and as a percent, then P(rolling a 4) on one die with 3 decimals.", "solution": "female = 23\nmale = 17\ntotal = female + male\np_male = male / total\nprint(p_male)\nprint(f\"P(male) = {p_male:.1%}\")\np_four = 1 / 6\nprint(f\"{p_four:.3f}\")", "expect": ["0.425", "42.5%", "0.167"], "hint": "p_male = male / total. For the die there is 1 selected outcome and 6 total outcomes.", "figure": false, "activity": "Activity 01 warm-up questions 1\u20132", "terms": [["probability", "selected outcomes \u00f7 total outcomes, from 0 to 1"], ["theoretical probability", "what we expect from the possible outcomes, e.g. \u00bd for heads"]], "note": "", "demo_error": false}, {"id": "w1-2", "title": "Theoretical vs. frequentist probability", "stats": "<p>Over the first 60 Super Bowls the coin toss landed Heads 29 times and Tails 31 times. The <strong>relative frequency<\/strong> of Heads is 29/60 \u2248 48.3%. Does that mean Super Bowl 61 has a 48.3% chance of Heads? No. The coin has 2 outcomes, so the <strong>theoretical<\/strong> probability is still 50%. Past flips don't change future flips.<\/p><p>Probabilities that come from counted outcomes are <strong>frequentist/empirical<\/strong>. Mixing the two up (reporting 48.3% for a fair coin) is an interpretation error, and it would make the rest of a study invalid.<\/p>", "python": "<p>Store counts in variables and let Python do the arithmetic. <code>abs(x)<\/code> gives the absolute value (distance from zero), which is handy for \"how far apart are these two numbers?\"<\/p>", "demo": "heads = 29\ntails = 31\nflips = heads + tails\nrel_freq_heads = heads / flips\ntheoretical = 1 / 2\nprint(f\"relative frequency of heads: {rel_freq_heads:.3f}\")\nprint(f\"theoretical probability:     {theoretical:.3f}\")\nprint(f\"difference: {abs(rel_freq_heads - theoretical):.3f}\")", "starter": "heads = 29\ntails = 31\nflips = heads + tails\n\n# 1. print the relative frequency of TAILS with 3 decimals\n\n# 2. print how far it is from the theoretical 0.5 (use abs), 3 decimals", "task": "Compute the relative frequency of Tails across the 60 Super Bowls and how far it is from the theoretical 50%.", "solution": "heads = 29\ntails = 31\nflips = heads + tails\nrf_tails = tails / flips\nprint(f\"{rf_tails:.3f}\")\nprint(f\"{abs(rf_tails - 0.5):.3f}\")", "expect": ["0.517", "0.017"], "hint": "Relative frequency = tails / flips. The difference is abs(rf_tails - 0.5).", "figure": false, "activity": "Activity 01 \u00b7 Question 1", "terms": [["relative frequency", "count of an outcome \u00f7 total count"], ["empirical probability", "probability estimated from observations"]], "note": "", "demo_error": false}, {"id": "w1-3", "title": "Joint probability and counting arrangements", "stats": "<p>For two <strong>independent<\/strong> events (one doesn't affect the other), the chance that both happen is the product: P(A and B) = P(A) \u00d7 P(B). Two babies both girls: 0.5 \u00d7 0.5 = 0.25. Two dice both showing a 1 (snake eyes): 1/6 \u00d7 1/6 = 1/36 \u2248 2.8%. This is called <strong>joint (conjoint) probability<\/strong>.<\/p><p>How many orders can 5 cards be shuffled into? 5 choices for the first, 4 for the second, ... = 5 \u00d7 4 \u00d7 3 \u00d7 2 \u00d7 1 = 5! (\"5 factorial\") = 120.<\/p>", "python": "<p>Python's <code>math<\/code> module adds extra math tools. Load it once with <code>import math<\/code>, then use <code>math.factorial(5)<\/code>. Exponents also help with repeated multiplication: <code>0.5 ** 3<\/code> is 0.5 \u00d7 0.5 \u00d7 0.5.<\/p>", "demo": "import math\n\np_two_girls = 0.5 * 0.5\np_snake_eyes = (1/6) * (1/6)\nprint(\"two girls:\", p_two_girls)\nprint(f\"snake eyes: {p_snake_eyes:.4f} (= 1/{round(1/p_snake_eyes)})\")\nprint(\"ways to shuffle 5 cards:\", math.factorial(5))", "starter": "import math\n\n# 1. probability that a couple's 3 babies are all girls (each 0.5)\n\n# 2. number of ways to shuffle 6 cards\n\n# 3. probability of rolling three 6s in a row with one die, 4 decimals", "task": "Print the probability that 3 babies are all girls, the number of ways to shuffle 6 cards, and the probability of rolling three 6s in a row (4 decimals).", "solution": "import math\nprint(0.5 ** 3)\nprint(math.factorial(6))\nprint(f\"{(1/6) ** 3:.4f}\")", "expect": ["0.125", "720", "0.0046"], "hint": "Independent events multiply: 0.5 ** 3 and (1/6) ** 3. Shuffles of 6 cards = math.factorial(6).", "figure": false, "activity": "Activity 01 warm-up questions 3 and 5", "terms": [["independent events", "the outcome of one doesn't change the probability of the other"], ["factorial n!", "n \u00d7 (n\u22121) \u00d7 ... \u00d7 1, the number of orderings of n things"]], "note": "", "demo_error": false}, {"id": "w1-4", "title": "Check your reasoning with a simulation", "stats": "<p>Probability questions are easy to get wrong in your head. Take the game-show question: 5 doors, one car, you open <strong>two<\/strong> doors. A tempting answer adds 1/5 + 1/4, but the second door only matters if the first one missed: P = 1/5 + (4/5)(1/4) = 2/5 = 0.4. Simply put, 2 of the 5 doors are yours.<\/p><p>When reasoning gets slippery, scientists <strong>simulate<\/strong>: play the game thousands of times with random numbers and count. That's exactly what Activity 2 does in a spreadsheet with <code>RANDBETWEEN<\/code>.<\/p>", "python": "<p><strong>NumPy<\/strong> is Python's number-crunching library. <code>rng = np.random.default_rng()<\/code> makes a random-number generator; <code>rng.integers(1, 6, size=100000)<\/code> gives 100,000 random whole numbers from 1 to 5 (the upper limit is <em>not<\/em> included).<\/p><p>Comparing a whole array to a number gives an array of <code>True<\/code>/<code>False<\/code>. Since True counts as 1 and False as 0, <code>.mean()<\/code> of that array is the <strong>relative frequency<\/strong> of True.<\/p>", "demo": "import numpy as np\n\nrng = np.random.default_rng()\ngames = 100_000\ncar = rng.integers(1, 6, size=games)       # car is behind door 1..5 at random\nwin = (car == 1) | (car == 2)              # we open doors 1 and 2;  | means \"or\"\nprint(\"simulated P(win):\", round(win.mean(), 3))\nprint(\"theory: 2/5 =\", 2/5)", "starter": "import numpy as np\n\nrng = np.random.default_rng()\ngames = 100_000\ncar = rng.integers(1, 6, size=games)\n\n# You may now open THREE doors (1, 2 and 3). Simulate it and\n# print the relative frequency of winning, rounded to 1 decimal.", "task": "Change the game so the contestant opens three doors. Print the simulated probability of winning, rounded to 1 decimal. Does it match 3/5?", "solution": "import numpy as np\nrng = np.random.default_rng()\ngames = 100_000\ncar = rng.integers(1, 6, size=games)\nwin = (car == 1) | (car == 2) | (car == 3)\nprint(round(win.mean(), 1))", "expect": ["0.6"], "hint": "Chain three comparisons with | : (car == 1) | (car == 2) | (car == 3). Then round(win.mean(), 1).", "figure": false, "activity": "Activity 01 warm-up question 4", "terms": [["simulation", "using random numbers to imitate a process many times"], ["Boolean", "a True/False value; True counts as 1"]], "note": "", "demo_error": false}, {"id": "w1-5", "title": "From spreadsheet to DataFrame", "stats": "<p>Activity 1 imports <code>Initial_Survey_1.csv<\/code>, a <em>comma separated values<\/em> file, into a spreadsheet, then uses formulas like <code>=SUM(B2,B3)<\/code> and <code>=AVERAGE(B2:B33)<\/code>. A comma means \"and\"; a colon means \"the whole range\".<\/p>", "python": "<p><strong>pandas<\/strong> is the Python version of a spreadsheet. <code>pd.read_csv(\"data/initial_survey_1.csv\")<\/code> loads the file into a <strong>DataFrame<\/strong> (rows and named columns). Instead of a column letter you use the column name:<\/p><table class='mini'><tr><th>Spreadsheet<\/th><th>pandas<\/th><\/tr><tr><td><code>=AVERAGE(B2:B33)<\/code><\/td><td><code>df[\"age\"].mean()<\/code><\/td><\/tr><tr><td><code>=SUM(B2:B33)<\/code><\/td><td><code>df[\"age\"].sum()<\/code><\/td><\/tr><tr><td><code>=MAX(...)<\/code> / <code>=MIN(...)<\/code><\/td><td><code>.max()<\/code> / <code>.min()<\/code><\/td><\/tr><tr><td><code>=SUM(B2,B3)<\/code><\/td><td><code>df[\"age\"][0] + df[\"age\"][1]<\/code><\/td><\/tr><tr><td>fill handle across columns<\/td><td><code>df.mean(numeric_only=True)<\/code><\/td><\/tr><\/table><p><code>df.head()<\/code> shows the first 5 rows, <code>df.shape<\/code> gives (rows, columns), and <code>df.columns<\/code> lists the column names.<\/p>", "demo": "import pandas as pd\n\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\nprint(df.shape)                         # (rows, columns)\nprint(df.columns.tolist())\nprint(\"first two ages added:\", df[\"age\"][0] + df[\"age\"][1])\nprint(\"mean age:\", df[\"age\"].mean())\ndf.head()", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\n\n# 1. print the mean resting heart rate (column \"resting_hr\"), rounded to 2 decimals\n\n# 2. print the longest commute (column \"commute_min\")\n\n# 3. print the mean of EVERY numeric column at once, rounded to 2 decimals", "task": "Load the class survey and print the mean resting heart rate, the longest commute, and the mean of every numeric column (the pandas version of dragging the fill handle).", "solution": "import pandas as pd\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\nprint(round(df[\"resting_hr\"].mean(), 2))\nprint(df[\"commute_min\"].max())\nprint(df.mean(numeric_only=True).round(2))", "expect": ["66.53", "61", "sleep_hrs 6.61", "screen_hrs 5.29"], "hint": "df[\"resting_hr\"].mean(), df[\"commute_min\"].max(), and df.mean(numeric_only=True).round(2).", "figure": false, "activity": "Activity 01 \u00b7 Questions 2\u20133", "terms": [["CSV", "a plain-text table: values separated by commas"], ["DataFrame", "pandas' table: named columns, numbered rows"], ["argument", "a value you hand to a function, inside the parentheses"]], "note": "", "demo_error": false}, {"id": "w1-6", "title": "Relative vs. absolute references", "stats": "<p>To express each value as a <em>percent of the mean<\/em> you need <code>=100*(B2/B$38)<\/code> in a spreadsheet. The <code>$<\/code> makes B38 an <strong>absolute reference<\/strong> so it doesn't slide down when you use the fill handle, while B2 is a <strong>relative reference<\/strong> that does.<\/p>", "python": "<p>pandas does this automatically. When you divide a whole column by a single number, every row is divided by that same number. One line replaces the formula, the <code>$<\/code>, and the fill handle:<\/p><pre>df[\"age_pct_mean\"] = 100 * df[\"age\"] / df[\"age\"].mean()<\/pre><p>Assigning to <code>df[\"new_name\"]<\/code> creates a new column. Use <code>df[[\"a\", \"b\"]]<\/code> (double brackets) to look at just a few columns.<\/p>", "demo": "import pandas as pd\n\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\nmean_age = df[\"age\"].mean()                          # the \"absolute\" cell\ndf[\"age_pct_mean\"] = 100 * df[\"age\"] / mean_age      # every row uses the same mean\nprint(df[[\"student\", \"age\", \"age_pct_mean\"]].head().round(1))", "starter": "import pandas as pd\n\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\n\n# 1. make a column \"hr_pct_mean\": each resting_hr as a percent of the mean resting_hr\n\n# 2. print the first student's value rounded to 1 decimal  (hint: df[\"hr_pct_mean\"][0])\n\n# 3. print how many students are ABOVE 100% of the mean", "task": "Create a <code>hr_pct_mean<\/code> column, print the first student's value (1 decimal), and count how many students have a resting HR above the class mean.", "solution": "import pandas as pd\ndf = pd.read_csv(\"data/initial_survey_1.csv\")\ndf[\"hr_pct_mean\"] = 100 * df[\"resting_hr\"] / df[\"resting_hr\"].mean()\nprint(round(df[\"hr_pct_mean\"][0], 1))\nprint((df[\"hr_pct_mean\"] > 100).sum())", "expect": ["97.7", "14"], "hint": "Counting with True/False: (df[\"hr_pct_mean\"] > 100).sum() adds up the Trues.", "figure": false, "activity": "Activity 01 \u00b7 Question 4", "terms": [["relative reference", "a reference that shifts when copied (B2 \u2192 B3)"], ["absolute reference", "a reference that stays fixed (B$38)"]], "note": "", "demo_error": false}, {"id": "w1-7", "title": "Charts that communicate", "stats": "<p>Every chart should have a purpose. The activity's three principles: (1) send <strong>one clear message<\/strong>; (2) include <strong>everything needed to read it<\/strong>, meaning a title, axis labels and units; (3) keep it <strong>simple and readable<\/strong>. Change over time calls for a <strong>line chart<\/strong> with time on the x-axis.<\/p>", "python": "<p><strong>matplotlib<\/strong> draws charts. The pattern is always the same:<\/p><pre>import matplotlib.pyplot as plt\nplt.plot(x_values, y_values, marker=\"o\")\nplt.title(\"...\")\nplt.xlabel(\"...\")\nplt.ylabel(\"...\")\nplt.show()<\/pre><p>Charts appear below the output. Use <strong>\ud83d\udccc Pin<\/strong> under a chart to save it to your answer sheet for the week.<\/p><p><code>df[\"hits\"].idxmax()<\/code> gives the <em>row<\/em> of the maximum, and <code>df.loc[row, \"year\"]<\/code> reads another column from that row.<\/p>", "demo": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nmlb = pd.read_csv(\"data/mlb_data.csv\")\nplt.plot(mlb[\"year\"], mlb[\"hits\"], marker=\"o\")\nplt.title(\"Hits per Year\")\nplt.xlabel(\"Season\")\nplt.ylabel(\"Hits\")\nplt.show()\n\nbest = mlb[\"hits\"].idxmax()\nprint(\"best season:\", mlb.loc[best, \"year\"], \"with\", mlb.loc[best, \"hits\"], \"hits\")", "starter": "import pandas as pd\nimport matplotlib.pyplot as plt\n\nmlb = pd.read_csv(\"data/mlb_data.csv\")\n\n# 1. line chart of home runs (\"home_runs\") per year, with a title and both axis labels\n\n# 2. print the year with the MOST home runs", "task": "Make a properly labeled line chart of home runs per year, then print the year of the player's best home-run season.", "solution": "import pandas as pd\nimport matplotlib.pyplot as plt\nmlb = pd.read_csv(\"data/mlb_data.csv\")\nplt.plot(mlb[\"year\"], mlb[\"home_runs\"], marker=\"o\")\nplt.title(\"Home Runs per Year\")\nplt.xlabel(\"Season\")\nplt.ylabel(\"Home runs\")\nplt.show()\nprint(mlb.loc[mlb[\"home_runs\"].idxmax(), \"year\"])", "expect": ["2022"], "hint": "Copy the demo's plotting lines and swap \"hits\" for \"home_runs\". For the year: mlb.loc[mlb[\"home_runs\"].idxmax(), \"year\"].", "figure": true, "activity": "Activity 01 \u00b7 chart submission", "terms": [["line chart", "best for change over time"], ["idxmax()", "the row label where a column is largest"]], "note": "", "demo_error": false}, {"id": "w2-1", "title": "POPs, samples, statistics and parameters", "stats": "<p>A <strong>population<\/strong> is every individual we care about; a <strong>sample<\/strong> is the smaller group we actually measure. Because populations and processes keep changing, the activity calls them <strong>POPs<\/strong> (Populations Or Processes).<\/p><p>A number describing a POP is a <strong>parameter<\/strong>; a number describing a sample is a <strong>statistic<\/strong>. We almost never know the parameter, so the big question of this course is: <em>how confident can we be that a statistic represents the parameter?<\/em><\/p>", "python": "<p>Here we pretend the 800 CSUSM exam scores are the whole population, so we <em>can<\/em> see the parameter. <code>rng.choice(scores, size=30, replace=False)<\/code> draws a random sample of 30 different students. Run the demo several times: the parameter never changes, but each sample's mean does.<\/p><p><code>df[\"col\"].to_numpy()<\/code> turns a pandas column into a NumPy array.<\/p>", "demo": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\nscores = pd.read_csv(\"data/exam_scores.csv\")[\"CSUSM\"].to_numpy()\n\nprint(\"parameter (population mean):\", round(scores.mean(), 1))\nsample = rng.choice(scores, size=30, replace=False)\nprint(\"statistic (sample mean):    \", round(sample.mean(), 1))", "starter": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\nscores = pd.read_csv(\"data/exam_scores.csv\")[\"CSUSM\"].to_numpy()\n\n# 1. print the population mean, rounded to 1 decimal\n\n# 2. draw a random sample of 10 students and print its mean (1 decimal)\n\n# 3. draw a random sample of 200 students and print its mean (1 decimal)\n#    Run it a few times. Which sample size lands closer to the parameter?", "task": "Print the population mean, then the mean of a random sample of 10 and of 200. Rerun a few times and notice which statistic stays closer to the parameter.", "solution": "import numpy as np\nimport pandas as pd\nrng = np.random.default_rng()\nscores = pd.read_csv(\"data/exam_scores.csv\")[\"CSUSM\"].to_numpy()\nprint(round(scores.mean(), 1))\nprint(round(rng.choice(scores, size=10, replace=False).mean(), 1))\nprint(round(rng.choice(scores, size=200, replace=False).mean(), 1))", "expect": ["74.0"], "hint": "Copy the sample line from the demo and change size=30 to 10, then to 200.", "figure": false, "activity": "Activity 02 \u00b7 2.1", "terms": [["parameter", "a characteristic of the POP"], ["statistic", "a characteristic of a sample"], ["random sample", "everyone has the same chance of being picked"]], "note": "", "demo_error": false}, {"id": "w2-2", "title": "The Birthday Problem: one class", "stats": "<p>What is the probability that at least two people in a class of 30 share a birthday (month and day)? Most people guess low. Let's model one class: 30 random birthdays from 365 days, then check for a match. That's what the spreadsheet does with <code>RANDBETWEEN(1,365)<\/code> and <code>COUNTIF<\/code>.<\/p>", "python": "<p><code>rng.integers(1, 366, size=30)<\/code> gives 30 birthdays numbered 1\u2013365 (the upper limit 366 is excluded). A <strong>set<\/strong> keeps only unique values, so if <code>len(set(bdays))<\/code> is smaller than 30, someone shares a birthday.<\/p><p><code>if<\/code> runs code only when a condition is True. Note the colon and the indented lines underneath. That indentation is how Python knows what belongs to the <code>if<\/code>.<\/p>", "demo": "import numpy as np\n\nrng = np.random.default_rng()\nbdays = rng.integers(1, 366, size=30)\nprint(sorted(bdays))\nunique = len(set(bdays))\nprint(\"unique birthdays:\", unique)\nif unique < 30:\n    print(\"TRUE: at least one shared birthday\")\nelse:\n    print(\"FALSE: everyone is different\")", "starter": "import numpy as np\n\nrng = np.random.default_rng()\n\n# Simulate ONE class of 23 students.\n# 1. make 23 random birthdays\n# 2. print the number of unique birthdays\n# 3. print True if there is a shared birthday, otherwise False\n#    (hint: a comparison like  len(set(bdays)) < 23  is already True/False)", "task": "Simulate a single class of 23 students and print the number of unique birthdays and whether there's a shared birthday (True/False).", "solution": "import numpy as np\nrng = np.random.default_rng()\nbdays = rng.integers(1, 366, size=23)\nprint(len(set(bdays)))\nshared = len(set(bdays)) < 23\nprint(shared)", "expect": ["2"], "hint": "len(set(bdays)) counts unique values. The comparison len(set(bdays)) < 23 is True when there is a match.", "figure": false, "activity": "Activity 02 \u00b7 2.4 (one sample)", "terms": [["set", "a collection that keeps one copy of each value"], ["if / else", "run one block when a condition is True, another when False"]], "note": "", "demo_error": false}, {"id": "w2-3", "title": "Resampling with a for loop", "stats": "<p>One class tells us almost nothing; it either has a match or it doesn't. <strong>Resampling<\/strong> means repeating the random sample many times. The <strong>relative frequency<\/strong> of classes with a match then estimates the probability. In the spreadsheet you recorded TRUE/FALSE by hand 10 times. Python can do 10,000 in under a second.<\/p>", "python": "<p>A <code>for<\/code> loop repeats the indented block:<\/p><pre>for i in range(1000):\n    ...   # runs 1000 times<\/pre><p>A <strong>counter<\/strong> variable starts at 0 and goes up by one each time something happens: <code>matches = matches + 1<\/code> (or the shortcut <code>matches += 1<\/code>).<\/p>", "demo": "import numpy as np\n\nrng = np.random.default_rng()\nclasses = 1000\nmatches = 0\nfor i in range(classes):\n    bdays = rng.integers(1, 366, size=30)\n    if len(set(bdays)) < 30:\n        matches += 1\nprint(\"classes simulated:\", classes)\nprint(\"classes with a shared birthday:\", matches)\nprint(\"relative frequency:\", matches / classes)", "starter": "import numpy as np\n\nrng = np.random.default_rng()\nclasses = 2000\nmatches = 0\n\n# Loop over 2000 classes of 30 students and count the classes with a shared birthday.\n# Then print:  classes simulated: 2000\n# and the relative frequency rounded to 1 decimal.", "task": "Simulate 2,000 classes of 30. Print <code>classes simulated: 2000<\/code> and the relative frequency of classes with a shared birthday rounded to 1 decimal. (The exact answer is 0.706, so is your 10-class spreadsheet estimate close?)", "solution": "import numpy as np\nrng = np.random.default_rng()\nclasses = 2000\nmatches = 0\nfor i in range(classes):\n    bdays = rng.integers(1, 366, size=30)\n    if len(set(bdays)) < 30:\n        matches += 1\nprint(\"classes simulated:\", classes)\nprint(round(matches / classes, 1))", "expect": ["classes simulated: 2000", "0.7"], "hint": "Copy the loop from the demo, then print(round(matches / classes, 1)).", "figure": false, "activity": "Activity 02 \u00b7 Questions 1\u20133", "terms": [["resampling", "drawing many random samples from the same POP"], ["for loop", "repeats a block of code a set number of times"], ["frequency vs. relative frequency", "a count vs. that count divided by the total"]], "note": "", "demo_error": false}, {"id": "w2-4", "title": "Probability vs. class size, and a trendline", "stats": "<p>How does the chance of a shared birthday change with class size? Collecting relative frequencies for many sizes gives a <strong>probability distribution<\/strong>. The exact (theoretical) answer is 1 \u2212 (365/365 \u00d7 364/365 \u00d7 ... ), and it passes 50% at just 23 people.<\/p><p>In the activity you add a linear <strong>trendline<\/strong> to the chart. A trendline is a <em>model<\/em>, a simple equation (y = mx + b) that summarizes the data. Be careful extending it: a straight line will eventually predict a probability above 1, which is impossible. A model is only useful over the range where it fits.<\/p>", "python": "<p><code>def<\/code> creates your own <strong>function<\/strong>. The code inside runs whenever you call it, and <code>return<\/code> sends the answer back. <code>np.prod<\/code> multiplies everything in an array, and <code>np.arange(10, 55, 5)<\/code> makes 10, 15, ..., 50.<\/p><p><code>np.polyfit(x, y, 1)<\/code> fits the straight trendline and returns <code>[slope, intercept]<\/code>, just like the spreadsheet's \"Use Equation\" label.<\/p>", "demo": "import numpy as np\nimport matplotlib.pyplot as plt\n\ndef p_shared(k):\n    \"\"\"exact probability that a class of k has at least one shared birthday\"\"\"\n    days = np.arange(k)\n    return 1 - np.prod((365 - days) / 365)\n\nsizes = np.arange(5, 75, 5)\nprobs = [p_shared(k) for k in sizes]\nfor k, p in zip(sizes, probs):\n    print(k, round(p, 3))\n\nplt.plot(sizes, probs, marker=\"o\")\nplt.axhline(0.5, color=\"gray\", linestyle=\"--\")\nplt.title(\"Chance of a shared birthday\")\nplt.xlabel(\"Class size\")\nplt.ylabel(\"Probability\")\nplt.show()", "starter": "import numpy as np\n\ndef p_shared(k):\n    days = np.arange(k)\n    return 1 - np.prod((365 - days) / 365)\n\nsizes = np.arange(10, 55, 5)          # 10, 15, ..., 50 like the activity table\nprobs = [p_shared(k) for k in sizes]\n\n# 1. fit a straight trendline: slope, intercept = np.polyfit(sizes, probs, 1)\n#    print both rounded to 3 decimals\n\n# 2. use the trendline to predict a class of 80: slope * 80 + intercept (round 2)\n#    Does that prediction make sense?", "task": "Fit a linear trendline to the class-size probabilities, print its slope and intercept (3 decimals), then use it to predict a class of 80 (2 decimals). Explain in your answer sheet why that prediction is impossible.", "solution": "import numpy as np\ndef p_shared(k):\n    days = np.arange(k)\n    return 1 - np.prod((365 - days) / 365)\nsizes = np.arange(10, 55, 5)\nprobs = [p_shared(k) for k in sizes]\nslope, intercept = np.polyfit(sizes, probs, 1)\nprint(round(slope, 3), round(intercept, 3))\nprint(round(slope * 80 + intercept, 2))", "expect": ["0.022", "-0.038", "1.7"], "hint": "slope, intercept = np.polyfit(sizes, probs, 1) unpacks the two numbers it returns.", "figure": false, "activity": "Activity 02 \u00b7 Question 4", "terms": [["probability distribution", "probabilities across a range of conditions"], ["trendline", "a fitted line; a simple model of the pattern"], ["function (def)", "a named, reusable block of code"]], "note": "", "demo_error": false}, {"id": "w2-5", "title": "Eels and Escalators: joint probability by simulation", "stats": "<p>SpongeBob loses Eels and Escalators by rolling snake eyes. Theory says P(1 and 1) = 1/6 \u00d7 1/6 = 1/36 \u2248 0.028. That's a <strong>theoretical<\/strong> probability. Rolling thousands of virtual dice and counting gives a <strong>frequentist<\/strong> probability. They're calculated the same way; the difference is whether the events actually happened.<\/p>", "python": "<p>With NumPy you don't need a loop: make two arrays of rolls and compare them element by element.<\/p><ul><li><code>&amp;<\/code> means AND (both True), like the spreadsheet's <code>=IF(AND(A2=1,B2=1),1,0)<\/code><\/li><li><code>(die1 == 1).sum()<\/code> counts the 1s, like <code>=COUNTIF(D2:D1000,1)<\/code><\/li><li><code>(...).mean()<\/code> gives the relative frequency<\/li><\/ul>", "demo": "import numpy as np\n\nrng = np.random.default_rng()\nrolls = 999\ndie1 = rng.integers(1, 7, size=rolls)\ndie2 = rng.integers(1, 7, size=rolls)\n\nprint(\"die 1 rolled a 1:\", (die1 == 1).sum(), \"times ->\", round((die1 == 1).mean(), 3))\nprint(\"die 2 rolled a 1:\", (die2 == 1).sum(), \"times ->\", round((die2 == 1).mean(), 3))\nsnake = (die1 == 1) & (die2 == 1)\nprint(\"snake eyes:\", snake.sum(), \"times ->\", round(snake.mean(), 3))\nprint(\"theory:\", round(1/36, 3))", "starter": "import numpy as np\n\nrng = np.random.default_rng()\nrolls = 100_000\ndie1 = rng.integers(1, 7, size=rolls)\ndie2 = rng.integers(1, 7, size=rolls)\n\n# 1. print the theoretical probability of snake eyes, rounded to 4 decimals\n# 2. print the simulated relative frequency of snake eyes, rounded to 2 decimals\n# 3. print the simulated probability of DOUBLE SIXES, rounded to 2 decimals", "task": "With 100,000 rolls, print the theoretical P(snake eyes) to 4 decimals, then the simulated P(snake eyes) and P(double sixes) to 2 decimals.", "solution": "import numpy as np\nrng = np.random.default_rng()\nrolls = 100_000\ndie1 = rng.integers(1, 7, size=rolls)\ndie2 = rng.integers(1, 7, size=rolls)\nprint(round(1/36, 4))\nprint(round(((die1 == 1) & (die2 == 1)).mean(), 2))\nprint(round(((die1 == 6) & (die2 == 6)).mean(), 2))", "expect": ["0.0278", "0.03"], "hint": "Wrap each comparison in parentheses before combining with &: ((die1 == 6) & (die2 == 6)).mean()", "figure": false, "activity": "Activity 02 \u00b7 Question 5", "terms": [["joint probability", "probability that t
