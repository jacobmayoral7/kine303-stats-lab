wo events happen together"], ["frequentist probability", "counted occurrences \u00f7 total trials"]], "note": "", "demo_error": false}, {"id": "w2-6", "title": "And/or, exactly one, and a probability distribution chart", "stats": "<p>Other questions about two dice:<\/p><ul><li><strong>At least one<\/strong> die is a 1 (\"and/or\"): 1 \u2212 (5/6)\u00b2 = 11/36 \u2248 0.306<\/li><li><strong>Exactly one<\/strong> die is a 1 (one but not both): 2 \u00d7 (1/6)(5/6) = 10/36 \u2248 0.278<\/li><\/ul><p>Outcomes that can't happen at the same time are <strong>mutually exclusive<\/strong> (disjoint): \"exactly one 1\" and \"two 1s\" can never both be true on the same roll.<\/p>", "python": "<p>NumPy's logic operators: <code>|<\/code> is OR (and/or), <code>^<\/code> is XOR (one but not both), <code>&amp;<\/code> is AND, <code>~<\/code> is NOT.<\/p><p><code>plt.bar(labels, values)<\/code> draws a bar chart, which works well for comparing a handful of categories.<\/p>", "demo": "import numpy as np\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng()\ndie1 = rng.integers(1, 7, size=100_000)\ndie2 = rng.integers(1, 7, size=100_000)\none1, one2 = die1 == 1, die2 == 1\n\nconditions = {\n    \"die 1 = 1\": one1.mean(),\n    \"die 2 = 1\": one2.mean(),\n    \"both\": (one1 & one2).mean(),\n    \"at least one\": (one1 | one2).mean(),\n    \"exactly one\": (one1 ^ one2).mean(),\n}\nfor name, p in conditions.items():\n    print(f\"{name:13s} {p:.3f}\")\n\nplt.bar(list(conditions.keys()), list(conditions.values()))\nplt.title(\"Probability of rolling a 1: five conditions\")\nplt.ylabel(\"Relative frequency\")\nplt.show()", "starter": "# 1. print the THEORETICAL probability of at least one 1 on two dice (3 decimals):  1 - (5/6)**2\n# 2. print the THEORETICAL probability of exactly one 1 (3 decimals):              2 * (1/6) * (5/6)\n# 3. print the THEORETICAL probability of NO 1s at all (3 decimals)\n# 4. check: do \"no 1s\" + \"at least one 1\" add to exactly 1?  print the sum", "task": "Calculate the theoretical probabilities for <em>at least one<\/em>, <em>exactly one<\/em> and <em>no<\/em> 1s on two dice, and show that \"none\" and \"at least one\" add to 1.", "solution": "at_least_one = 1 - (5/6) ** 2\nexactly_one = 2 * (1/6) * (5/6)\nnone = (5/6) ** 2\nprint(f\"{at_least_one:.3f}\")\nprint(f\"{exactly_one:.3f}\")\nprint(f\"{none:.3f}\")\nprint(round(none + at_least_one, 10))", "expect": ["0.306", "0.278", "0.694", "1.0"], "hint": "No 1s means BOTH dice are not 1: (5/6) * (5/6). Those two events are complements, so they sum to 1.", "figure": false, "activity": "Activity 02 \u00b7 Questions 6\u20137", "terms": [["disjoint / mutually exclusive", "can't both happen at once"], ["complement", "everything except the event; P(not A) = 1 \u2212 P(A)"], ["XOR", "exactly one of two conditions is True"]], "note": "", "demo_error": false}, {"id": "w3-1", "title": "Heuristics vs. data: the IQ groups", "stats": "<p>Tversky &amp; Kahneman (1974) describe <strong>heuristics<\/strong>, mental shortcuts like representativeness, availability, and anchoring, that lead to systematic errors. One of them: judging individuals from a group's average.<\/p><p>Three groups of 999 people have mean IQs of about 100, 100 and 95. Before you look at any more data, write down which group you'd most likely draw an above-average (>100) score from (Activity 3, Q3). Now let's check.<\/p>", "python": "<p>Reading the file gives a DataFrame with three columns. <code>iq.mean()<\/code> takes the mean of every column at once, and <code>iq.describe()<\/code> gives count, mean, SD, min, quartiles and max in one table.<\/p>", "demo": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nprint(iq.head())\nprint(iq.mean().round(1))", "starter": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\n\n# 1. print iq.describe() rounded to 1 decimal\n# 2. print the mean of group_C on its own, rounded to 1 decimal", "task": "Print the summary table for all three groups (1 decimal) and the mean of Group C on its own.", "solution": "import pandas as pd\niq = pd.read_csv(\"data/iq_groups.csv\")\nprint(iq.describe().round(1))\nprint(round(iq[\"group_C\"].mean(), 1))", "expect": ["95.5", "999.0"], "hint": "iq.describe().round(1) and round(iq[\"group_C\"].mean(), 1).", "figure": false, "activity": "Activity 03 \u00b7 Questions 1\u20133", "terms": [["heuristic", "a quick rule of thumb used under uncertainty"], ["cognitive bias", "a systematic departure from reasonable judgment"]], "note": "", "demo_error": false}, {"id": "w3-2", "title": "Counting above-average scores", "stats": "<p>Group B's mean equals Group A's, and Group C's mean is lower. So surely A and B give the best odds of an above-average score? Count them. The <strong>relative frequency<\/strong> of scores >100 is the probability that one randomly chosen person scores above average.<\/p>", "python": "<p>Comparing a column to a number gives a column of True/False, a <strong>boolean mask<\/strong>. Then:<\/p><ul><li><code>(iq[\"group_A\"] &gt; 100).sum()<\/code> counts the Trues, like <code>=COUNTIF(A2:A1000,\"&gt;100\")<\/code><\/li><li><code>(iq &gt; 100).mean()<\/code> does every column at once and gives relative frequencies<\/li><\/ul>", "demo": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nabove_A = (iq[\"group_A\"] > 100).sum()\nprint(\"Group A scores above 100:\", above_A, \"of\", len(iq))\nprint(\"relative frequency:\", round(above_A / len(iq), 3))", "starter": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\n\n# 1. print the relative frequency of scores > 100 for ALL three groups at once, rounded to 3 decimals\n# 2. print the number of scores of 120 or higher in group_B  (>= means \"greater than or equal\")", "task": "Print the relative frequency of scores above 100 for all three groups (3 decimals), then count Group B scores of 120 or higher.", "solution": "import pandas as pd\niq = pd.read_csv(\"data/iq_groups.csv\")\nprint((iq > 100).mean().round(3))\nprint((iq[\"group_B\"] >= 120).sum())", "expect": ["0.507", "0.388", "0.408", "72"], "hint": "(iq > 100).mean().round(3) handles all three columns. For B: (iq[\"group_B\"] >= 120).sum().", "figure": false, "activity": "Activity 03 \u00b7 Question 4", "terms": [["boolean mask", "a True/False column used to select or count rows"]], "note": "", "demo_error": false}, {"id": "w3-3", "title": "Histograms and frequency distributions", "stats": "<p>A <strong>histogram<\/strong> sorts data into <strong>bins<\/strong> and shows how many values fall in each, giving the <strong>frequency distribution<\/strong>. Same mean, different shape: Group B is lopsided (most people a bit below 100, a few far above), while Group C is wide. The shape, not the average, decides how many scores are above 100.<\/p>", "python": "<p>Two tools:<\/p><ul><li><code>pd.cut(data, bins=range(40, 150, 10))<\/code> labels each score with its bin, and <code>.value_counts().sort_index()<\/code> counts them. This is the spreadsheet's <code>FREQUENCY<\/code> function: each bin is labeled by its <em>upper<\/em> bound, so 107 lands in (100, 110].<\/li><li><code>plt.hist(data, bins=..., alpha=0.5, label=\"A\")<\/code> draws it. <code>alpha<\/code> makes bars see-through so groups can overlap, and <code>plt.legend()<\/code> shows the labels.<\/li><\/ul>", "demo": "import pandas as pd\nimport matplotlib.pyplot as plt\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nbins = range(40, 150, 10)\nprint(pd.cut(iq[\"group_A\"], bins=bins).value_counts().sort_index())\n\nfor g in [\"group_A\", \"group_B\"]:\n    plt.hist(iq[g], bins=bins, alpha=0.5, label=g)\nplt.axvline(100, color=\"black\", linestyle=\"--\")\nplt.title(\"IQ frequency distributions\")\nplt.xlabel(\"IQ score (bin upper bound)\")\nplt.ylabel(\"Frequency\")\nplt.legend()\nplt.show()", "starter": "import pandas as pd\nimport matplotlib.pyplot as plt\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nbins = range(40, 150, 10)\n\n# 1. print the frequency table for group_C using pd.cut(...).value_counts().sort_index()\n# 2. draw overlapping histograms for ALL THREE groups, with a title, axis labels and a legend", "task": "Print Group C's frequency table, then draw one chart with all three groups' histograms (title, labels, legend).", "solution": "import pandas as pd\nimport matplotlib.pyplot as plt\niq = pd.read_csv(\"data/iq_groups.csv\")\nbins = range(40, 150, 10)\nprint(pd.cut(iq[\"group_C\"], bins=bins).value_counts().sort_index())\nfor g in [\"group_A\", \"group_B\", \"group_C\"]:\n    plt.hist(iq[g], bins=bins, alpha=0.4, label=g)\nplt.title(\"IQ frequency distributions\")\nplt.xlabel(\"IQ score\")\nplt.ylabel(\"Frequency\")\nplt.legend()\nplt.show()", "expect": ["(90, 100] 178", "(130, 140] 71"], "hint": "Change \"group_A\" to \"group_C\" in the pd.cut line, and add \"group_C\" to the list in the plotting loop.", "figure": true, "activity": "Activity 03 \u00b7 Question 5 (histogram)", "terms": [["bin", "a range of values counted together"], ["frequency distribution", "how often values fall in each bin"]], "note": "", "demo_error": false}, {"id": "w3-4", "title": "The ecological fallacy: averages don't describe individuals", "stats": "<p>The <strong>ecological fallacy<\/strong> is predicting things about <em>individuals<\/em> from a <em>group's<\/em> average. Group C has the lowest mean but more scores above 110 than either A or B. An average is a good summary only when data cluster around it. When distributions are skewed or wide, also report the <strong>median<\/strong> (the middle value) and a measure of spread.<\/p>", "python": "<p><code>.median()<\/code> works on columns just like <code>.mean()<\/code>. You can put several results side by side in a new DataFrame:<\/p><pre>pd.DataFrame({\"mean\": iq.mean(), \"median\": iq.median()})<\/pre>", "demo": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nsummary = pd.DataFrame({\n    \"mean\": iq.mean().round(1),\n    \"median\": iq.median(),\n    \"share_above_100\": (iq > 100).mean().round(3),\n})\nprint(summary)", "starter": "import pandas as pd\n\niq = pd.read_csv(\"data/iq_groups.csv\")\n\n# Build a summary DataFrame with three columns for each group:\n#   \"mean\" (1 decimal), \"median\", and \"n_above_110\" (how many scores > 110)\n# then print it.", "task": "Build and print a summary table with each group's mean, median and number of scores above 110. Which group has the lowest mean but the most high scorers?", "solution": "import pandas as pd\niq = pd.read_csv(\"data/iq_groups.csv\")\nsummary = pd.DataFrame({\n    \"mean\": iq.mean().round(1),\n    \"median\": iq.median(),\n    \"n_above_110\": (iq > 110).sum(),\n})\nprint(summary)", "expect": ["group_C 95.5 95.0 277", "group_B 100.0 97.0 164"], "hint": "For counts use (iq > 110).sum() (sum counts Trues; mean would give a proportion).", "figure": false, "activity": "Activity 03 \u00b7 3.3 conclusion", "terms": [["ecological fallacy", "inferring individual traits from group averages"], ["median", "the middle value of ranked data"]], "note": "", "demo_error": false}, {"id": "w3-5", "title": "Logic in code: modus ponens and modus tollens", "stats": "<p>Science is held together by reasoning. A <strong>syllogism<\/strong> has two premises and a conclusion. <strong>Modus ponens<\/strong>: if A then B; A is true; so B. <strong>Modus tollens<\/strong>: if A then B; B is NOT true; so A is not true. Modus tollens is the most important one in science because it lets data <em>reject<\/em> a hypothesis. That's the logic behind every statistical test you'll run later.<\/p>", "python": "<p>Python's <code>if<\/code>/<code>else<\/code> with <code>not<\/code> mirrors this logic. A hypothesis makes a prediction (B); we check the prediction against data; if the prediction fails, we reject the hypothesis. <code>and<\/code> / <code>or<\/code> / <code>not<\/code> are the word versions of the logic operators you used with arrays.<\/p>", "demo": "# Hypothesis (A): daily energy drinks make people smarter.\n# Prediction (B): test scores after a month of energy drinks will be higher than before.\nbefore = [82, 75, 90, 68, 77]\nafter  = [80, 76, 88, 69, 75]\n\nmean_before = sum(before) / len(before)\nmean_after = sum(after) / len(after)\nprediction_true = mean_after > mean_before\nprint(\"Prediction held?\", prediction_true)\n\nif not prediction_true:\n    print(\"Modus tollens: the prediction failed, so we reject the hypothesis.\")\nelse:\n    print(\"The prediction held, but that does NOT prove the hypothesis (modus ponens can't run backwards).\")", "starter": "# Hypothesis: a 6-week plyometric program increases vertical jump.\n# Prediction: mean jump after training will be higher than before.\nbefore = [44.1, 50.3, 47.8, 39.9, 52.0, 46.5]\nafter  = [43.7, 50.1, 47.9, 39.5, 51.6, 46.2]\n\n# 1. compute both means and print whether the prediction held (True/False)\n# 2. if the prediction failed, print \"Reject the hypothesis\"\n#    otherwise print \"Fail to reject the hypothesis\"", "task": "Test the plyometrics prediction with modus tollens: print whether the prediction held, then print <code>Reject the hypothesis<\/code> or <code>Fail to reject the hypothesis<\/code>.", "solution": "before = [44.1, 50.3, 47.8, 39.9, 52.0, 46.5]\nafter  = [43.7, 50.1, 47.9, 39.5, 51.6, 46.2]\nheld = sum(after) / len(after) > sum(before) / len(before)\nprint(held)\nif not held:\n    print(\"Reject the hypothesis\")\nelse:\n    print(\"Fail to reject the hypothesis\")", "expect": ["False", "Reject the hypothesis"], "hint": "held = mean_after > mean_before. Then if not held: print(\"Reject the hypothesis\").", "figure": false, "activity": "Activity 03 \u00b7 Questions 6\u20139", "terms": [["modus tollens", "If A then B; not B; therefore not A"], ["deductive reasoning", "from general rules to specific conclusions"], ["inductive reasoning", "from specific observations to general rules"]], "note": "", "demo_error": false}, {"id": "w4-1", "title": "Types of data and Python data types", "stats": "<p>Evidence is <strong>interpretive<\/strong> (relies on the observer's judgment) or <strong>quantitative<\/strong> (could be recorded independently of who measures it). A survey answer like \"Satisfied\" is subjective for the participant, but coding it 1\u20135 makes the <em>measurement<\/em> quantitative.<\/p><p>Quantitative data can be <strong>discrete<\/strong> (only certain values, like shoe size) or <strong>continuous<\/strong> (any value in a range, like force). Levels of measurement: <strong>nominal<\/strong> (labels, no order), <strong>ordinal<\/strong> (ranked), <strong>interval<\/strong> (add/subtract; arbitrary zero, like \u00b0C), <strong>ratio<\/strong> (true zero; all math works, like Newtons).<\/p>", "python": "<p>Python stores values in different <strong>types<\/strong>: <code>int<\/code> (whole numbers), <code>float<\/code> (decimals), <code>bool<\/code> (True/False, which act as 1/0), and <code>str<\/code> (text). <code>type(x)<\/code> tells you which. In pandas, <code>df.dtypes<\/code> shows each column's type.<\/p><p>A <strong>dictionary<\/strong> maps keys to values: <code>{\"Neutral\": 3, \"Satisfied\": 4}<\/code>. It's perfect for turning survey words into numbers. A <strong>list comprehension<\/strong> <code>[codes[r] for r in responses]<\/code> applies it to every response.<\/p>", "demo": "print(type(11.5), type(9), type(True), type(\"Satisfied\"))\nprint(\"True + True =\", True + True)          # Booleans behave like 0 and 1\n\ncodes = {\"Very Unsatisfied\": 1, \"Unsatisfied\": 2, \"Neutral\": 3, \"Satisfied\": 4, \"Very Satisfied\": 5}\nresponses = [\"Neutral\", \"Satisfied\", \"Satisfied\", \"Very Unsatisfied\"]\nscores = [codes[r] for r in responses]\nprint(scores)\n\nimport pandas as pd\nprint(pd.read_csv(\"data/initial_survey_1.csv\").dtypes)", "starter": "codes = {\"Very Unsatisfied\": 1, \"Unsatisfied\": 2, \"Neutral\": 3, \"Satisfied\": 4, \"Very Satisfied\": 5}\nresponses = [\"Satisfied\", \"Neutral\", \"Very Satisfied\", \"Unsatisfied\", \"Satisfied\", \"Very Satisfied\"]\n\n# 1. convert the responses to numbers and print the list\n# 2. print the mean score rounded to 2 decimals\n# 3. print the type of the first coded score", "task": "Code the six satisfaction responses as 1\u20135, print the coded list, the mean (2 decimals), and the type of a coded score.", "solution": "codes = {\"Very Unsatisfied\": 1, \"Unsatisfied\": 2, \"Neutral\": 3, \"Satisfied\": 4, \"Very Satisfied\": 5}\nresponses = [\"Satisfied\", \"Neutral\", \"Very Satisfied\", \"Unsatisfied\", \"Satisfied\", \"Very Satisfied\"]\nscores = [codes[r] for r in responses]\nprint(scores)\nprint(round(sum(scores) / len(scores), 2))\nprint(type(scores[0]))", "expect": ["[4, 3, 5, 2, 4, 5]", "3.83", "int"], "hint": "scores = [codes[r] for r in responses] looks up each response in the dictionary.", "figure": false, "activity": "Activity 04 \u00b7 Questions 1, 4", "terms": [["nominal / ordinal", "unranked labels / ranked categories"], ["interval / ratio", "arbitrary zero / true zero"], ["dictionary", "{key: value} lookup table"]], "note": "", "demo_error": false}, {"id": "w4-2", "title": "Constants, variables, and writing a formula as a function", "stats": "<p><strong>Constants<\/strong> don't change during a calculation (\u03c0, g = 9.81 m/s\u00b2 on Earth); <strong>variables<\/strong> do. Which is which depends on context: compare gravity on different planets and g becomes the variable.<\/p><p>The Reynolds number Re = \u03c1 L V / \u03bc compares inertial forces to viscous forces (\u03c1 density, L length, V speed, \u03bc viscosity). For a swimmer in a pool, the fluid's \u03c1 and \u03bc are constant and the swimmer's L and V vary.<\/p>", "python": "<p>Turning a formula into a <strong>function<\/strong> means you write it once and reuse it. Arguments can have names, which makes calls easy to read: <code>reynolds(rho=1000, L=1.8, V=1.5, mu=0.001)<\/code>.<\/p><p>Large numbers read better with commas: <code>f\"{x:,.0f}\"<\/code> prints 2,700,000.<\/p>", "demo": "def reynolds(rho, L, V, mu):\n    \"\"\"Reynolds number: inertial / viscous forces (dimensionless)\"\"\"\n    return rho * L * V / mu\n\nWATER_RHO, WATER_MU = 1000, 0.001       # constants for water (kg/m^3, Pa*s)\nre = reynolds(rho=WATER_RHO, L=1.8, V=1.5, mu=WATER_MU)\nprint(f\"Swimmer at 1.5 m/s: Re = {re:,.0f}\")", "starter": "def reynolds(rho, L, V, mu):\n    return rho * L * V / mu\n\nWATER_RHO, WATER_MU = 1000, 0.001\nAIR_RHO, AIR_MU = 1.2, 0.000018\n\n# 1. Re for a 1.8 m swimmer at 2.0 m/s in water (print with commas, no decimals)\n# 2. Re for a 1.8 m sprinter at 10 m/s in air  (same format)", "task": "Use the function to compute Re for a 1.8 m swimmer at 2.0 m/s in water and a 1.8 m sprinter at 10 m/s in air. Print both with commas.", "solution": "def reynolds(rho, L, V, mu):\n    return rho * L * V / mu\nWATER_RHO, WATER_MU = 1000, 0.001\nAIR_RHO, AIR_MU = 1.2, 0.000018\nprint(f\"{reynolds(WATER_RHO, 1.8, 2.0, WATER_MU):,.0f}\")\nprint(f\"{reynolds(AIR_RHO, 1.8, 10, AIR_MU):,.0f}\")", "expect": ["3,600,000", "1,200,000"], "hint": "Call reynolds(WATER_RHO, 1.8, 2.0, WATER_MU) and format with :,.0f inside the f-string.", "figure": false, "activity": "Activity 04 \u00b7 Question 3", "terms": [["constant", "stays fixed during a calculation"], ["variable", "can change between measurements"]], "note": "", "demo_error": false}, {"id": "w4-3", "title": "Units and normalization: who is more fit?", "stats": "<p>Lee &amp; Chang (2013) compared female university smokers and nonsmokers. In raw numbers smokers look <em>more<\/em> fit: higher VO2max, power and leg strength. But the smokers are heavier, and bigger bodies produce more force and use more oxygen. Body mass is a confounder.<\/p><p><strong>Normalization<\/strong> expresses measurements on a scale that makes comparisons valid. Here we divide by body mass, so the units become \"per kg\" (mL O2/min/kg, W/kg, N/kg). Always carry the units along: numbers are naked without them.<\/p>", "python": "<p>In pandas you can do math on whole columns at once. To divide a column by a single number from the table, first pull that number out:<\/p><pre>mass_s = fit.loc[0, \"smokers\"]     # row 0, column \"smokers\"<\/pre><p><code>df.loc[row, column]<\/code> reads one cell. Then <code>fit[\"smokers\"] / mass_s<\/code> divides every row by it, just like the spreadsheet's <code>=B5/B$4<\/code>.<\/p>", "demo": "import pandas as pd\n\nfit = pd.read_csv(\"data/smoker_fitness.csv\")\nprint(fit)\nmass_s = fit.loc[0, \"smokers\"]\nmass_n = fit.loc[0, \"nonsmokers\"]\nprint(\"body mass (kg):\", mass_s, \"vs\", mass_n)", "starter": "import pandas as pd\n\nfit = pd.read_csv(\"data/smoker_fitness.csv\")\nmass_s = fit.loc[0, \"smokers\"]\nmass_n = fit.loc[0, \"nonsmokers\"]\n\n# 1. make columns \"smokers_per_kg\" and \"nonsmokers_per_kg\" (divide by body mass)\n# 2. make a \"units_per_kg\" column:  fit[\"units\"] + \"/kg\"\n# 3. print the measure, the two per-kg columns and the new units, rounded to 2 decimals", "task": "Normalize every measure to body mass for both groups, add the new units, and print the table (2 decimals). After normalizing, which group is more fit?", "solution": "import pandas as pd\nfit = pd.read_csv(\"data/smoker_fitness.csv\")\nmass_s = fit.loc[0, \"smokers\"]\nmass_n = fit.loc[0, \"nonsmokers\"]\nfit[\"smokers_per_kg\"] = fit[\"smokers\"] / mass_s\nfit[\"nonsmokers_per_kg\"] = fit[\"nonsmokers\"] / mass_n\nfit[\"units_per_kg\"] = fit[\"units\"] + \"/kg\"\nprint(fit[[\"measure\", \"smokers_per_kg\", \"nonsmokers_per_kg\", \"units_per_kg\"]].round(2))", "expect": ["34.29", "37.12", "8.21", "8.55", "mL O2/min/kg"], "hint": "fit[\"smokers_per_kg\"] = fit[\"smokers\"] / mass_s \u2014 and the same for nonsmokers with mass_n.", "figure": false, "activity": "Activity 04 \u00b7 Questions 5\u20137", "terms": [["normalization", "rescaling a measure so comparisons are valid"], ["confounder", "a third variable that distorts a comparison"]], "note": "", "demo_error": false}, {"id": "w4-4", "title": "Percentiles and the ceiling effect", "stats": "<p>A <strong>percentile<\/strong> is the fraction of ordered scores at or below a given score. It's <strong>norm-referenced<\/strong> (relative to everyone else), unlike a percentage score, which is <strong>criterion-referenced<\/strong> (relative to a fixed maximum).<\/p><p>For 1,000 seventh-grade boys doing 1-minute sit-ups, 30 sit-ups sits near the 50th percentile and 35 near the 75th: +5 reps, +25 percentile points. Going from 45 to 50 gains only a couple of points. This is the <strong>ceiling effect<\/strong>, where improving gets harder at the top.<\/p>", "python": "<p>Two tools from the <strong>SciPy<\/strong> and NumPy libraries:<\/p><ul><li><code>stats.percentileofscore(data, 35, kind=\"weak\")<\/code>: the percentile of a score (\"weak\" = at or below, our definition)<\/li><li><code>np.percentile(data, 75)<\/code>: the reverse, the score at a percentile<\/li><\/ul><p>Quartiles split data into 4 chunks of 25%: Q1 = 25th percentile, Q2 = median, Q3 = 75th. <strong>IQR = Q3 \u2212 Q1<\/strong>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsitups = pd.read_csv(\"data/situps.csv\")[\"situps\"]\nfor score in [30, 35]:\n    pr = stats.percentileofscore(situps, score, kind=\"weak\")\n    print(f\"{score} sit-ups -> {pr:.1f}th percentile\")\n\nq1, q2, q3 = np.percentile(situps, [25, 50, 75])\nprint(\"quartiles:\", q1, q2, q3, \"  IQR =\", q3 - q1)", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nsitups = pd.read_csv(\"data/situps.csv\")[\"situps\"]\n\n# 1. print the percentile (1 decimal) of 45 sit-ups and of 50 sit-ups\n# 2. print how many percentile points the 45 -> 50 improvement is worth (1 decimal)\n# 3. print the score at the 90th percentile", "task": "Find the percentiles for 45 and 50 sit-ups, how many percentile points that +5 is worth, and the score at the 90th percentile.", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\nsitups = pd.read_csv(\"data/situps.csv\")[\"situps\"]\np45 = stats.percentileofscore(situps, 45, kind=\"weak\")\np50 = stats.percentileofscore(situps, 50, kind=\"weak\")\nprint(round(p45, 1), round(p50, 1))\nprint(round(p50 - p45, 1))\nprint(np.percentile(situps, 90))", "expect": ["97.9", "99.6", "1.7"], "hint": "Store each percentile in a variable (p45, p50) so you can subtract them.", "figure": false, "activity": "Activity 04 \u00b7 4.5", "terms": [["percentile", "share of scores at or below a score"], ["quartile", "the 25th/50th/75th percentile cut-points"], ["ceiling effect", "gains are harder near the top of a scale"]], "note": "", "demo_error": false}, {"id": "w4-5", "title": "Pivot tables in pandas", "stats": "<p>The city health file is in <strong>long format<\/strong>: one row per tract, per measure. That's thousands of rows. A <strong>pivot table<\/strong> is a data-reduction tool: it groups rows and sums them, so we can compare one measure across cities.<\/p>", "python": "<p>Three pandas tools replace the Pivot Table Editor:<\/p><ul><li><strong>Filter<\/strong>: <code>city[city[\"Measure\"].str.startswith(\"Current smoking\")]<\/code> keeps only the smoking rows.<\/li><li><strong>Rows + Values<\/strong>: <code>.groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum()<\/code> adds up the tracts for each city.<\/li><li><strong>Rows \u00d7 Columns<\/strong>: <code>pd.pivot_table(city, index=\"CityName\", columns=\"Measure\", values=\"NumOccurrences\", aggfunc=\"sum\")<\/code><\/li><\/ul><p><code>.reset_index()<\/code> turns the group labels back into ordinary columns, which is the same idea as \"Paste special \u2192 values only\".<\/p>", "demo": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nprint(city.shape)\nprint(city.head(3))\n\nwide = pd.pivot_table(city, index=\"CityName\", columns=\"Measure\",\n                      values=\"NumOccurrences\", aggfunc=\"sum\")\nprint(wide.loc[[\"San Diego\", \"Merced\"]].T)", "starter": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\n\n# 1. keep only rows whose Measure starts with \"Current smoking\"\n# 2. group by StateAbbr and CityName and sum NumOccurrences and PopulationCount; reset_index()\n# 3. add a column \"rate\" = NumOccurrences / PopulationCount\n# 4. print how many cities there are (len), and San Diego's rate rounded to 3 decimals\n#    (hint: smoke.loc[smoke[\"CityName\"] == \"San Diego\", \"rate\"].iloc[0])", "task": "Build a smoking table with one row per city, add the smoking rate (relative frequency), then print the number of cities and San Diego's rate.", "solution": "import pandas as pd\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = city[city[\"Measure\"].str.startswith(\"Current smoking\")]\nsmoke = smoke.groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index()\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nprint(len(smoke))\nprint(round(smoke.loc[smoke[\"CityName\"] == \"San Diego\", \"rate\"].iloc[0], 3))", "expect": ["266", "0.107"], "hint": "Do it in three steps, saving each result: filter, then groupby(...).sum().reset_index(), then the new column.", "figure": false, "activity": "Activity 04 \u00b7 4.6, Question 8", "terms": [["long format", "one row per observation per variable"], ["groupby", "split rows into groups, then summarize each group"], ["pivot table", "rows \u00d7 columns summary of a long table"]], "note": "", "demo_error": false}, {"id": "w4-6", "title": "Ranks, percentile ranks, quartiles and IQR", "stats": "<p>To compare cities we normalize smokers by population (a percentage), then rank the percentages to get <strong>percentile ranks<\/strong>: rank \u00f7 number of cities. With rank 1 = lowest rate, a city at rank 80 of 266 is at the 80/266 \u2248 30th percentile.<\/p><p>Ties: if several cities share a value, they all get the <em>highest<\/em> rank in the tie (they are all \"at or below\" that value). The IQR uses the <em>scores<\/em> at Q3 and Q1, not the ranks.<\/p>", "python": "<ul><li><code>s.rank(method=\"max\")<\/code> ranks from lowest to highest, giving ties the highest rank (our percentile definition)<\/li><li><code>s.quantile([0.25, 0.75])<\/code> gives the scores at Q1 and Q3<\/li><li><code>np.ceil(pr * 4)<\/code> turns a percentile rank (0\u20131) into a quartile number 1\u20134<\/li><li><code>df.sort_values(\"rate\")<\/code> sorts rows<\/li><\/ul>", "demo": "import numpy as np\nimport pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nsmoke[\"pct_rank\"] = smoke[\"rate\"].rank(method=\"max\") / len(smoke)\nsmoke[\"quartile\"] = np.ceil(smoke[\"pct_rank\"] * 4).astype(int)\nprint(smoke.sort_values(\"rate\")[[\"CityName\", \"rate\", \"pct_rank\", \"quartile\"]].head().round(3))", "starter": "import numpy as np\nimport pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\n\n# 1. add \"pct_rank\" (rank with method=\"max\", divided by the number of cities)\n# 2. print San Marcos' percentile rank (3 decimals)\n# 3. print Merced's quartile (1-4)\n# 4. print the IQR of the smoking rates (Q3 - Q1), 3 decimals", "task": "Add percentile ranks, then print San Marcos' percentile rank, Merced's quartile, and the IQR of smoking rates.", "solution": "import numpy as np\nimport pandas as pd\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nsmoke[\"pct_rank\"] = smoke[\"rate\"].rank(method=\"max\") / len(smoke)\nby_city = smoke.set_index(\"CityName\")\nprint(round(by_city.loc[\"San Marcos\", \"pct_rank\"], 3))\nprint(int(np.ceil(by_city.loc[\"Merced\", \"pct_rank\"] * 4)))\nq1, q3 = smoke[\"rate\"].quantile([0.25, 0.75])\nprint(round(q3 - q1, 3))", "expect": ["0.06", "3", "0.041"], "hint": "by_city = smoke.set_index(\"CityName\") lets you look a city up with by_city.loc[\"Merced\", \"pct_rank\"].", "figure": false, "activity": "Activity 04 \u00b7 Questions 9\u201312", "terms": [["percentile rank", "rank \u00f7 number of values"], ["IQR", "score at Q3 \u2212 score at Q1; spread of the middle 50%"]], "note": "", "demo_error": false}, {"id": "w4-7", "title": "Conditional probability and Bayes' theorem", "stats": "<p><strong>Conditional probability<\/strong> P(A | B) is the probability of A <em>given<\/em> that B is true. Imagine an airport that serves only our 266 cities. P(San Diego) is San Diego's share of all travelers. But P(San Diego | smoker), the chance a randomly chosen <em>smoker<\/em> is from San Diego, is different.<\/p><p><strong>Bayes' theorem<\/strong>: P(A | B) = P(B | A) \u00d7 P(A) / P(B). With frequency data you can check it directly: P(San Diego | smoker) = San Diego smokers \u00f7 all smokers.<\/p>", "python": "<p>Sum a whole column with <code>.sum()<\/code> to get the totals. Then each probability is just a ratio of counts, and you can compute Bayes' theorem both ways to confirm they agree.<\/p>", "demo": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\ntotal_people = smoke[\"PopulationCount\"].sum()\ntotal_smokers = smoke[\"NumOccurrences\"].sum()\nsd = smoke.loc[\"San Diego\"]\n\np_sd = sd[\"PopulationCount\"] / total_people\np_smoker = total_smokers / total_people\np_smoker_given_sd = sd[\"NumOccurrences\"] / sd[\"PopulationCount\"]\n\nprint(f\"P(San Diego)          = {p_sd:.4f}\")\nprint(f\"P(smoker)             = {p_smoker:.4f}\")\nprint(f\"P(smoker | San Diego) = {p_smoker_given_sd:.4f}\")\nprint(f\"Bayes: P(San Diego | smoker) = {p_smoker_given_sd * p_sd / p_smoker:.4f}\")\nprint(f\"Direct count check           = {sd['NumOccurrences'] / total_smokers:.4f}\")", "starter": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\ntotal_people = smoke[\"PopulationCount\"].sum()\ntotal_smokers = smoke[\"NumOccurrences\"].sum()\n\n# Use Bayes' theorem to compute P(Los Angeles | smoker), 4 decimals.\n# Then check it with the direct count (LA smokers / all smokers).", "task": "Use Bayes' theorem to find P(Los Angeles | smoker) and confirm it with a direct count (4 decimals each).", "solution": "import pandas as pd\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\ntotal_people = smoke[\"PopulationCount\"].sum()\ntotal_smokers = smoke[\"NumOccurrences\"].sum()\nla = smoke.loc[\"Los Angeles\"]\np_la = la[\"PopulationCount\"] / total_people\np_smoker = total_smokers / total_people\np_smoker_given_la = la[\"NumOccurrences\"] / la[\"PopulationCount\"]\nprint(f\"{p_smoker_given_la * p_la / p_smoker:.4f}\")\nprint(f\"{la['NumOccurrences'] / total_smokers:.4f}\")", "expect": ["0.0705"], "hint": "Copy the demo and replace \"San Diego\" with \"Los Angeles\".", "figure": false, "activity": "Activity 04 \u00b7 Question 13", "terms": [["conditional probability", "P(A | B): probability of A when B is known to be true"], ["Bayes' theorem", "P(A|B) = P(B|A)\u00b7P(A) / P(B)"]], "note": "", "demo_error": false}, {"id": "w4-8", "title": "Convenience samples and external validity", "stats": "<p>A <strong>convenience sample<\/strong> (say, only California cities because they're nearby) is a <strong>nonprobability sample<\/strong>: cities elsewhere had no chance of being included. Findings may have <strong>internal validity<\/strong> for California but lack <strong>external validity<\/strong>, meaning they don't generalize to the whole U.S.<\/p><p>A <strong>probability sample<\/strong> gives every member of the population a known, equal chance, usually through random selection.<\/p>", "python": "<p><code>df.sample(n=24)<\/code> draws 24 random rows. Filtering with <code>df[df[\"StateAbbr\"] == \"CA\"]<\/code> builds the convenience sample, so you can compare both estimates to the full-population value.<\/p>", "demo": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\n\nca = smoke[smoke[\"StateAbbr\"] == \"CA\"]\nprint(\"cities in the convenience sample:\", len(ca))\nprint(\"convenience (CA only) mean rate:\", round(ca[\"rate\"].mean(), 3))\nprint(\"random sample of 24 mean rate:  \", round(smoke.sample(n=24)[\"rate\"].mean(), 3))\nprint(\"all 266 cities mean rate:       \", round(smoke[\"rate\"].mean(), 3))", "starter": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\n\n# 1. print the mean smoking rate for Alabama (\"AL\") cities only (3 decimals)\n# 2. print the mean for all cities (3 decimals)\n# 3. print the difference AL minus all (3 decimals)", "task": "Compare a convenience sample of Alabama cities with the full set of cities: print both mean smoking rates and the difference.", "solution": "import pandas as pd\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby([\"StateAbbr\", \"CityName\"])[[\"NumOccurrences\", \"PopulationCount\"]].sum().reset_index())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nal = smoke[smoke[\"StateAbbr\"] == \"AL\"][\"rate\"].mean()\neveryone = smoke[\"rate\"].mean()\nprint(round(al, 3))\nprint(round(everyone, 3))\nprint(round(al - everyone, 3))", "expect": ["0.161"], "hint": "smoke[smoke[\"StateAbbr\"] == \"AL\"][\"rate\"].mean()", "figure": false, "activity": "Activity 04 \u00b7 4.9", "terms": [["internal validity", "results are true for the population sampled"], ["external validity", "results generalize to other populations"]], "note": "", "demo_error": false}, {"id": "w5-1", "title": "Percent change and percentage points", "stats": "<p>Percent change = 100 \u00d7 (new \u2212 initial) / initial. The reference (the initial value) is the denominator, which is why going up and coming back down aren't the same size in percent. A resting HR of 80 bpm rising to 140 bpm is a 75% increase; falling back from 140 to 80 is only a 42.9% decrease.<\/p>", "python": "<p>Write it once as a function and reuse it everywhere. A <strong>docstring<\/strong> (the text in triple quotes) documents what the function does.<\/p>", "demo": "def pct_change(initial, new):\n    \"\"\"percent change relative to the initial value\"\"\"\n    return 100 * (new - initial) / initial\n\nprint(f\"80 -> 140 bpm: {pct_change(80, 140):.1f}%\")\nprint(f\"140 -> 80 bpm: {pct_change(140, 80):.1f}%\")", "starter": "def pct_change(initial, new):\n    return 100 * (new - initial) / initial\n\n# A runner's VO2max goes from 38 to 42 mL/kg/min after training, then back to 38 after detraining.\n# 1. print the % change for training   (1 decimal)\n# 2. print the % change for detraining (1 decimal)", "task": "Print the percent change in VO2max for training (38 \u2192 42) and detraining (42 \u2192 38), 1 decimal each.", "solution": "def pct_change(initial, new):\n    return 100 * (new - initial) / initial\nprint(round(pct_change(38, 42), 1))\nprint(round(pct_change(42, 38), 1))", "expect": ["10.5", "-9.5"], "hint": "pct_change(38, 42) and pct_change(42, 38).", "figure": false, "activity": "Activity 05 \u00b7 Question 1", "terms": [["percent change", "100 \u00d7 change \u00f7 initial value"]], "note": "", "demo_error": false}, {"id": "w5-2", "title": "Absolute vs. relative risk reduction", "stats": "<p>Convalescent-plasma data (Joyner et al., 2020): 7-day mortality was 8.7% with early treatment and 11.9% with late treatment. The difference, 3.2 <strong>percentage points<\/strong>, is the <strong>absolute risk reduction (ARR)<\/strong>. Dividing by the baseline risk gives the <strong>relative risk reduction (RRR)<\/strong>, a percent of a percent: 100 \u00d7 3.2 / 11.9 \u2248 26.9%.<\/p><p>The two are often confused, sometimes on purpose. \"Reduces mortality by 35 percent\" sounds very different from \"3 percentage points\".<\/p>", "python": "<p>A small table typed directly into Python makes a handy DataFrame: <code>pd.DataFrame({\"col\": [...], ...})<\/code>. Columns can then be subtracted and divided as a whole.<\/p>", "demo": "import pandas as pd\n\nmort = pd.DataFrame({\"followup\": [\"7 days\", \"30 days\"],\n                     \"early_pct\": [8.7, 21.6],\n                     \"late_pct\": [11.9, 26.7]})\nmort[\"ARR_points\"] = mort[\"late_pct\"] - mort[\"early_pct\"]\nprint(mort)", "starter": "import pandas as pd\n\nmort = pd.DataFrame({\"followup\": [\"7 days\", \"30 days\"],\n                     \"early_pct\": [8.7, 21.6],\n                     \"late_pct\": [11.9, 26.7]})\n\n# 1. add ARR_points = late - early\n# 2. add RRR_pct = 100 * ARR / late   (late treatment is the baseline)\n# 3. print the table rounded to 1 decimal", "task": "Add ARR and RRR columns for 7- and 30-day mortality and print the table (1 decimal). Is either RRR 35%?", "solution": "import pandas as pd\nmort = pd.DataFrame({\"followup\": [\"7 days\", \"30 days\"],\n                     \"early_pct\": [8.7, 21.6],\n                     \"late_pct\": [11.9, 26.7]})\nmort[\"ARR_points\"] = mort[\"late_pct\"] - mort[\"early_pct\"]\nmort[\"RRR_pct\"] = 100 * mort[\"ARR_points\"] / mort[\"late_pct\"]\nprint(mort.round(1))", "expect": ["26.9", "19.1"], "hint": "mort[\"RRR_pct\"] = 100 * mort[\"ARR_points\"] / mort[\"late_pct\"]", "figure": false, "activity": "Activity 05 \u00b7 Question 2", "terms": [["ARR", "baseline risk \u2212 new risk (percentage points)"], ["RRR", "100 \u00d7 ARR \u00f7 baseline risk (percent)"]], "note": "", "demo_error": false}, {"id": "w5-3", "title": "Expected value: the lottery", "stats": "<p>The <strong>expected value<\/strong> is what you'd win on average if you played many, many times: EV = \u03a3 value \u00d7 P(value). For a scratcher, P = 1 / odds. The $10,000,000 grand prize at 1 in 3,000,000 contributes 10,000,000 \u00d7 (1/3,000,000) = $3.33 to the ticket's EV. Add up all 12 prize levels for the game's EV.<\/p><p>The <em>average prize<\/em> ignores the odds, so it's a terrible guide. EV weights each prize by how likely it is.<\/p>", "python": "<p>Add a column for each prize's EV contribution, then <code>groupby(\"game\")<\/code> and <code>.sum()<\/code> adds them per game. <code>.sort_values(ascending=False)<\/code> puts the best first.<\/p>", "demo": "import pandas as pd\n\nsc = pd.read_csv(\"data/scratchers.csv\")\nbank = sc[sc[\"game\"] == \"$10,000,000 Bankroll\"].copy()\nbank[\"p\"] = 1 / bank[\"odds_1_in\"]\nbank[\"ev_part\"] = bank[\"prize\"] * bank[\"p\"]\nprint(bank[[\"prize\", \"odds_1_in\", \"ev_part\"]].round(3))\nprint(\"average prize: \", round(bank[\"prize\"].mean(), 2))\nprint(\"expected value:\", round(bank[\"ev_part\"].sum(), 2))", "starter": "import pandas as pd\n\nsc = pd.read_csv(\"data/scratchers.csv\")\n\n# 1. add a column \"ev_part\" = prize / odds_1_in  for every row\n# 2. ev = sc.groupby(\"game\")[\"ev_part\"].sum()\n# 3. print ev sorted from highest to lowest, rounded to 2 decimals", "task": "Compute every game's expected value with one groupby and print them sorted from highest to lowest.", "solution": "import pandas as pd\nsc = pd.read_csv(\"data/scratchers.csv\")\nsc[\"ev_part\"] = sc[\"prize\"] / sc[\"odds_1_in\"]\nev = sc.groupby(\"game\")[\"ev_part\"].sum()\nprint(ev.sort_values(ascending=False).round(2))", "expect": ["$10,000,000 Bankroll 18.84", "Lucky Lanes 0.68"], "hint": "sc[\"ev_part\"] = sc[\"prize\"] / sc[\"odds_1_in\"], then groupby and sum.", "figure": false, "activity": "Activity 05 \u00b7 Question 3", "terms": [["expected value", "\u03a3 value \u00d7 probability; the long-run average outcome"]], "note": "", "demo_error": false}, {"id": "w5-4", "title": "Return on investment", "stats": "<p>A $30 ticket with an $18.84 EV loses money on average. <strong>Expected ROI<\/strong> = (EV \u2212 price) / price. For a $20 ticket with a $15 EV, ROI = \u22120.25, a 25% loss per ticket over the long run. The \"best\" game is the one with the <em>least negative<\/em> ROI.<\/p>", "python": "<p><code>.agg()<\/code> computes several summaries per group in one go:<\/p><pre>g = sc.groupby(\"game\").agg(price=(\"ticket_price\", \"first\"),\n                           ev=(\"ev_part\", \"sum\"))<\/pre><p><code>.idxmax()<\/code> gives the label (game name) with the largest value.<\/p>", "demo": "import pandas as pd\n\nsc = pd.read_csv(\"data/scratchers.csv\")\nsc[\"ev_part\"] = sc[\"prize\"] / sc[\"odds_1_in\"]\ng = sc.groupby(\"game\").agg(price=(\"ticket_price\", \"first\"), ev=(\"ev_part\", \"sum\"))\nprint(g.round(2))", "starter": "import pandas as pd\n\nsc = pd.read_csv(\"data/scratchers.csv\")\nsc[\"ev_part\"] = sc[\"prize\"] / sc[\"odds_1_in\"]\ng = sc.groupby(\"game\").agg(price=(\"ticket_price\", \"first\"), ev=(\"ev_part\", \"sum\"))\n\n# 1. add g[\"roi\"] = (ev - price) / price\n# 2. print g sorted by roi (best first), rounded to 3 decimals\n# 3. print the name of the game with the best ROI", "task": "Add the expected ROI for each game, print the table sorted by ROI, and print the name of the best game to play.", "solution": "import pandas as pd\nsc = pd.read_csv(\"data/scratchers.csv\")\nsc[\"ev_part\"] = sc[\"prize\"] / sc[\"odds_1_in\"]\ng = sc.groupby(\"game\").agg(price=(\"ticket_price\", \"first\"), ev=(\"ev_part\", \"sum\"))\ng[\"roi\"] = (g[\"ev\"] - g[\"price\"]) / g[\"price\"]\nprint(g.sort_values(\"roi\", ascending=False).round(3))\nprint(g[\"roi\"].idxmax())", "expect": ["Diamond Mine", "-0.042"], "hint": "g[\"roi\"].idxmax() returns the game name with the highest ROI.", "figure": false, "activity": "Activity 05 \u00b7 Question 4", "terms": [["ROI", "(expected value \u2212 cost) \u00f7 cost"]], "note": "", "demo_error": false}, {"id": "w5-5", "title": "Mean, median, and mode: the office raffle", "stats": "<p>Eighteen prizes, one per employee. Three measures of <strong>central tendency<\/strong>:<\/p><ul><li><strong>Mode<\/strong>: the most frequent value, i.e. the single most likely prize<\/li><li><strong>Median<\/strong>: the middle of the ranked values (the 50th percentile); with an even count, average the two middle values<\/li><li><strong>Mean<\/strong>: x\u0304 = \u03a3x\u1d62 / N. When every prize is equally likely, the mean <em>equals<\/em> the expected value.<\/li><\/ul><p>One $20,000 prize drags the mean far above what almost anyone wins, while the median barely moves. That's why income is reported as a median.<\/p>", "python": "<p>pandas has all three: <code>.mean()<\/code>, <code>.median()<\/code>, <code>.mode()<\/code> (returns a list, since there can be ties). <code>.value_counts(normalize=True)<\/code> gives the relative-frequency table, i.e. each prize's probability.<\/p>", "demo": "import pandas as pd\n\nprize = pd.read_csv(\"data/company_raffle.csv\")[\"prize\"]\nprobs = prize.value_counts(normalize=True).sort_index()\nprint(probs.round(3))\nev = (probs.index * probs).sum()        # sum of value * probability\nprint(\"expected value:\", round(ev, 2))", "starter": "import pandas as pd\n\nprize = pd.read_csv(\"data/company_raffle.csv\")[\"prize\"]\n\n# 1. print the mean (2 decimals), the median, and the mode (prize.mode()[0])\n# 2. remove the $20,000 prize:  small = prize[prize < 20000]\n#    and print its mean (2 decimals) and median. Which measure changed a lot?", "task": "Print the raffle's mean, median and mode; then drop the $20,000 prize and print the new mean and median.", "solution": "import pandas as pd\nprize = pd.read_csv(\"data/company_raffle.csv\")[\"prize\"]\nprint(round(prize.mean(), 2))\nprint(prize.median())\nprint(prize.mode()[0])\nsmall = prize[prize < 20000]\nprint(round(small.mean(), 2))\nprint(small.median())", "expect": ["1135.67", "15.0", "26.0", "10.0"], "hint": "prize.mode()[0] takes the first (here, only) mode. Filtering: prize[prize < 20000].", "figure": false, "activity": "Activity 05 \u00b7 Questions 6\u20138", "terms": [["mode", "most frequent value"], ["median", "middle ranked value (50th percentile)"], ["mean", "\u03a3x\u1d62 / N; equals the expected value when outcomes are equally likely"]], "note": "", "demo_error": false}, {"id": "w6-1", "title": "Variability: average distance from the mean", "stats": "<p>A pro golfer's drives land close together; a beginner's are scattered. Both might average the same distance, but the <strong>variability<\/strong> (spread, or dispersion) differs. Variability comes from many sources: <em>functional<\/em> (healthy heart-rate variability), internal <em>noise<\/em>, <em>situational<\/em> noise from the environment, <em>observational<\/em> differences between people measuring, and <em>measurement<\/em> error.<\/p><p>A first way to measure spread: how far is each score from the mean, on average? We use the <em>absolute<\/em> distance |x\u1d62 \u2212 x\u0304|. Otherwise values above and below the mean cancel out to zero.<\/p>", "python": "<p>Math on a whole column works element by element: <code>A - A.mean()<\/code> subtracts the mean from every score, and <code>.abs()<\/code> makes every distance positive. Try printing <code>(A - A.mean()).mean()<\/code> to see the cancel-out problem for yourself.<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nprint(\"means:\", round(A.mean(), 2), round(B.mean(), 2))\ndist_A = (A - A.mean()).abs()\nprint(\"first five distances for A:\", dist_A.head().round(1).tolist())\nprint(\"signed distances average to:\", round((A - A.mean()).mean(), 6))", "starter": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\n\n# print the average absolute distance from the mean for Group A, then Group B (2 decimals each)", "task": "Print the average absolute distance from the mean for Group A and Group B (2 decimals).", "solution": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nprint(round((A - A.mean()).abs().mean(), 2))\nprint(round((B - B.mean()).abs().mean(), 2))", "expect": ["4.59", "13.88"], "hint": "(A - A.mean()).abs().mean() \u2014 then the same with B.", "figure": false, "activity": "Activity 06 \u00b7 Question 1", "terms": [["variability", "spread or dispersion of data"], ["noise", "influences not part of our model"]], "note": "", "demo_error": false}, {"id": "w6-2", "title": "Variance: the average squared distance", "stats": "<p>Statistics squares the distances instead of taking absolute values. The average squared distance from the mean is the <strong>variance<\/strong>:<\/p><p class='formula'>$$\\sigma^2 = \\frac{\\sum_{i=1}^{N}(x_i-\\bar{x})^2}{N}$$<\/p><p>Squaring makes big deviations count a lot more than small ones. The catch is that variance is in squared units (IQ points\u00b2), so it's hard to picture.<\/p>", "python": "<p><code>** 2<\/code> squares every value in a column. Build the formula piece by piece, exactly like columns I and J in the spreadsheet: deviation \u2192 squared deviation \u2192 average.<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nsq_dev_A = (A - A.mean()) ** 2          # column of squared distances\nvar_A = sq_dev_A.mean()                   # average of them\nprint(\"variance of A:\", round(var_A, 2))", "starter": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\n\n# compute the variance of Group B step by step (squared deviations, then their mean); print it (2 decimals)\n# then print how many TIMES larger B's variance is than A's (1 decimal)", "task": "Calculate Group B's variance by hand (2 decimals), then how many times larger it is than Group A's (1 decimal).", "solution": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nvar_A = ((A - A.mean()) ** 2).mean()\nvar_B = ((B - B.mean()) ** 2).mean()\nprint(round(var_B, 2))\nprint(round(var_B / var_A, 1))", "expect": ["303.31", "9.3"], "hint": "var_B = ((B - B.mean()) ** 2).mean(). Compute var_A the same way so you can divide.", "figure": false, "activity": "Activity 06 \u00b7 Question 2", "terms": [["variance \u03c3\u00b2", "mean squared distance from the mean"]], "note": "", "demo_error": false}, {"id": "w6-3", "title": "Standard deviation, samples vs. populations", "stats": "<p>The <strong>standard deviation<\/strong> is the square root of the variance, which puts it back in the data's units. Think of it as the expected distance (margin of error) of a randomly picked value from the mean.<\/p><p>For a <strong>sample<\/strong>, divide by <em>n \u2212 1<\/em> instead of N. Using the sample mean uses up one <strong>degree of freedom<\/strong>, and dividing by n \u2212 1 corrects the sample's tendency to underestimate the POP's spread. Spreadsheets: <code>STDEV.P<\/code> (population) vs. <code>STDEV<\/code>/<code>STDEV.S<\/code> (sample).<\/p>", "python": "<p>\u26a0\ufe0f Python trap: NumPy and pandas use <em>different defaults<\/em>.<\/p><table class='mini'><tr><th><\/th><th>population (\u00f7N)<\/th><th>sample (\u00f7n\u22121)<\/th><\/tr><tr><td>pandas<\/td><td><code>s.std(ddof=0)<\/code><\/td><td><code>s.std()<\/code> \u2190 default<\/td><\/tr><tr><td>NumPy<\/td><td><code>np.std(x)<\/code> \u2190 default<\/td><td><code>np.std(x, ddof=1)<\/code><\/td><\/tr><\/table><p><code>ddof<\/code> = \"delta degrees of freedom\", the number subtracted from N. Always write it explicitly so a reader knows which one you meant.<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nvar_A = ((A - A.mean()) ** 2).mean()\nprint(\"by hand:        \", round(np.sqrt(var_A), 3))\nprint(\"population SD:  \", round(A.std(ddof=0), 3))\nprint(\"sample SD:      \", round(A.std(ddof=1), 3))", "starter": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\n\n# 1. print Group B's population SD (2 decimals)\n# 2. print Group B's sample SD (3 decimals)\n# 3. take the first 5 scores of B (B.head(5)) and print their population and sample SD (2 decimals each).\n#    Why is the gap between them so much bigger for n = 5?", "task": "Print Group B's population and sample SD, then both versions for just the first 5 scores. Notice when n \u2212 1 matters.", "solution": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nprint(round(B.std(ddof=0), 2))\nprint(round(B.std(ddof=1), 3))\nfive = B.head(5)\nprint(round(five.std(ddof=0), 2), round(five.std(ddof=1), 2))", "expect": ["17.42", "17.425"], "hint": "B.std(ddof=0) for population, B.std(ddof=1) for sample.", "figure": false, "activity": "Activity 06 \u00b7 Question 3", "terms": [["standard deviation", "\u221avariance; typical distance from the mean"], ["degrees of freedom", "number of values free to vary; n \u2212 1 for a sample SD"]], "note": "", "demo_error": false}, {"id": "w6-4", "title": "Variance from probabilities: how risky is a lottery?", "stats": "<p>With only values and probabilities (no sample), variance is the expected value of the squared distance from the mean:<\/p><p class='formula'>$$\\sigma^2 = \\sum (V_{event} - \\bar{V})^2 \\cdot P(event)$$<\/p><p>Here V\u0304 is the game's expected value. A huge SD relative to the EV means outcomes are wildly unpredictable. Almost everyone loses, and a rare few win big.<\/p>", "python": "<p>Same column math as before, but each squared distance is multiplied by its probability before summing. That's a <strong>weighted<\/strong> sum.<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\nsc = pd.read_csv(\"data/scratchers.csv\")\ng = sc[sc[\"game\"] == \"$10,000,000 Bankroll\"]\np = 1 / g[\"odds_1_in\"]\nev = (g[\"prize\"] * p).sum()\nvar = (((g[\"prize\"] - ev) ** 2) * p).sum()\nprint(\"EV:\", round(ev, 2), \" SD:\", round(np.sqrt(var), 2))", "starter": "import pandas as pd\nimport numpy as np\n\nsc = pd.read_csv(\"data/scratchers.csv\")\n\n# For the \"Lucky Lanes\" game print the expected value (3 decimals) and the SD of winnings (2 decimals).", "task": "Compute the expected value and the standard deviation of winnings for <em>Lucky Lanes<\/em>.", "solution": "import pandas as pd\nimport numpy as np\nsc = pd.read_csv(\"data/scratchers.csv\")\ng = sc[sc[\"game\"] == \"Lucky Lanes\"]\np = 1 / g[\"odds_1_in\"]\nev = (g[\"prize\"] * p).sum()\nvar = (((g[\"prize\"] - ev) ** 2) * p).sum()\nprint(round(ev, 3))\nprint(round(np.sqrt(var), 2))", "expect": ["0.677", "3.53"], "hint": "Copy the demo and change the game name.", "figure": false, "activity": "Activity 06 \u00b7 6.2 (lottery variance)", "terms": [["weighted sum", "each value multiplied by its weight (here, probability) before adding"]], "note": "", "demo_error": false}, {"id": "w6-5", "title": "IQR: a spread measure that ignores outliers", "stats": "<p>The mean and SD use every value, so <strong>outliers<\/strong> (values far from the rest) pull them around. The <strong>IQR<\/strong> (Q3 \u2212 Q1) only looks at the middle 50%, so it's resistant to outliers, just as the median is.<\/p>", "python": "<p><code>s.quantile(0.75) - s.quantile(0.25)<\/code> gives the IQR, the same as <code>=QUARTILE(range,3) \u2212 QUARTILE(range,1)<\/code>. <code>pd.concat([s, pd.Series([500])])<\/code> tacks an extra value on, so you can see what one bad data-entry error does.<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\niqr_A = A.quantile(0.75) - A.quantile(0.25)\nprint(\"IQR A:\", round(iqr_A, 2), \"  SD A:\", round(A.std(), 2))\n\ntypo = pd.concat([A, pd.Series([1000.0])])      # someone typed 1000 instead of 100.0\nprint(\"with typo -> IQR:\", round(typo.quantile(0.75) - typo.quantile(0.25), 2), \"  SD:\", round(typo.std(), 2))", "starter": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\n\n# 1. print the IQR of Group B (2 decimals)\n# 2. add one outlier of 1000 to Group B and print the new IQR and the new SD (2 decimals each)", "task": "Print Group B's IQR, then add a 1000-point outlier and print the new IQR and SD. Which measure barely moved?", "solution": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nprint(round(B.quantile(0.75) - B.quantile(0.25), 2))\ntypo = pd.concat([B, pd.Series([1000.0])])\nprint(round(typo.quantile(0.75) - typo.quantile(0.25), 2), round(typo.std(), 2))", "expect": ["24.15"], "hint": "B.quantile(0.75) - B.quantile(0.25).", "figure": false, "activity": "Activity 06 \u00b7 Question 4", "terms": [["outlier", "a value far from the bulk of the data"], ["resistant measure", "barely affected by extreme values (median, IQR)"]], "note": "", "demo_error": false}, {"id": "w6-6", "title": "The mean as a model: DATA = MODEL + ERROR", "stats": "<p>The mean is a <strong>model<\/strong>: one number that represents and simplifies the data. Every model leaves something unexplained, its <strong>error<\/strong> (deviation, not mistake): <strong>DATA = MODEL + ERROR<\/strong>.<\/p><p>How good is the model? Compare the error variance (variance about the mean) with the total data variance (the mean of the squared values, i.e. variance about zero). The share explained is the <strong>Variance Accounted For<\/strong>:<\/p><p class='formula'>$$VAF = 1 - \\frac{\\sigma^2}{\\frac{1}{N}\\sum x_i^2}$$<\/p><p>A VAF near 1 means the model (mean) predicts most of the data. You'll see this same idea again as R\u00b2 in regression.<\/p>", "python": "<p>Making a model column and an error column shows DATA = MODEL + ERROR literally. <code>np.allclose(a, b)<\/code> checks that two arrays are equal (allowing for tiny rounding).<\/p>", "demo": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nmodel = A.mean()                    # one number predicts everyone\nerror = A - model\nprint(\"DATA = MODEL + ERROR holds:\", np.allclose(A, model + error))\nvaf = 1 - A.var(ddof=0) / (A ** 2).mean()\nprint(\"VAF for A:\", round(vaf, 4))", "starter": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\n\n# 1. print the VAF for Group B (4 decimals)\n# 2. print whether the mean is a BETTER model for A than for B  (VAF_A > VAF_B -> True/False)", "task": "Compute the VAF for Group B (4 decimals) and print whether the mean models Group A better than Group B.", "solution": "import pandas as pd\nimport numpy as np\n\niq = pd.read_csv(\"data/iq_spread.csv\")\nA, B = iq[\"group_A\"], iq[\"group_B\"]\nvaf_A = 1 - A.var(ddof=0) / (A ** 2).mean()\nvaf_B = 1 - B.var(ddof=0) / (B ** 2).mean()\nprint(round(vaf_B, 4))\nprint(vaf_A > vaf_B)", "expect": ["0.9706", "True"], "hint": "vaf_B = 1 - B.var(ddof=0) / (B ** 2).mean() \u2014 note ddof=0: the activity's formula uses the population variance.", "figure": false, "activity": "Activity 06 \u00b7 Question 5", "terms": [["model", "a simplified representation that makes predictions"], ["VAF", "proportion of total variance explained by the model"]], "note": "", "demo_error": false}, {"id": "w7-1", "title": "The normal curve and the 68\u201395\u201399.7 rule", "stats": "<p>The <strong>normal (bell) curve<\/strong> is symmetric, with mean, median and mode in the middle. When data are normal, fixed shares fall within each number of SDs of the mean: about <strong>68%<\/strong> within \u00b11 SD, <strong>95%<\/strong> within \u00b12, and <strong>99.7%<\/strong> within \u00b13.<\/p><p>Simulated college-age male weights: 79.4 \u00b1 11.4 kg, so most men weigh between 68.0 and 90.8 kg.<\/p>", "python": "<p>SciPy's <code>norm<\/code> replaces a Z-table:<\/p><ul><li><code>norm.cdf(x, mean, sd)<\/code>: share of the curve <em>below<\/em> x (the area to the left)<\/li><li><code>norm.sf(x, mean, sd)<\/code>: share <em>above<\/em> x (1 \u2212 cdf)<\/li><li>Share between a and b: <code>norm.cdf(b, ...) - norm.cdf(a, ...)<\/code><\/li><\/ul>", "demo": "from scipy.stats import norm\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nfor k in [1, 2, 3]:\n    print(f\"within \u00b1{k} SD: {norm.cdf(k) - norm.cdf(-k):.4f}\")\n\nmean, sd = 79.4, 11.4\nx = np.linspace(mean - 4*sd, mean + 4*sd, 300)\nplt.plot(x, norm.pdf(x, mean, sd))\nplt.fill_between(x, norm.pdf(x, mean, sd), where=(x > mean - sd) & (x < mean + sd), alpha=0.3)\nplt.title(\"Body mass of college-age males (simulated)\")\nplt.xlabel(\"Body mass (kg)\")\nplt.ylabel(\"Density\")\nplt.show()", "starter": "from scipy.stats import norm\n\nmean, sd = 79.4, 11.4\n\n# 1. share of men lighter than 90.8 kg (4 decimals)\n# 2. share between 68.0 kg and 102.2 kg (-1 SD to +2 SD), 4 decimals\n# 3. share heavier than 100 kg (4 decimals)", "task": "Using the normal model (79.4 \u00b1 11.4 kg), print the share of men under 90.8 kg, between 68.0 and 102.2 kg, and over 100 kg.", "solution": "from scipy.stats import norm\nmean, sd = 79.4, 11.4\nprint(f\"{norm.cdf(90.8, mean, sd):.4f}\")\nprint(f\"{norm.cdf(102.2, mean, sd) - norm.cdf(68.0, mean, sd):.4f}\")\nprint(f\"{norm.sf(100, mean, sd):.4f}\")", "expect": ["0.8413", "0.8186", "0.0354"], "hint": "Below: norm.cdf. Between: subtract two cdfs. Above: norm.sf.", "figure": false, "activity": "Activity 07 \u00b7 Question 1, 7.2", "terms": [["normal distribution", "symmetric bell curve defined by its mean and SD"], ["cdf", "cumulative share of the distribution below a value"]], "note": "", "demo_error": false}, {"id": "w7-2", "title": "Z scores", "stats": "<p>A <strong>Z score<\/strong> expresses a raw score in SD units from the mean: Z = (x \u2212 x\u0304) / SD. Z = +1 is one SD above the mean; negative Z is below. Converting to Z lets you compare scores from different scales, and with normal data each Z corresponds to a known percentile.<\/p>", "python": "<p>One line gives every city its Z score, just like filling <code>=(D2-$E$2)/$F$2<\/code> down a column:<\/p><pre>smoke[\"z\"] = (smoke[\"rate\"] - smoke[\"rate\"].mean()) / smoke[\"rate\"].std()<\/pre><p>pandas' <code>.std()<\/code> is the sample SD, matching the spreadsheet's <code>STDEV<\/code>.<\/p>", "demo": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nsmoke[\"z\"] = (smoke[\"rate\"] - smoke[\"rate\"].mean()) / smoke[\"rate\"].std()\nprint(\"mean rate:\", round(smoke[\"rate\"].mean(), 4), \" SD:\", round(smoke[\"rate\"].std(), 4))\nprint(\"Z range:\", round(smoke[\"z\"].min(), 2), \"to\", round(smoke[\"z\"].max(), 2))\nprint(smoke.loc[[\"Merced\"], [\"rate\", \"z\"]].round(3))", "starter": "import pandas as pd\n\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\n\n# 1. add a \"z\" column\n# 2. print San Diego's Z score (2 decimals) and whether it is above the mean (z > 0)\n# 3. print the share of cities with Z between -1 and +1 (3 decimals). Compare with 68%.", "task": "Add Z scores, then print San Diego's Z (2 decimals), whether San Diego is above the mean, and the share of cities within \u00b11 SD.", "solution": "import pandas as pd\ncity = pd.read_csv(\"data/city_health.csv\")\nsmoke = (city[city[\"Measure\"].str.startswith(\"Current smoking\")]\n         .groupby(\"CityName\")[[\"NumOccurrences\", \"PopulationCount\"]].sum())\nsmoke[\"rate\"] = smoke[\"NumOccurrences\"] / smoke[\"PopulationCount\"]\nsmoke[\"z\"] = (smoke[\"rate\"] - smoke[\"rate\"].mean()) / smoke[\"rate\"].std()\nz_sd = smoke.loc[\"San Diego\", \"z\"]\nprint(round(z_sd, 2))\nprint(z_sd > 0)\nprint(round(((smoke[\"z\"] > -1) & (smoke[\"z\"] < 1)).mean(), 3))", "expect": ["-1.59", "False", "0.677"], "hint": "Within \u00b11: ((smoke[\"z\"] > -1) & (smoke[\"z\"] < 1)).mean()", "figure": false, "activity": "Activity 07 \u00b7 Question 2", "terms": [["Z score", "(x \u2212 mean) \u00f7 SD"], ["standard score", "a score re-expressed on a common scale"]], "note": "", "demo_error": false}, {"id": "w7-3", "title": "Skewness and kurtosis", "stats": "<p>Real data isn't always normal. <strong>Skewness<\/strong> measures asymmetry. Positive skew has a long tail to the right (mode below the mean); negative skew has its tail to the left. <strong>Kurtosis<\/strong> measures how heavy the tails are: <em>mesokurtic<\/em> \u2248 normal, <em>leptokurtic<\/em> = sharper peak and heavier tails, <em>platykurtic<\/em> = flatter with lighter tails. A <strong>bimodal<\/strong> distribution has two peaks.<\/p>", "python": "<p><code>stats.skew(x)<\/code> is 0 for symmetric data. <code>stats.kurtosis(x)<\/code> reports <em>excess<\/em> kurtosis, which is 0 for a normal curve: positive = leptokurtic, negative = platykurtic.<\/p>", "demo": "import pandas as pd\nfrom scipy import stats\nimport matplotlib.pyplot as plt\n\niq = pd.read_csv(\"data/iq_groups.csv\")\nfor g in iq.columns:\n    print(f\"{g}: skew {stats.skew(iq[g]):.2f}, kurtosis {stats.kurtosis(iq[g]):.2f}\")\nplt.hist(iq[\"group_B\"], bins=30)\nplt.title(\"Group B: positively skewed\")\nplt.xlabel(\"IQ\")\nplt.ylabel(\"Frequency\")\nplt.show()", "starter": "import pandas as pd\nfrom scipy import stats\nimport matplotlib.pyplot as plt\n\nexams = pd.read_csv(\"data/exam_scores.csv\")\n\n# 1. print the skewness and kurtosis of the RU scores (2 decimals each)\n# 2. draw a histogram of RU scores (30 bins) with a title and axis labels\n#    What shape is it? Is the mean a good summary?", "task": "Print skewness and kurtosis for the Research University exam scores and plot their histogram. Describe the shape in your answer sheet.", "solution": "import pandas as pd\nfrom scipy import stats\nimport matplotlib.pyplot as plt\nexams = pd.read_csv(\"data/exam_scores.csv\")\nprint(round(stats.skew(exams[\"RU\"]), 2), round(stats.kurtosis(exams[\"RU\"]), 2))\nplt.hist(exams[\"RU\"], bins=30)\nplt.title(\"RU exam scores\")\nplt.xlabel(\"Score\")\nplt.ylabel(\"Frequency\")\nplt.show()", "expect": ["-1.4"], "hint": "stats.kurtosis(exams[\"RU\"]) \u2014 strongly negative kurtosis is a clue to a flat or two-humped shape.", "figure": true, "activity": "Activity 07 \u00b7 7.4, 7.6", "terms": [["skewness", "asymmetry; the tail points to the skewed side"], ["kurtosis", "tail heaviness; excess kurtosis is 0 for normal"], ["bimodal", "two peaks"]], "note": "", "demo_error": false}, {"id": "w7-4", "title": "The binomial distribution", "stats": "<p>Flip a coin 10 times. What's the chance of exactly 4 heads, in any order? The situation is a <strong>dichotomy<\/strong> (success/failure) repeated n times with the same success probability p. The <strong>binomial distribution<\/strong> gives every outcome's probability:<\/p><p class='formula'>$$P(s) = \\frac{n!}{s!(n-s)!}\\, p^s (1-p)^{n-s}$$<\/p><p>The fraction is the <strong>binomial coefficient<\/strong> \"n choose s\", the number of ways to arrange s successes.<\/p>", "python": "<ul><li><code>math.comb(10, 4)<\/code>: n choose s<\/li><li><code>stats.binom.pmf(4, 10, 0.5)<\/code>: P(exactly 4)<\/li><li><code>stats.binom.sf(7, 10, 0.5)<\/code>: P(more than 7), i.e. 8 or more<\/li><\/ul><p>You can also simulate: <code>rng.integers(0, 2, size=(99, 10))<\/code> is 99 trials \u00d7 10 flips, and <code>.sum(axis=1)<\/code> adds across each row to count heads per trial.<\/p>", "demo": "import math\nimport numpy as np\nfrom scipy import stats\nimport matplotlib.pyplot as plt\n\nprint(\"ways to get 4 heads in 10:\", math.comb(10, 4))\nprint(\"P(5 heads):\", round(stats.binom.pmf(5, 10, 0.5), 4))\n\nrng = np.random.default_rng()\nheads = rng.integers(0, 2, size=(99, 10)).sum(axis=1)       # 99 trials of 10 flips\ns = np.arange(11)\nsim = [(heads == k).mean() for k in s]                     # relative frequency of each outcome\nplt.bar(s - 0.2, sim, width=0.4, label=\"simulated (99 trials)\")\nplt.bar(s + 0.2, stats.binom.pmf(s, 10, 0.5), width=0.4, label=\"binomial formula\")\nplt.xlabel(\"Heads in 10 flips\")\nplt.ylabel(\"Probability\")\nplt.title(\"Binomial distribution, n = 10, p = 0.5\")\nplt.legend()\nplt.show()", "starter": "import math\nfrom scipy import stats\n\n# 1. print P(exactly 4 heads in 10 flips), 4 decimals\n# 2. print P(8 or more heads in 10 flips), 4 decimals   (hint: binom.sf(7, ...))\n# 3. a free-throw shooter makes 70%: print P(exactly 7 of 10), 4 decimals", "task": "Print P(exactly 4 heads), P(8 or more heads) in 10 flips, and P(exactly 7 of 10) for a 70% free-throw shooter.", "solution": "from scipy import stats\nprint(round(stats.binom.pmf(4, 10, 0.5), 4))\nprint(round(stats.binom.sf(7, 10, 0.5), 4))\nprint(round(stats.binom.pmf(7, 10, 0.7), 4))", "expect": ["0.2051", "0.0547", "0.2668"], "hint": "The free-throw question is binom.pmf(7, 10, 0.7).", "figure": false, "activity": "Activity 07 \u00b7 Question 3", "terms": [["binomial distribution", "probabilities of s successes in n independent yes/no trials"], ["binomial coefficient", "n choose k = n! / (k!(n\u2212k)!)"]], "note": "", "demo_error": false}, {"id": "w7-5", "title": "The Central Limit Theorem", "stats": "<p>The <strong>Central Limit Theorem (CLT)<\/strong>: if you take many samples and compute each one's <em>mean<\/em>, those means form a roughly bell-shaped <strong>sampling distribution<\/strong>, even when the original data are not bell-shaped. The RU exam scores are bimodal, but averages of 32 students pile up around the middle.<\/p>", "python": "<p>A loop that draws a sample and stores its mean each time builds the sampling distribution. <code>means.append(x)<\/code> adds to a list. <code>plt.subplot(1, 2, k)<\/code> puts two charts side by side.<\/p>", "demo": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng()\nru = pd.read_csv(\"data/exam_scores.csv\")[\"RU\"].to_numpy()\nmeans = []\nfor i in range(999):\n    means.append(rng.choice(ru, size=32, replace=False).mean())\n\nplt.figure(figsize=(9, 3.5))\nplt.subplot(1, 2, 1)\nplt.hist(ru, bins=30)\nplt.title(\"Individual RU scores\")\nplt.xlabel(\"Score\")\nplt.subplot(1, 2, 2)\nplt.hist(means, bins=30)\nplt.title(\"Means of 999 samples of 32\")\nplt.xlabel(\"Sample mean\")\nplt.show()", "starter": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\n\nrng = np.random.default_rng()\nprizes = pd.read_csv(\"data/company_raffle.csv\")[\"prize\"].to_numpy()   # very skewed!\n\n# 1. draw 2000 samples of size 50 WITH replacement (replace=True) and store each mean\n# 2. print the mean of the sample means (0 decimals) and the population mean (0 decimals)\n# 3. histogram of the sample means with a title and x-axis label", "task": "Apply the CLT to the very skewed raffle prizes: build a sampling distribution of 2,000 means (n = 50, with replacement), print the mean of the means and the population mean, and plot the histogram.", "solution": "import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nrng = np.random.default_rng()\nprizes = pd.read_csv(\"data/company_raffle.csv\")[\"prize\"].to_numpy()\nmeans = [rng.choice(prizes, size=50, replace=True).mean() for i in range(2000)]\nprint(round(np.mean(means), -2), round(prizes.mean(), 0))\nplt.hist(means, bins=40)\nplt.title(\"Sampling distribution of the mean (n = 50)\")\nplt.xlabel(\"Sample mean prize ($)\")\nplt.show()", "expect": ["1136.0"], "hint": "Inside a loop: means.append(rng.choice(prizes, size=50, replace=True).mean()).", "figure": true, "activity": "Activity 07 \u00b7 7.1, Question 5", "terms": [["Central Limit Theorem", "means of many samples are approximately normally distributed"], ["sampling distribution", "the distribution of a statistic across many samples"]], "note": "", "demo_error": false}, {"id": "w7-6", "title": "Our Frenemy: is a 90 vs. 83 difference just chance?", "stats": "<p>Your friend's 32 RU tutees averaged 90 and your 32 CSUSM tutees averaged 83. But both universities' populations average about 74. How unusual is each group? The theoretical route (800 choose 32) is astronomically large, so we answer it <strong>empirically<\/strong>: resample 999 random groups of 32 and see how often a group scores higher.<\/p><p>Percentile = 1 \u2212 S/N, where S is the number of resampled means above the observed mean. Both observed means turn out to be in high percentiles, so neither is likely due to random assignment alone.<\/p>", "python": "<p>Store the sample means in a NumPy array (<code>np.array(means)<\/code>) so you can count with a mask: <code>(means &gt; 83).sum()<\/code>.<\/p>", "demo": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\nexams = pd.read_csv(\"data/exam_scores.csv\")\ncsusm = exams[\"CSUSM\"].to_numpy()\n\nmeans = np.array([rng.choice(csusm, size=32, replace=False).mean() for i in range(999)])\nS = (means > 83).sum()\nprint(\"resampled means above 83:\", S, \"of 999\")\nprint(\"percentile of 83:\", round(1 - S / 999, 3))", "starter": "import numpy as np\nimport pandas as pd\n\nrng = np.random.default_rng()\nexams = pd.read_csv(\"data/exam_scores.csv\")\nru = exams[\"RU\"].to_numpy()\n\n# 1. resample 999 groups of 32 RU students and store the means\n# 2. print the percentile of the observed RU mean of 90 (3 decimals)\n# 3. print whether that percentile is above 0.95", "task": "Resample the RU population to find the percentile of your friend's group mean of 90, and print whether it's above the 95th percentile.", "solution": "import numpy as np\nimport pandas as pd\nrng = np.random.default_rng()\nexams = pd.read_csv(\"data/exam_scores.csv\")\nru = exams[\"RU\"].to_numpy()\nmeans = np.array([rng.choice(ru, size=32, replace=False).mean() for i in range(999)])\npct = 1 - (means > 90).sum() / 999\nprint(round(pct, 3))\nprint(pct > 0.95)", "expect": ["True"], "hint": "Copy the demo with ru instead of csusm and 90 instead of 83.", "figure": false, "activity": "Activity 07 \u00b7 Question 4", "terms": [["empirical approach", "answering by experiment/simulation instead of formulas"]], "note": "", "demo_error": false}, {"id": "w7-7", "title": "Standard error of the mean (SEM)", "stats": "<p>The SD of a sampling distribution of means has its own name: the <strong>standard error of the mean<\/strong>. It tells you how far a sample's mean typically lands from the population mean. You can estimate it from a single sample:<\/p><p class='formula'>$$SEM = \\frac{SD_{sample}}{\\sqrt{n}}$$<\/p><p>Bigger samples \u2192 smaller SEM \u2192 sample means closer to the truth. Don't confuse the two: <strong>SD<\/strong> describes the spread of the <em>data<\/em>; <strong>SEM<\/strong> describes the uncertainty of a <em>mean<\/em>.<\/p>", "python": "<p><code>np.sqrt<\/code> takes square roots, and <code>stats.sem(x)<\/code> computes SD/\u221an directly (sample SD, ddof=1).<\/p>", "demo": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\ncsusm = pd.read_csv(\"data/exam_scores.csv\")[\"CSUSM\"]\nsample = csusm.head(32)\nprint(\"SD of the 32:  \", round(sample.std(), 2))\nprint(\"SEM by formula:\", round(sample.std() / np.sqrt(32), 2))\nprint(\"stats.sem:     \", round(stats.sem(sample), 2))", "starter": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\n\nru = pd.read_csv(\"data/exam_scores.csv\")[\"RU\"]\n\n# 1. print the SEM for the first 32 RU scores (2 decimals)\n# 2. print the SEM using all 800 RU scores (3 decimals)\n# 3. print the ratio SEM_32 / SEM_800 (1 decimal). Compare it with sqrt(800/32).", "task": "Compute the RU SEM for n = 32 and n = 800, and the ratio between them. How does SEM change with sample size?", "solution": "import numpy as np\nimport pandas as pd\nfrom scipy import stats\nru = pd.read_csv(\"data/exam_scores.csv\")[\"RU\"]\nsem32 = stats.sem(ru.head(32))\nsem800 = stats.sem(ru)\nprint(round(sem32, 2))\nprint(round(sem800, 3))\nprint(round(sem32 / sem800, 1), round(np.sqrt(800 / 32), 1))", "expect": ["5.84", "1.201"], "hint": "stats.sem(ru.head(32)) and stats.sem(ru).", "figure": false, "activity": "Activity 07 \u00b7 Question 6", "terms": [["SEM", "SD \u00f7 \u221an; the expected error of a sample mean"]], "note": "", "demo_error": false}, {"id": "w8-1", "title": "Null and alternative hypotheses", "stats": "<p>A <strong>general hypothesis<\/strong> makes a prediction; a <strong>measurable hypothesis<\/strong> states it in testable form; a <strong>statistical hypothesis<\/strong> is a claim about a parameter. Two special statistical hypotheses form the backbone of testing:<\/p><ul><li><strong>H\u2080 (null)<\/strong>: no relationship, and any pattern is random chance (e.g. mean BMI of athletes = non-athletes)<\/li><li><strong>H\u2081 (alternative)<\/strong>: some relationship (means differ)<\/li><\/ul><p>They're mutually exclusive and exhaustive. We never \"prove\" H\u2081. Like modus tollens, we either <strong>reject H\u2080<\/strong> or <strong>fail to reject H\u2080<\/strong>, comparing the p-value with \u03b1 (usually 0.05).<\/p>", "python": "<p>A function can return text. This one turns a p-value and \u03b1 into the correct sentence, so you never write \"accept the null\" by accident. <code>alpha=0.05<\/code> in the definition is a <strong>default argument<\/strong>, used unless you pass a different value.<\/p>", "demo": "def decide(p, alpha=0.05):\n    if p < alpha:\n        return f\"p = {p} < {alpha}: reject H0 (statistically significant)\"\n    return f\"p = {p} >= {alpha}: fail to reject H0\"\n\nprint(decide(0.02))\nprint(decide(0.31))", "starter": "def decide(p, alpha=0.05):\n    if p < alpha:\n        return f\"p = {p} < {alpha}: reject H0 (statistically significant)\"\n    return f\"p = {p} >= {alpha}: fail to reject H0\"\n\n# 1. print the decision for p = 0.03 with the usual alpha\n# 2. print the decision for the same p with a stricter alpha of 0.01\n# 3. write H0 and H1 for \"athletes and non-athletes differ in BMI\" as two print() statements", "t
