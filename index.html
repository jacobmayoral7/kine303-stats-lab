  main.innerHTML = `<div class="crumb"><a href="#/home">~</a> / cheat-sheet</div><h1>Python cheat sheet</h1>
  <p style="color:var(--muted);max-width:70ch">Every piece of Python used in this course, in plain English, in the order you'll meet it. Keep this tab open while you practice.</p>
  <div class="cheat">
  ${sec("01 · Basics", [["print(\"hi\")", "show something in the output"], ["# note", "a comment; Python ignores it"], ["age = 21", "store 21 under the name age"], ["+  -  *  /  **", "add, subtract, multiply, divide, power"], ["round(x, 2)", "round to 2 decimals"], ["f\"mean = {m:.2f}\"", "text with a value filled in (2 decimals)"], ["{p:.1%}", "show 0.575 as 57.5%"]])}
  ${sec("02 · True / False", [["x > 100   x >= 100", "greater than / at least"], ["x == 5   x != 5", "equal? / not equal?"], ["a and b   a or b   not a", "combine questions"], ["(arr > 100).sum()", "COUNT the Trues (like COUNTIF)"], ["(arr > 100).mean()", "PROPORTION that are True"], ["&  |  ^", "and / or / exactly-one, for whole arrays"]])}
  ${sec("03 · Lists & loops", [["jumps = [41, 52, 47]", "a list of values"], ["len(jumps)  sum(jumps)", "how many / total"], ["jumps[0]", "first item (counting starts at 0)"], ["for j in jumps:\n    print(j)", "repeat for each item (indent 4 spaces!)"], ["for i in range(1000):", "repeat 1000 times"], ["count += 1", "add 1 to a running count"]])}
  ${sec("04 · Decisions & functions", [["if p < 0.05:\n    print(\"reject\")\nelse:\n    print(\"fail to reject\")", "run one block or the other"], ["def pct(a, b):\n    return 100 * a / b", "make your own reusable formula"], ["pct(3, 12)", "use it → 25.0"]])}
  ${sec("05 · Libraries", [["import numpy as np", "math on many numbers"], ["import pandas as pd", "tables (DataFrames)"], ["import matplotlib.pyplot as plt", "charts"], ["from scipy import stats", "statistics & tests"], ["import math", "factorial, comb, sqrt"]])}
  ${sec("06 · Tables (pandas)", [["df = pd.read_csv(\"data/x.csv\")", "load a CSV file"], ["df.head()   df.shape", "first rows / (rows, cols)"], ["df[\"age\"]", "one column"], ["df[\"age\"].mean()", "column average (also .median .std .sum .max .min)"], ["df[\"bmi\"] = df[\"kg\"] / df[\"m\"]**2", "new column from others (every row)"], ["df[df[\"age\"] > 30]", "keep only rows that pass a rule"], ["df.groupby(\"group\")[\"score\"].mean()", "average per group (pivot table)"], ["df.sort_values(\"score\")", "sort rows"]])}
  ${sec("07 · Charts", [["plt.plot(x, y)", "line chart (change over time)"], ["plt.bar(names, values)", "bar chart"], ["plt.hist(data, bins=20)", "histogram (distribution)"], ["plt.scatter(x, y)", "scatter plot (relationship)"], ["plt.title() plt.xlabel() plt.ylabel()", "ALWAYS: title + labels with units"], ["plt.show()", "draw it"]])}
  ${sec("08 · Randomness", [["rng = np.random.default_rng()", "make a random-number generator"], ["rng.integers(1, 7, size=100)", "100 die rolls (7 is excluded)"], ["rng.choice(data, size=30)", "random sample of 30"], ["rng.normal(100, 15, size=999)", "999 bell-curve values"]])}
  ${sec("09 · Describing data", [["s.std(ddof=1)", "sample SD (pandas default)"], ["s.std(ddof=0)", "population SD"], ["s.quantile(0.75)", "75th percentile (Q3)"], ["(s - s.mean()) / s.std()", "Z scores"], ["stats.sem(s)", "standard error SD/√n"], ["stats.norm.cdf(z)", "share of the bell curve below z"]])}
  ${sec("10 · Tests", [["stats.ttest_1samp(x, 35)", "one mean vs a value"], ["stats.ttest_rel(post, pre)", "same people twice"], ["stats.ttest_ind(a, b, equal_var=False)", "two different groups"], ["stats.f_oneway(a, b, c)", "3+ groups (ANOVA)"], ["stats.pearsonr(x, y)", "correlation"], ["stats.linregress(x, y)", "regression line"], ["stats.chi2_contingency(table)", "two categorical variables"], ["res.pvalue < 0.05", "reject H0?"]])}
  ${sec("11 · Reading errors", [["NameError", "misspelled name, or used before it was created"], ["SyntaxError", "missing ) or \" or : somewhere"], ["IndentationError", "the 4 spaces at the start of a line are off"], ["KeyError", "column name doesn't exist; print(df.columns)"], ["TypeError", "mixing text and numbers"]])}

function renderData() {
  let h = `<div class="crumb"><a href="#/home">~</a> / data</div><h1>Data files</h1>
  <p style="color:var(--muted);max-width:72ch">Every lesson reads its data from the <code>data/</code> folder, e.g. <code>pd.read_csv("data/mlb_data.csv")</code>. These are <b>simulated practice datasets</b> shaped like the Canvas spreadsheets. To use a real Canvas file, upload a CSV with the <i>same file name</i>; it replaces the practice copy in your browser. You can also upload a new file for your final project.</p>
  <div class="card"><h3>Upload a CSV</h3><input type="file" id="up" accept=".csv,text/csv"> <span id="upMsg" style="color:var(--muted)"></span></div><div class="card">`;
  const names = new Set([...COURSE.datasets.map(d => d[0]), ...Object.keys(S.uploads || {})]);
  [...names].forEach(name => {
    const meta = COURSE.datasets.find(d => d[0] === name);
    const up = S.uploads && S.uploads[name];
    h += `<div class="datarow"><div><code>data/${esc(name)}</code> ${up ? '<span class="chip py">your upload</span>' : ""}<br><small>${meta ? esc(meta[1]) + " · " + esc(meta[2]) : "Uploaded file"}</small></div>
      <div><button class="btn" data-dl="${esc(name)}">↓ Download</button>${up ? ` <button class="btn" data-rm="${esc(name)}">Remove upload</button>` : ""}</div></div>`;
  });
  main.innerHTML = h + "</div>";
  main.querySelectorAll("[data-dl]").forEach(b => b.onclick = () => {
    const name = b.dataset.dl, text = (S.uploads && S.uploads[name]) || DATA[name];
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: "text/csv"})); a.download = name; a.click();
  });
  main.querySelectorAll("[data-rm]").forEach(b => b.onclick = () => {
    const name = b.dataset.rm; delete S.uploads[name]; save();
    if (pyodide) { if (DATA[name]) pyodide.FS.writeFile("/home/pyodide/data/" + name, DATA[name]); else try { pyodide.FS.unlink("/home/pyodide/data/" + name); } catch (e) {} }
    renderData();
  });
  document.getElementById("up").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const name = f.name.replace(/[^\w.\-]/g, "_");
    const text = await f.text();
    if (text.length > 1500000) { document.getElementById("upMsg").textContent = "That file is over 1.5 MB, so it can't be stored. Trim it to the columns you need."; return; }
    S.uploads[name] = text; save();
    if (pyodide) pyodide.FS.writeFile("/home/pyodide/data/" + name, text);
    renderData(); document.getElementById("upMsg").textContent = `Saved as data/${name}`;
  };
}
